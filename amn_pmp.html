const ek=(wk,p,ph,person,day)=>`${wk}||${p}||${ph}||${person}||${day}`;
const RATE_EPOCH='2000-01-01';
// Pick the rate from an effective-dated list [{from,rate}] that applies on ISO date `d`.
function rateFromHistory(list,d){
  if(!Array.isArray(list)||!list.length)return 0;
  const sorted=list.slice().sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0);
  let r=sorted[0].rate;                 // rate before/at the first entry
  for(const e of sorted){if(e.from<=d)r=e.rate;else break;}
  return parseFloat(r)||0;
}
// Convert a week key (+ optional day index) to the ISO date of the work.
function dateForWk(wk,day){const base=planWkToDate(wk);const d=day!=null?addDays(base,Math.min(parseInt(day)||0,6)):base;return isoDate(d);}
// The BILLABLE rate for `person` on project `proj` at ISO date `d`:
// project override (if any) wins over the person's standard rate; both are dated.
function billableOn(person,proj,d){
  const projObj=proj?st.projects.find(p=>p.name===proj):null;
  const ov=projObj&&projObj.rateOverrides&&projObj.rateOverrides[person];
  if(Array.isArray(ov)&&ov.length)return rateFromHistory(ov,d);
  const u=findPerson(person);if(!u)return 0;
  return(Array.isArray(u.rates)&&u.rates.length)?rateFromHistory(u.rates,d):(parseFloat(u.billable)||0);
}
// The COST rate for `person` at ISO date `d` (cost is not project-specific).
function costOn(person,d){const u=findPerson(person);if(!u)return 0;return(Array.isArray(u.costRates)&&u.costRates.length)?rateFromHistory(u.costRates,d):(parseFloat(u.cost)||0);}

function dailyHours(person){const u=st.users.find(x=>x.name===person);return u?(u.weeklyHours||37.5)/5:7.5;}
function defaultAllowance(person,year){
  const u=st.users.find(x=>x.name===person);
  const wk=u?(u.weeklyHours||37.5):37.5;
  let frac=1;
  if(u&&u.startDate){
    const sd=parseISO(u.startDate);
    const y=year||new Date().getFullYear();
    if(sd.getFullYear()>y)frac=0;
    else if(sd.getFullYear()===y){
      const yearStart=new Date(y,0,1),yearEnd=new Date(y,11,31);
      const total=Math.round((yearEnd-yearStart)/86400000)+1;
      const left=Math.round((yearEnd-sd)/86400000)+1;
      frac=Math.max(0,Math.min(1,left/total));
    }
  }
  return Math.round(25*(wk/37.5)*frac*2)/2;
}
function leaveAllowanceFor(person,year){const v=st.leaveAllowances[`${person}||${year}`];return typeof v==='number'?v:defaultAllowance(person,year);}
function openDaysIn(startISO,endISO){let n=0,d=parseISO(startISO);const end=parseISO(endISO);while(d<=end){if(!isClosedDate(d))n++;d=addDays(d,1);}return n;}
// Day value of a request on a given open day: 0.5 if flagged half, else 1.
function reqDays(r){let t=0,d=parseISO(r.startDate);const end=parseISO(r.endDate);while(d<=end){if(!isClosedDate(d))t+=(r.halfDays&&r.halfDays[isoDate(d)])?0.5:1;d=addDays(d,1);}return t;}
// Per-type booked days in a calendar year (approved requests; closures count as Annual leave).
function typeBookedDays(person,year,type){
  let t=0;
  for(const r of st.leaveRequests){
    if(r.person!==person||r.status!=='approved'||r.type!==type)continue;
    let d=parseISO(r.startDate);const end=parseISO(r.endDate);
    while(d<=end){if(!isClosedDate(d)&&d.getFullYear()===year)t+=(r.halfDays&&r.halfDays[isoDate(d)])?0.5:1;d=addDays(d,1);}
  }
  return t;
}
function bookedDays(person,year){return typeBookedDays(person,year,'Annual leave');}
function pendingDays(person,year){
  let t=0;
  for(const r of st.leaveRequests){
    if(r.person!==person||r.status!=='pending'||r.type!=='Annual leave')continue;
    let d=parseISO(r.startDate);const end=parseISO(r.endDate);
    while(d<=end){if(!isClosedDate(d)&&d.getFullYear()===year)t+=(r.halfDays&&r.halfDays[isoDate(d)])?0.5:1;d=addDays(d,1);}
  }
  return t;
}
// Carry-over: admin-editable number per person/year; if unset, auto min(5, prev unused).
const LEAVE_BASE_YEAR=2026;
function carryIn(person,year){
  const k=`${person}||${year}`;
  if(typeof st.leaveCarry[k]==='number')return st.leaveCarry[k];
  if(year<=LEAVE_BASE_YEAR)return 0;
  const prev=year-1;
  const rem=leaveAllowanceFor(person,prev)+carryIn(person,prev)-bookedDays(person,prev);
  return Math.min(5,Math.max(0,rem));
}
function leaveRemaining(person,year){return leaveAllowanceFor(person,year)+carryIn(person,year)-bookedDays(person,year);}
function normLeaveReq(r){
  if(!r.type)r.type='Annual leave';
  if(typeof r.halfDays!=='object'||!r.halfDays||Array.isArray(r.halfDays))r.halfDays={};
  // v1 shape: halfDay:true on a single-day request
  if(r.halfDay&&r.startDate===r.endDate)r.halfDays[r.startDate]=true;
  delete r.halfDay;
  if(typeof r.note!=='string')r.note='';
  if(typeof r.adminNote!=='string')r.adminNote='';if(typeof r.adminActionDue!=='string')r.adminActionDue='';if(typeof r.adminActionDone!=='boolean')r.adminActionDone=false;
  if(!Array.isArray(r.timeWrites))r.timeWrites=[];
  if(!Array.isArray(r.timeSkipped))r.timeSkipped=[];
  return r;
}
function approvedReqCovering(person,dateISO,type){return st.leaveRequests.find(r=>r.status==='approved'&&r.person===person&&(!type||r.type===type)&&r.startDate<=dateISO&&r.endDate>=dateISO);}
function reqCoveringAny(person,dateISO){return st.leaveRequests.find(r=>(r.status==='approved'||r.status==='pending')&&r.person===person&&r.startDate<=dateISO&&r.endDate>=dateISO);}
function pendingLeaveOverlapsWeek(person,wk){
  const mon=planWkToDate(wk),sun=addDays(mon,6);
  const s=isoDate(mon),e=isoDate(sun);
  return st.leaveRequests.some(r=>r.person===person&&r.status==='pending'&&r.startDate<=e&&r.endDate>=s);
}
// Approval rule: nobody approves their own leave, unless flagged selfApproveLeave
// (Anne-Marie) or they are the only active admin.
function canApproveLeave(r){
  if(!isAdmin())return false;
  if(r.person!==st.currentUser)return true;
  const u=cur();
  if(u&&u.selfApproveLeave)return true;
  return st.users.filter(x=>x.role==='admin'&&!x.deactivated).length<2;
}
// Approved leave writes the request's own type into the timesheet per open day —
// withdraw-then-rewrite, idempotent. Days before timeFloor (imports) are records only.
// If a day falls in an already-submitted week, that week is REOPENED (submission
// withdrawn), the hours are written, and the person gets a notice to resubmit —
// so the AL calendar, forecast and timesheets can never disagree (Joe, 15 Jul).
function applyLeaveTime(r){
  for(const w of (r.timeWrites||[])){const{wk,dayIdx}=dateToWkDay(parseISO(w.date));delete st.leave[lk(wk,w.type||r.type,w.person,dayIdx)];}
  r.timeWrites=[];r.timeSkipped=[];
  if(r.status!=='approved'){save();return;}
  const hrs=dailyHours(r.person);
  const reopened=new Set();
  let d=parseISO(r.startDate);const end=parseISO(r.endDate);
  while(d<=end){
    if(!isClosedDate(d)){
      const iso=isoDate(d);
      if(!r.timeFloor||iso>=r.timeFloor){
        const{wk,dayIdx}=dateToWkDay(d);
        const dayHrs=(r.halfDays&&r.halfDays[iso])?hrs/2:hrs;
        if(isSub(r.person,wk)){noUndo(()=>{delete st.submissions[`${r.person}||${wk}`];});reopened.add(wk);}
        addLeaveActive(wk,r.person,r.type);
        st.leave[lk(wk,r.type,r.person,dayIdx)]=dayHrs;
        r.timeWrites.push({person:r.person,date:iso,hours:dayHrs,type:r.type});
      }
    }
    d=addDays(d,1);
  }
  for(const wkk of reopened){
    const mon=planWkToDate(wkk);
    pushLeaveNotice(r.person,r.id,`Approved ${r.type.toLowerCase()} (${fmt(parseISO(r.startDate))}${r.startDate!==r.endDate?' – '+fmt(parseISO(r.endDate)):''}) was added to your submitted week ${fmt(mon)} – ${fmt(addDays(mon,6))}. The timesheet has been reopened — please review and resubmit it.`);
  }
  save();
}
// Office closures are ordinary approved AL requests (one per person, flagged
// closure) so they appear everywhere leave appears; the closure record just groups
// them for listing/removal.
function createClosureRequests(c){
  for(const u of st.users.filter(x=>!x.deactivated)){
    const r={id:'lr'+Date.now()+Math.floor(Math.random()*100000)+u.name.length,person:u.name,type:'Annual leave',startDate:c.startDate,endDate:c.endDate,halfDays:{},note:c.label,adminNote:'',adminActionDue:'',adminActionDone:false,status:'approved',source:'closure',closure:true,closureId:c.id,requestedAt:new Date().toISOString(),requestedBy:st.currentUser||'admin',decidedBy:st.currentUser||'admin',decidedAt:new Date().toISOString(),timeWrites:[],timeSkipped:[]};
    st.leaveRequests.push(r);
    applyLeaveTime(r);

// Shared creation path: balance check for AL, self-approve shortcut, on-behalf notices.
function createLeaveRequest(person,type,startDate,endDate,halfDays,note,source){
  const r={id:'lr'+Date.now()+Math.floor(Math.random()*1000),person,type,startDate,endDate,halfDays:halfDays||{},note:note||'',adminNote:'',adminActionDue:'',adminActionDone:false,status:'pending',source:source||'leave',requestedAt:new Date().toISOString(),requestedBy:st.currentUser,timeWrites:[],timeSkipped:[]};
  const year=parseISO(startDate).getFullYear();
  if(type==='Annual leave'&&reqDays(r)>leaveRemaining(person,year)-pendingDays(person,year)){
    return{error:`That request (${reqDays(r)} day${reqDays(r)===1?'':'s'}) exceeds ${person===st.currentUser?'your':escAttr(person)+"'s"} remaining ${year} allowance once pending requests are counted. Consider requesting Unpaid leave or Unpaid parental leave instead.`};
  }
  const onBehalf=person!==st.currentUser;
  if(onBehalf){
    if(!isAdmin())return{error:'Only an admin can record leave for someone else.'};
    r.status='approved';r.decidedBy=st.currentUser;r.decidedAt=new Date().toISOString();
    st.leaveRequests.push(r);
    applyLeaveTime(r);
    pushLeaveNotice(person,r.id,`${st.currentUser} ${source==='edit'?'amended your leave to':'recorded'} ${type} ${source==='edit'?'':'for you '}(${fmt(parseISO(startDate))}${startDate!==endDate?' – '+fmt(parseISO(endDate)):''}) — please check it's correct.`);
    save();
    return{request:r};
  }
  const u=cur();
  if(isAdmin()&&u&&u.selfApproveLeave){
    r.status='approved';r.decidedBy=st.currentUser;r.decidedAt=new Date().toISOString();
    st.leaveRequests.push(r);
    applyLeaveTime(r);
    return{request:r};
  }
  st.leaveRequests.push(r);
  save();
  return{request:r};
}

// Month calendar — person × day grid modelled on the practice's tracker. Leave TYPE
// is private: visible only for your own leave and to admins; everyone else sees a
// neutral "Leave" block. Pending shows as a dashed outline.
// ── Team-calendar grab handles — dragging an edge edits the underlying request
// via editLeaveDates, so an amended approved request re-enters approval unless
// the editor can approve it themselves (exactly like dragging bars on the Forecast).
function lvCalIsEdgeL(r,iso){let d=parseISO(r.startDate);while(isoDate(d)<iso){if(!isClosedDate(d))return false;d=addDays(d,1);}return true;}
function lvCalIsEdgeR(r,iso){let d=parseISO(r.endDate);while(isoDate(d)>iso){if(!isClosedDate(d))return false;d=addDays(d,-1);}return true;}
let lvCalDrag=null,lvCalCols=null;
window.lvCalResizeStart=function(e,side,person,reqId){
  e.preventDefault();e.stopPropagation();
  const r=st.leaveRequests.find(x=>x.id===reqId);if(!r||r.closure)return;
  if(!(isAdmin()||person===st.currentUser))return;
  lvCalCols=[...document.querySelectorAll('table.lv-cal thead th.lv-cal-day')].map(th=>{const b=th.getBoundingClientRect();return{iso:th.dataset.iso,left:b.left,right:b.right};});
  lvCalDrag={side,person,reqId,start:r.startDate,end:r.endDate,curISO:side==='l'?r.startDate:r.endDate};
  document.addEventListener('mousemove',lvCalMoveHandler);
  document.addEventListener('mouseup',lvCalResizeEnd,{once:true});
}
function lvCalISOAtX(x){
  if(!lvCalCols||!lvCalCols.length)return null;
  for(const c of lvCalCols)if(x>=c.left&&x<c.right)return c.iso;
  return x<lvCalCols[0].left?lvCalCols[0].iso:lvCalCols[lvCalCols.length-1].iso;
}
function lvCalRange(d){
  let ns=d.start,ne=d.end;
  if(d.side==='l')ns=d.curISO>ne?ne:d.curISO;else ne=d.curISO<ns?ns:d.curISO;
  return[ns,ne];
}
function lvCalMoveHandler(e){
  if(!lvCalDrag)return;
  const iso=lvCalISOAtX(e.clientX);if(!iso)return;
  lvCalDrag.curISO=iso;
  const[ns,ne]=lvCalRange(lvCalDrag);
  document.querySelectorAll('td[data-lvp]').forEach(td=>{
    td.classList.toggle('lvcal-prev',td.dataset.lvp===lvCalDrag.person&&td.dataset.lviso>=ns&&td.dataset.lviso<=ne);
  });
}
window.lvCalResizeEnd=function(e){
  document.removeEventListener('mousemove',lvCalMoveHandler);
  const d=lvCalDrag;lvCalDrag=null;
  document.querySelectorAll('td.lvcal-prev').forEach(td=>td.classList.remove('lvcal-prev'));
  if(!d)return;
  const[ns,ne]=lvCalRange(d);
  if(ns===d.start&&ne===d.end)return; // plain click on the handle — fall through to the view modal
  _lvSwallowClick=true;
  editLeaveDates(d.person,d.start,ns,ne);
  render();
}

const SCHOOL_HOLS=[

function inSchoolHol(iso){return SCHOOL_HOLS.some(r=>iso>=r[0]&&iso<=r[1]);}
function buildLeaveCalendar(){

    const bh=!wknd&&UK_BH.has(iso);
    h+=`<th class="lv-cal-day ${wknd?'lv-cal-closed':''}${bh?' lv-cal-bhh':''}${iso===_todayISO?' lv-today-h':''}" data-iso="${iso}" style="min-width:22px;font-weight:${wknd||bh?400:600}" ${bh?'title="Bank holiday"':''}>${['S','M','T','W','T','F','S'][dt.getDay()]}<br>${d}${bh?'<br><span style="font-size:7px;color:#B8860B;font-weight:700">BH</span>':''}</th>`;

// ── Non-billable helpers ───────────────────────────────────────────────────────
const nbk=(wk,type,person,day)=>`${wk}||${type}||${person}||${day}`;
const nbak=(wk,person)=>`${wk}||${person}`;
function gNB(wk,type,person,day){return parseFloat(st.nonBillable[nbk(wk,type,person,day)])||0;}
function sNB(wk,type,person,day,val){const k=nbk(wk,type,person,day);const v=parseFloat(val)||0;if(v>0)st.nonBillable[k]=v;else delete st.nonBillable[k];save();}
function getNBActive(wk,person){return st.nonBillableActive[nbak(wk,person)]||[];}
function addNBActive(wk,person,type){const k=nbak(wk,person);const a=st.nonBillableActive[k]||[];if(!a.includes(type)){st.nonBillableActive[k]=[...a,type];save();}}
function rmNBActive(wk,person,type){const k=nbak(wk,person);st.nonBillableActive[k]=(st.nonBillableActive[k]||[]).filter(t=>t!==type);for(let i=0;i<14;i++)delete st.nonBillable[nbk(wk,type,person,i)];save();}
function getNBOT(wk,type,person){return !!st.nbOvertime[`${wk}||${type}||${person}`];}
function setNBOT(wk,type,person,val){const k=`${wk}||${type}||${person}`;if(val)st.nbOvertime[k]=true;else delete st.nbOvertime[k];save();}
function wkNBHrs(wk,person){let t=0;for(const[k,v]of Object.entries(st.nonBillable)){const parts=k.split('||');if(parts[0]===wk&&parts[2]===person&&parseInt(parts[3])<5)t+=parseFloat(v)||0;}return t;}

// ── userStages helpers ─────────────────────────────────────────────────────────
function getUserStages(person,projName){return(st.userStages[person]||{})[projName]||[];}
function setUserStages(person,projName,stages){if(!st.userStages[person])st.userStages[person]={};st.userStages[person][projName]=stages;save();}
// ── Week-scoped timesheet rows ─────────────────────────────────────────────────
// The global userProjects/userStages lists are the person's CURRENT palette —
// they drive this week and future weeks. Past weeks derive their rows from the
// hours actually logged that week, plus any rows added to that week
// specifically (tsWeekRows, keyed person||wk). Consequences: removing a row
// only ever affects the week you're on (current/future edits change the
// palette; past-week edits change that week alone), and a row with hours in a
// week can never disappear from it.
function tswKey(person,wk){return person+'||'+wk;}
function tsWeekExtra(person,wk){return(st.tsWeekRows||{})[tswKey(person,wk)]||{projects:[],stages:{}};}
function setTsWeekExtra(person,wk,v){
  const any=(v.projects||[]).length||Object.keys(v.stages||{}).some(k=>(v.stages[k]||[]).length);
  if(any)st.tsWeekRows[tswKey(person,wk)]=v;else delete st.tsWeekRows[tswKey(person,wk)];
}
function entryProjectsForWeek(wk,person){
  const out=new Set();
  for(const k of Object.keys(st.entries)){const p=k.split('||');if(p[0]===wk&&p[3]===person&&(parseFloat(st.entries[k])||0)>0)out.add(p[1]);}
  return out;
}
function entryStagesForWeek(wk,person,projName){
  const out=new Set();
  for(const k of Object.keys(st.entries)){const p=k.split('||');if(p[0]===wk&&p[3]===person&&p[1]===projName&&(parseFloat(st.entries[k])||0)>0)out.add(p[2]);}
  return out;
}
function isPastWk(wk){return wk<wkKey(getWkDates(0));}
function tsProjectsForWeek(wk,person){
  const base=isPastWk(wk)?tsWeekExtra(person,wk).projects:(st.userProjects[person]||[]);
  const out=[...base];
  for(const p of entryProjectsForWeek(wk,person))if(!out.includes(p))out.push(p);
  return out;
}
function tsStagesForWeek(wk,person,projName){
  const base=isPastWk(wk)?(tsWeekExtra(person,wk).stages[projName]||[]):getUserStages(person,projName);
  const out=[...base];
  for(const sname of entryStagesForWeek(wk,person,projName))if(!out.includes(sname))out.push(sname);
  return out;
}

// ── Project hours & total ──────────────────────────────────────────────────────
function wkProjHrs(wk,person){let t=0;for(const[k,v]of Object.entries(st.entries)){const parts=k.split('||');if(parts[0]===wk&&parts[3]===person&&parseInt(parts[4])<7)t+=parseFloat(v)||0;}return t;}
function bhInWeek(days){const r=[];for(let i=0;i<5;i++){const d=days[i];const iso=isoDate(d);if(UK_BH.has(iso))r.push({dayIdx:i,iso});}return r;}
function gE(wk,p,ph,person,day){return st.entries[ek(wk,p,ph,person,day)]||'';}
function sE(wk,p,ph,person,day,val){const k=ek(wk,p,ph,person,day);const v=parseFloat(val);if(!isNaN(v)&&v>0)st.entries[k]=v;else delete st.entries[k];save();}
function gF(wk,p,ph,person,day){return st.forecasts[ek(wk,p,ph,person,day)]||'';}
function sFRaw(wk,p,ph,person,day,val){const k=ek(wk,p,ph,person,day);const v=parseFloat(val);if(!isNaN(v)&&v>0)st.forecasts[k]=v;else delete st.forecasts[k];}

// ── Resource planner helpers ────────────────────────────────────────────────────
// Assignments are a friendly UI layer on top of the same st.forecasts store used
// everywhere else (Reports, Project Health, CSV export) — no downstream code changes.
// Assignments are stored as real calendar date ranges (startDate/endDate, ISO
// 'YYYY-MM-DD'), not week buckets — this lets bars be day-precise and lets the
// planner page indefinitely into the past/future without artificial windows.
function isoDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function startOfWeek(d){const dow=d.getDay();return addDays(d,dow===0?-6:1-dow);}
function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function isWeekendDate(d){const dow=d.getDay();return dow===0||dow===6;}
function isClosedDate(d){return isWeekendDate(d)||UK_BH.has(isoDate(d));} // office closed: weekend or UK bank holiday
function dateToWkDay(d){const dow=d.getDay();const dayIdx=dow===0?6:dow-1;const mon=addDays(d,-dayIdx);return{wk:wkKey([mon]),dayIdx};}
function relTime(iso){
  if(!iso)return'';
  const mins=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(mins<1)return'just now';if(mins<60)return`${mins} minute${mins===1?'':'s'} ago`;
  const hrs=Math.round(mins/60);if(hrs<24)return`${hrs} hour${hrs===1?'':'s'} ago`;
  const days=Math.round(hrs/24);return`${days} day${days===1?'':'s'} ago`;
}
// planWkToDate is a guaranteed-correct inverse of wkKey (derived algebraically from wkKey's
// own day-count formula) — kept only to migrate assignments saved in the previous week-bucket
// format. The existing global wkKeyToDate has a latent rounding inconsistency in some years.
function planWkToDate(wk){const[yr,wn]=wk.split('-W').map(Number);const jan1=new Date(yr,0,1);const jan1Dow=jan1.getDay();const k0=((1-jan1Dow)%7+7)%7;return new Date(yr,0,1+(wn-1)*7+k0);}

function applyPlanAssignment(a){
  let d=parseISO(a.startDate);const end=parseISO(a.endDate);
  while(d<=end){if(!isClosedDate(d)){const{wk,dayIdx}=dateToWkDay(d);sFRaw(wk,a.project,a.stage,a.person,dayIdx,a.hrsPerDay);}d=addDays(d,1);}
}
function clearPlanAssignmentRange(a){
  let d=parseISO(a.startDate);const end=parseISO(a.endDate);
  while(d<=end){if(!isClosedDate(d)){const{wk,dayIdx}=dateToWkDay(d);sFRaw(wk,a.project,a.stage,a.person,dayIdx,0);}d=addDays(d,1);}
}
function addPlanAssignment(project,stage,person,startDate,endDate,hrsPerDay,notes){
  const id='pa'+Date.now()+Math.floor(Math.random()*10000);
  const a={id,project,stage,person,startDate,endDate,hrsPerDay,notes:notes||'',updatedAt:new Date().toISOString(),updatedBy:cur()?.name||''};
  st.planAssignments.push(a);applyPlanAssignment(a);save();
  // Heads-up (never a block): count the entry's open days that land on this
  // person's approved/pending leave, so a deadline booking can't hide a holiday.
  const rgs=personLeaveRanges(person);
  if(rgs.length){let n=0,d=parseISO(startDate);const e=parseISO(endDate);
    while(d<=e){if(!isClosedDate(d)){const iso=isoDate(d);if(rgs.some(r=>iso>=r.s&&iso<=r.e))n++;}d=addDays(d,1);}
    if(n)undoToast(`Heads-up: ${n} day${n===1?'':'s'} of this entry fall${n===1?'s':''} on ${person}'s leave`);
  }
  return a;
}
function updatePlanAssignment(id,changes){
  const a=st.planAssignments.find(x=>x.id===id);if(!a)return;
  clearPlanAssignmentRange(a);Object.assign(a,changes);a.updatedAt=new Date().toISOString();a.updatedBy=cur()?.name||'';applyPlanAssignment(a);save();
}
function removePlanAssignment(id){
  const a=st.planAssignments.find(x=>x.id===id);if(!a)return;
  clearPlanAssignmentRange(a);st.planAssignments=st.planAssignments.filter(x=>x.id!==id);save();
}
function planRowKey(project,stage){return `${project}||${stage}`;}
function getPlanRows(project,stage){
  const explicit=st.planRows[planRowKey(project,stage)]||[];
  const fromAssign=st.planAssignments.filter(a=>a.project===project&&a.stage===stage).map(a=>a.person);
  return[...new Set([...explicit,...fromAssign])];
}
function addPlanRow(project,stage,person){const k=planRowKey(project,stage);const arr=st.planRows[k]||[];if(!arr.includes(person)){st.planRows[k]=[...arr,person];save();}}
function removePlanRow(project,stage,person){
  const k=planRowKey(project,stage);
  st.planRows[k]=(st.planRows[k]||[]).filter(p=>p!==person);
  st.planAssignments.filter(a=>a.project===project&&a.stage===stage&&a.person===person).forEach(clearPlanAssignmentRange);
  st.planAssignments=st.planAssignments.filter(a=>!(a.project===project&&a.stage===stage&&a.person===person));
  save();
}
// ── Calendar columns for the planner grid, generalised across day/week/month views ──
// One place that decides a cell's column-level classes, so bank-holiday shading
// runs the full height of the table rather than appearing only in the header.
function planColCls(c){return `${c.isToday?' plan-today-cell':''}${c.isWeekend?' plan-weekend-cell':''}${c.isBH?' plan-bh-cell':''}${(!c.isBH&&c.bhCount)?' plan-bhweek-cell':''}`;}
function planColumnsFor(view,offsetDays){
  const today=new Date();today.setHours(0,0,0,0);
  const cols=[];
  if(view==='day'){
    const start=addDays(startOfWeek(today),offsetDays);
    for(let i=0;i<21;i++){
      const d=addDays(start,i);const wknd=isWeekendDate(d);const bh=UK_BH.has(isoDate(d));const closed=wknd||bh;
      cols.push({key:isoDate(d),start:d,end:d,days:1,label:d.toLocaleDateString('en-GB',{weekday:'short'}),subLabel:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}),isWeekend:closed,isBH:bh,isToday:isoDate(d)===isoDate(today),assignStart:closed?null:d,assignEnd:closed?null:d,msStart:d,msEnd:d});
    }
  } else if(view==='month'){
    const anchor=startOfMonth(addDays(today,offsetDays));
    for(let i=0;i<12;i++){
      const mStart=new Date(anchor.getFullYear(),anchor.getMonth()+i,1);
      const mEnd=new Date(anchor.getFullYear(),anchor.getMonth()+i+1,0);
      cols.push({key:`${mStart.getFullYear()}-${String(mStart.getMonth()+1).padStart(2,'0')}`,start:mStart,end:mEnd,days:31,label:mStart.toLocaleDateString('en-GB',{month:'short'}),subLabel:mStart.toLocaleDateString('en-GB',{year:'numeric'}),isWeekend:false,isToday:today>=mStart&&today<=mEnd,assignStart:null,assignEnd:null});
    }
  } else { // week
    const start=addDays(startOfWeek(today),offsetDays);
    for(let i=0;i<12;i++){
      const wkStart=addDays(start,i*7),wkEnd=addDays(wkStart,6),wkFri=addDays(wkStart,4);
      let bhN=0;{let dd=new Date(wkStart);while(dd<=wkEnd){if(UK_BH.has(isoDate(dd)))bhN++;dd=addDays(dd,1);}}
      cols.push({key:wkKey([wkStart]),start:wkStart,end:wkEnd,days:7,label:wkStart.toLocaleDateString('en-GB',{day:'numeric',month:'short'}),subLabel:'',isWeekend:false,bhCount:bhN,isToday:today>=wkStart&&today<=wkEnd,assignStart:wkStart,assignEnd:wkFri});
    }
  }
  return cols;
}
function overlapWeekdayCount(col,a){
  const s=(parseISO(a.startDate)>col.start)?parseISO(a.startDate):col.start;
  const e=(parseISO(a.endDate)<col.end)?parseISO(a.endDate):col.end;
  if(s>e)return 0;
  let n=0,d=new Date(s);while(d<=e){if(!isClosedDate(d))n++;d=addDays(d,1);}return n;
}
function planStageColHrs(proj,stageName,col){let t=0;for(const a of st.planAssignments)if(a.project===proj.name&&a.stage===stageName)t+=(a.hrsPerDay||0)*overlapWeekdayCount(col,a);return t;}

// ── Team forecast — utilization per person per column ───────────────────────────
function personProjHrsInCol(person,col){let t=0;for(const a of st.planAssignments)if(a.person===person)t+=(a.hrsPerDay||0)*overlapWeekdayCount(col,a);return t;}
function personLeaveNBHrsInCol(person,col){
  let t=0,d=new Date(col.start);
  while(d<=col.end){
    if(!isWeekendDate(d)){for(const e of personLeaveForDate(person,d))t+=e.hours;for(const e of personNBForDate(person,d))t+=e.hours;}
    d=addDays(d,1);
  }
  return t;
}
function personCapacityInCol(person,col){
  const p=findPerson(person);
  return((p?.weeklyHours||37.5)/5)*overlapWeekdayCount(col,{startDate:isoDate(col.start),endDate:isoDate(col.end)});
}
function personUtilStatus(person,col){
  const capacity=personCapacityInCol(person,col);
  const allocated=personProjHrsInCol(person,col)+personLeaveNBHrsInCol(person,col);
  if(capacity<=0||allocated<=0)return null;
  const diff=allocated-capacity;
  if(Math.abs(diff)<0.05)return{status:'full',label:'Full'};
  if(diff>0)return{status:'over',label:`${diff.toFixed(1)} over`};
  return{status:'open',label:`${(-diff).toFixed(1)} open`};
}
// Breaks a person's allocation for a period down by source (which projects/stages,
// which leave type, which non-billable category) — shown in a popover on the Team
// view so an over/under status can be explained without visiting Timesheets.
function personBreakdownInCol(person,col){
  const proj={};
  for(const a of st.planAssignments){
    if(a.person!==person)continue;
    const hrs=(a.hrsPerDay||0)*overlapWeekdayCount(col,a);
    if(hrs>0){const key=`${a.project} · ${a.stage}`;proj[key]=(proj[key]||0)+hrs;}
  }
  const leave={},nb={};
  let d=new Date(col.start);
  while(d<=col.end){
    if(!isWeekendDate(d)){
      for(const e of personLeaveForDate(person,d))leave[e.type]=(leave[e.type]||0)+e.hours;
      for(const e of personNBForDate(person,d))nb[e.type]=(nb[e.type]||0)+e.hours;
    }
    d=addDays(d,1);
  }
  return{proj,leave,nb};
}
function personProjectStages(person){
  const seen=new Set(),out=[];
  for(const a of st.planAssignments){
    if(a.person!==person)continue;
    const key=a.project+'||'+a.stage;
    if(!seen.has(key)){seen.add(key);out.push({project:a.project,stage:a.stage});}
  }
  return out;
}

// ── Project sort (shared with the Projects page's own sort state) ───────────────
function sortedProjects(){
  const sortBy=st._projSort.by,dir=st._projSort.dir;
  return[...st.projects].sort((A,B)=>{
    let av,bv;
    if(sortBy==='code'){av=A.code||'';bv=B.code||'';}
    else if(sortBy==='client'){av=(st.clients.find(c=>c.id===A.clientId)?.company)||'';bv=(st.clients.find(c=>c.id===B.clientId)?.company)||'';}
    else if(sortBy==='temp'){const cmpN=tempRank(A)-tempRank(B);if(cmpN!==0)return dir==='asc'?cmpN:-cmpN;av=A.name||'';bv=B.name||'';}
    else if(sortBy==='stages'){const c=projStageKeyCmp(A,B);if(c!==0)return dir==='asc'?c:-c;av=A.code||'';bv=B.code||'';}
    else{av=A.name||'';bv=B.name||'';}
    const cmp=av.localeCompare(bv,'en',{numeric:true,sensitivity:'base'});
    return dir==='asc'?cmp:-cmp;
  });
}

// ── Milestones — lightweight date markers, not a detailed programme ─────────────
// stage===null means a project-wide milestone (shown on the collapsed project row);

function milestonesInRange(project,stage,colStart,colEnd,person){

      &&(stage===null?m.stage==null:m.stage===stage)

      &&parseISO(m.date)>=colStart&&parseISO(m.date)<=colEnd)
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function addMilestone(project,stage,date,text,person){const id='ms'+Date.now()+Math.floor(Math.random()*10000);st.milestones.push({id,project,stage,date,text,person:person||null});save();return id;}
function removeMilestone(id){st.milestones=st.milestones.filter(m=>m.id!==id);save();}

// ── Leave / Non-billable — editable directly here; writes go into the same
// st.leave / st.nonBillable store the Timesheets tab reads, so nothing needs
// syncing and pre-existing timesheet-logged leave shows up automatically.
function personLeaveForDate(person,d){
  const{wk,dayIdx}=dateToWkDay(d);if(dayIdx>4)return[];
  const out=[];for(const t of getLeaveActive(wk,person)){const h=gL(wk,t,person,dayIdx);if(h>0)out.push({type:t,hours:h});}
  return out;
}
function personNBForDate(person,d){
  const{wk,dayIdx}=dateToWkDay(d);if(dayIdx>4)return[];
  const out=[];for(const t of getNBActive(wk,person)){const h=gNB(wk,t,person,dayIdx);if(h>0)out.push({type:t,hours:h});}
  return out;
}
// Collapse the raw per-day entries within the visible window into contiguous
// same-type/same-rate runs so they can be rendered and dragged like a bar.
// Only the visible portion is considered — a run may be truncated at the window edge.
function personRuns(kind,person,cols){
  const start=cols[0].start,end=cols[cols.length-1].end;
  const sISO=isoDate(start),eISO=isoDate(end);
  if(kind==='leave'){
    // One bar per request — approved (solid, even where hours were skipped for
    // submitted weeks or pre-import dates) and pending (hollow). Bank-holiday
    // auto bookings come straight from the timesheet store.
    const runs=[];
    for(const r of st.leaveRequests){
      if(r.person!==person)continue;
      if(r.status!=='approved'&&r.status!=='pending')continue;
      if(r.endDate<sISO||r.startDate>eISO)continue;
      runs.push({id:'rq-'+r.id,kind,person,type:r.type,startDate:r.startDate,endDate:r.endDate,hrsPerDay:dailyHours(person),pending:r.status==='pending',reqBacked:r.status==='approved',closure:!!r.closure});
    }
    let cur=null,d=new Date(start);
    while(d<=end){
      if(!isClosedDate(d)){
        const e=(personLeaveForDate(person,d)||[]).find(x=>x.type==='Bank Holiday')||null;
        if(e&&cur){cur.endDate=isoDate(d);}
        else{if(cur)runs.push(cur);cur=e?{id:'v-bh-'+person+'-'+isoDate(d),kind,person,type:'Bank Holiday',startDate:isoDate(d),endDate:isoDate(d),hrsPerDay:e.hours}:null;}
      }
      d=addDays(d,1);
    }
    if(cur)runs.push(cur);
    return runs;
  }
  const runs=[];let cur=null,d=new Date(start);
  while(d<=end){
    if(!isClosedDate(d)){
      const e=personNBForDate(person,d)[0]||null;
      if(e&&cur&&cur.type===e.type&&cur.hrsPerDay===e.hours){cur.endDate=isoDate(d);}
      else{if(cur)runs.push(cur);cur=e?{id:'v-'+kind+'-'+person+'-'+isoDate(d),kind,person,type:e.type,startDate:isoDate(d),endDate:isoDate(d),hrsPerDay:e.hours}:null;}
    }
    d=addDays(d,1);
  }
  if(cur)runs.push(cur);
  return runs;
}
function clearRawRange(kind,person,type,startDate,endDate){
  let d=parseISO(startDate);const end=parseISO(endDate);
  while(d<=end){if(!isClosedDate(d)){const{wk,dayIdx}=dateToWkDay(d);if(kind==='leave')sL(wk,type,person,dayIdx,0);else sNB(wk,type,person,dayIdx,0);}d=addDays(d,1);}
}
function writeRawRange(kind,person,type,startDate,endDate,hrsPerDay){
  let d=parseISO(startDate);const end=parseISO(endDate);
  while(d<=end){if(!isClosedDate(d)){const{wk,dayIdx}=dateToWkDay(d);if(kind==='leave'){addLeaveActive(wk,person,type);sL(wk,type,person,dayIdx,hrsPerDay);}else{addNBActive(wk,person,type);sNB(wk,type,person,dayIdx,hrsPerDay);}}d=addDays(d,1);}
}
// Unified commit helpers used by drag-move/resize/popover-save for all three kinds
// (proj uses the stored st.planAssignments array; leave/nb write raw cells directly).
let _lvSwallowClick=false;
// Dragging a leave bar edits its request: hours are withdrawn and rewritten, and
// the request re-enters approval unless the editor can approve it themselves.
// Amending someone else's leave notifies them.
function editLeaveDates(person,oldStart,newStart,newEnd){
  const r=st.leaveRequests.find(x=>x.person===person&&x.startDate===oldStart&&(x.status==='approved'||x.status==='pending'))||reqCoveringAny(person,oldStart);
  if(!r||r.closure)return;
  const prev={startDate:r.startDate,endDate:r.endDate,status:r.status,halfDays:JSON.parse(JSON.stringify(r.halfDays||{})),decidedBy:r.decidedBy,decidedAt:r.decidedAt};
  r.status='cancelled';applyLeaveTime(r); // withdraw existing hours
  r.startDate=newStart;r.endDate=newEnd;
  for(const k of Object.keys(r.halfDays||{}))if(k<newStart||k>newEnd)delete r.halfDays[k];
  // Hard block: an AL edit can't exceed the remaining allowance
  if(r.type==='Annual leave'){
    r.status='approved'; // count prospectively
    const year=parseISO(newStart).getFullYear();
    if(leaveRemaining(person,year)<0){
      Object.assign(r,prev);
      if(r.status==='approved')applyLeaveTime(r);
      undoToast(`That change would exceed ${person===st.currentUser?'your':person+"'s"} remaining Annual leave allowance. Consider Unpaid leave for the extra days.`);
      save();return;
    }
  }
  const own=person===st.currentUser;
  if(!own&&isAdmin()){
    r.status='approved';r.decidedBy=st.currentUser;r.decidedAt=new Date().toISOString();
    pushLeaveNotice(person,r.id,`${st.currentUser} amended your ${r.type} to ${fmt(parseISO(newStart))}${newStart!==newEnd?' – '+fmt(parseISO(newEnd)):''} — please check it's correct.`);
  } else if(own&&isAdmin()&&cur()&&cur().selfApproveLeave){
    r.status='approved';r.decidedBy=st.currentUser;r.decidedAt=new Date().toISOString();
  } else {
    r.status='pending';delete r.decidedBy;delete r.decidedAt;
  }
  applyLeaveTime(r);
  save();
}
function commitDescRange(desc,newStart,newEnd,newHrs){
  const hrs=newHrs!=null?newHrs:desc.hrsPerDay;
  if(desc.kind==='proj'){updatePlanAssignment(desc.id,{startDate:newStart,endDate:newEnd,hrsPerDay:hrs});return;}
  if(desc.kind==='leave'){_lvSwallowClick=true;editLeaveDates(desc.person,desc.startDate,newStart,newEnd);return;}
  clearRawRange(desc.kind,desc.person,desc.type,desc.startDate,desc.endDate);
  writeRawRange(desc.kind,desc.person,desc.type,newStart,newEnd,hrs);
}
function commitDescCreate(kind,identity,startDate,endDate,hrsPerDay,notes){
  if(kind==='proj')return addPlanAssignment(identity.project,identity.stage,identity.person,startDate,endDate,hrsPerDay,notes);
  if(kind==='leave'&&identity.type!=='Bank Holiday'){
    // Leave entered from the forecast becomes a request: pending for yourself
    // (unless self-approve), booked + noticed when an admin enters it for someone else.
    const out=createLeaveRequest(identity.person,identity.type,startDate,endDate,{},notes||'','forecast');
    if(out.error)undoToast(out.error);
    return;
  }
  writeRawRange(kind,identity.person,identity.type,startDate,endDate,hrsPerDay);
}

// ── Leave / NB row visibility — starts empty; a row appears once someone is added
// via the planner, or automatically if they already have logged data (so nothing
// entered on the Timesheets tab becomes invisible here).
function getLeaveRows(){return st.users.filter(u=>!u.deactivated).map(u=>u.name);}
function getNBRows(){return st.users.filter(u=>!u.deactivated).map(u=>u.name);}

// ── Projects / stages — also opt-in now, matching Leave/NB. A project or stage stays
// visible once it has any real data even if removed from the explicit list, same
// safety-net pattern used for Leave/NB rows.
function getProjectRows(){
  const withData=new Set(st.planAssignments.map(a=>a.project));
  return[...new Set([...(st.planProjectRows||[]),...withData])];
}
function addProjectRow(name){if(!(st.planProjectRows||[]).includes(name)){st.planProjectRows=[...(st.planProjectRows||[]),name];save();}}
function removeProjectRow(name){
  st.planProjectRows=(st.planProjectRows||[]).filter(p=>p!==name);
  if(st.planStageRows)delete st.planStageRows[name];
  st.planAssignments.filter(a=>a.project===name).forEach(clearPlanAssignmentRange);
  st.planAssignments=st.planAssignments.filter(a=>a.project!==name);
  for(const k of Object.keys(st.planRows))if(k.startsWith(name+'||'))delete st.planRows[k];
  st.milestones=st.milestones.filter(m=>m.project!==name);
  save();
}
function getStageRows(project){
  const withData=new Set(st.planAssignments.filter(a=>a.project===project).map(a=>a.stage));
  return[...new Set([...((st.planStageRows||{})[project]||[]),...withData])];
}
function removeStageRow(project,stage){
  st.planStageRows[project]=(st.planStageRows[project]||[]).filter(s=>s!==stage);
  st.planAssignments.filter(a=>a.project===project&&a.stage===stage).forEach(clearPlanAssignmentRange);
  st.planAssignments=st.planAssignments.filter(a=>!(a.project===project&&a.stage===stage));
  delete st.planRows[planRowKey(project,stage)];
  st.milestones=st.milestones.filter(m=>!(m.project===project&&m.stage===stage));
  save();
}


// ── Assignment notes — reuse the same cellNotes store the Timesheets grid uses,
// attached to the (week, day) of the entry's start date. This means a note added
// here also shows up as a cell note on the Timesheets tab, and vice versa.
function assignmentNoteKey(desc){
  const{wk,dayIdx}=dateToWkDay(parseISO(desc.startDate));
  if(desc.kind==='proj')return[wk,desc.project,desc.stage,desc.person,dayIdx];
  return[wk,desc.kind==='leave'?'__leave__':'__nb__',desc.type,desc.person,dayIdx];
}
function getAssignmentNote(desc){const[wk,p,ph,person,day]=assignmentNoteKey(desc);return getCellNote(wk,p,ph,person,day);}
function setAssignmentNote(desc,txt){const[wk,p,ph,person,day]=assignmentNoteKey(desc);setCellNote(wk,p,ph,person,day,txt);}

// ── Placeholder team members — forecast-only "people" with no login, not shown on
// Timesheets. Usable anywhere a project assignment needs a person, with their own
// billing/cost rate and weekly capacity, so a fee build or resourcing plan can include
// someone not yet hired (or hidden from time-logging) without touching real accounts.
function findPerson(name){return st.users.find(u=>u.name===name)||st.placeholders.find(p=>p.name===name);}
function personIsPlaceholder(name){return st.placeholders.some(p=>p.name===name);}
// Personal leave (approved or pending, closures excluded — those hatch the whole
// office anyway) for the forecast's clash boxes: a purple outline on any project
// cell where the person is on leave, visible BEFORE hours are allocated.
function personLeaveRanges(person){
  return st.leaveRequests.filter(r=>r.person===person&&!r.closure&&(r.status==='approved'||r.status==='pending')).map(r=>({s:r.startDate,e:r.endDate,pending:r.status==='pending',type:r.type}));
}
// Does [colStart..colEnd] share at least one OPEN day with the range? (A leave
// range spans calendar dates; a weekend column between leave days is no clash.)
function rangeClash(rg,colStart,colEnd){
  let d=parseISO(rg.s)>colStart?parseISO(rg.s):new Date(colStart);
  const end=parseISO(rg.e)<colEnd?parseISO(rg.e):new Date(colEnd);
  while(d<=end){if(!isClosedDate(d))return true;d=addDays(d,1);}
  return false;
}
function leaveClashCls(ranges,colStart,colEnd,person){
  if(!ranges||!ranges.length)return{cls:'',title:''};
  const hits=ranges.filter(r=>rangeClash(r,colStart,colEnd));
  if(!hits.length)return{cls:'',title:''};
  const canSee=isAdmin()||person===st.currentUser;
  const solid=hits.some(r=>!r.pending);
  const what=canSee?hits.map(r=>`${r.type}${r.pending?' (pending)':''}`).join(', '):(solid?'On leave':'Leave request pending');
  return{cls:solid?' plan-clash':' plan-clash-pend',title:` title="${escAttr(person)} — ${escAttr(what)} this ${planView==='day'?'day':'period'}"`};
}

let _aggCache=null; // per-render spend aggregation — see the note above feeSpent
function projAgg(){
  if(_aggCache)return _aggCache;
  const e={},f={};
  for(const[k,v]of Object.entries(st.entries)){
    const hrs=parseFloat(v)||0;if(!hrs)continue;
    const[wk,p,h,person,day]=k.split('||');
    const d=dateForWk(wk,day),key=p+'||'+h;
    const a=e[key]||(e[key]={hrs:0,bill:0,cost:0});
    a.hrs+=hrs;a.bill+=hrs*billableOn(person,p,d);a.cost+=hrs*costOn(person,d);
  }
  for(const[k,v]of Object.entries(st.forecasts)){
    const hrs=parseFloat(v)||0;if(!hrs)continue;
    const[wk,p,h,person,day]=k.split('||');
    if(!fcstCounts(wk,day))continue;
    const d=dateForWk(wk,day),key=p+'||'+h;
    const a=f[key]||(f[key]={hrs:0,bill:0,cost:0});
    a.hrs+=hrs;a.bill+=hrs*billableOn(person,p,d);a.cost+=hrs*costOn(person,d);

function chartDataMonthly(weekly){
  // Fold the weekly series into calendar months, preserving the cumulative logic.
  const{labels,bA,bF,lA,lC,sorted}=weekly;
  const mKey=wk=>{const d=wkKeyToDate(wk);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
  const nw=nowWk();
  const mo=[];const idx={};
  sorted.forEach((wk,i)=>{const k=mKey(wk);if(!(k in idx)){idx[k]=mo.length;mo.push({k,label:wkKeyToDate(wk).toLocaleDateString('en-GB',{month:'short',year:'2-digit'}),a:0,f:0,hasPast:false,lastLC:null,lastLA:null});}
    const m=mo[idx[k]];m.a+=bA[i];m.f+=bF[i];if(wk<=nw)m.hasPast=true;if(lC[i]!=null)m.lastLC=lC[i];if(lA[i]!=null)m.lastLA=lA[i];});
  return{labels:mo.map(m=>m.label),bA:mo.map(m=>m.a),bF:mo.map(m=>m.f),lA:mo.map(m=>m.hasPast?m.lastLA:null),lC:mo.map(m=>m.lastLC),sorted:mo.map(m=>m.k),nowIdx:mo.findIndex(m=>m.k===mKey(nw))};
}
function chartData(proj,stageName){

  const nw=nowWk();const sorted=[...all].sort();
  const wa={},wf={};
  for(const[k,v]of Object.entries(st.entries)){const[wk,p,ph,person,day]=k.split('||');if(p!==proj.name)continue;if(stageName&&ph!==stageName)continue;wa[wk]=(wa[wk]||0)+(parseFloat(v)||0)*billableOn(person,proj.name,dateForWk(wk,day));}

  for(const[k,v]of Object.entries(st.forecasts)){const[wk,p,ph,person,day]=k.split('||');if(p!==proj.name)continue;if(stageName&&ph!==stageName)continue;const val=(parseFloat(v)||0)*billableOn(person,proj.name,dateForWk(wk,day));wf[wk]=(wf[wk]||0)+val;if(fcstCounts(wk,day))wfF[wk]=(wfF[wk]||0)+val;}

  for(const wk of sorted){labels.push(fmt(wkKeyToDate(wk)));const a=wa[wk]||0,f=wf[wk]||0;bA.push(a);bF.push(f);cc+=wk<nw?a:a+(wfF[wk]||0);if(wk<=nw)ca+=a;lA.push(wk<=nw?ca:null);lC.push(cc);}
  return{labels,bA,bF,lA,lC,sorted};

// ── Frozen table headers (forecast + projects list) ─────────────────────────
// These tables sit in the page (no inner vertical scroller), so their header
// rows can't use position:sticky: the forecast's wrapper scrolls horizontally,
// making it the scrollport sticky would resolve against — and that scrollport
// scrolls away with the page. Instead we translate each <thead> down by exactly
// how far its table has passed the top of the viewport — Excel-style frozen
// panes — clamped so a header never runs on past its last row. Nothing above is
// position:fixed, so the pin line is the viewport top. Add `page-freeze` to any
// page-flow table that should behave this way.
function planStickyHead(){
  try{
    const tables=document.querySelectorAll('.plan-scroll table, table.page-freeze');
    for(const table of tables){
      const thead=table.tHead;if(!thead)continue;
      const tRect=table.getBoundingClientRect();
      const headH=thead.getBoundingClientRect().height;
      let y=0;
      if(tRect.top<0)y=Math.min(-tRect.top,Math.max(0,tRect.height-headH));
      thead.style.transform=y?`translateY(${y}px)`:'';
    }
  }catch(e){}
}

  if(leaveOpen){
  if(!leaveActive.length){
    h+=`<tr class="leave-row"><td colspan="12" style="padding:8px 12px;color:var(--dkgrey);font-size:12px">No leave this week — add a type below.</td></tr>`;
  } else {
    for(const type of leaveActive){
      const isBH=type==='Bank Holiday';
      let rowTotal=0;
      h+=`<tr class="leave-row"><td class="proj-cell" style="padding-left:12px;font-weight:600">${type}${isBH?' <span style="font-size:9px;color:var(--ok);font-weight:600">(auto)</span>':''}</td><td></td>`;
      for(let i=0;i<7;i++){
        const isWknd=i>=5;
        const v=i<5?gL(wk,type,targetName,i):0;
        rowTotal+=v;
        const isBHDay=isBH&&bhDays.has(i);
        const hasNote=i<5&&getCellNote(wk,'Leave',type,targetName,i).trim().length>0;
        h+=`<td class="weekend${isWknd?' disabled':''}${(i<5&&bhDays.has(i))?' bh-cell':''}" style="text-align:center;padding:3px">`;
        if(i<5){h+=`<div class="cell-wrap"><input type="number" class="tinput" min="0" max="7.5" step="0.5" value="${v||''}" ${!canEdit?'disabled':''} data-wk="${wk}" data-lt="${escAttr(type)}" data-pe="${escAttr(targetName)}" data-d="${i}" onchange="logLeave(this)"/><button tabindex="-1" class="cn-btn ${hasNote?'has-note':''}" title="${hasNote?'Edit note':'Add note'}" onclick="openCellNote(this,'${jsq(wk)}','Leave','${jsq(type)}','${jsq(targetName)}',${i})"></button></div>`;}
        else{h+=`<span style="color:var(--mid)">—</span>`;}

      }
      h+=`<td class="total-col">${rowTotal||''}</td>`;
      h+=`<td class="ot-col"></td>`;
      h+=`<td class="del-col">${canEdit&&!isBH?`<button tabindex="-1" onclick="doRmLeaveType('${jsq(wk)}','${jsq(type)}','${jsq(targetName)}')" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:16px;font-weight:700;padding:0;line-height:1">×</button>`:'&nbsp;'}</td>`;
      h+=`</tr>`;
    }
  }
  // Pending leave requests overlapping this week — any week, past, present or

  {
    const wkMon=planWkToDate(wk);
    for(const r of st.leaveRequests.filter(x=>x.person===targetName&&x.status==='pending'&&x.startDate<=isoDate(addDays(wkMon,6))&&x.endDate>=isoDate(wkMon))){

      h+=`<tr class="leave-row"><td class="proj-cell" style="padding-left:12px;font-weight:600">${escAttr(r.type)} <span class="badge badge-pending" style="font-size:9px">pending approval</span></td><td></td>${cells.join('')}<td class="total-col" style="color:var(--leave)">${rowTot||''}</td><td class="ot-col"></td><td class="del-col"></td></tr>`;
    }
  }
  // Add-leave-type row (always shown, consistent with Add project pattern)
  if(canEdit){
    const availLeave=LEAVE_TYPES.filter(t=>!leaveActive.includes(t));
    if(availLeave.length){
      h+=`<tr class="add-row"><td colspan="12">
        <div style="display:flex;gap:8px;align-items:center">

  // ── Section 2: Non-billable (dark navy header) ──────────────────────────────

    <div style="display:flex;align-items:center;justify-content:space-between"><span class="sec-label"><span class="caret-icon" style="color:#fff">${nbOpen?'▾':'▸'}</span> Non-billable</span>${!nbOpen&&nbHrs>0?`<span style="font-size:11px;font-weight:700;color:rgba(255,255,255,.92)">${nbHrs.toFixed(1)}h</span>`:''}</div>

  if(nbOpen){
  if(!nbActive.length){

      h+=`<td class="del-col">${canEdit?`<button tabindex="-1" onclick="doRmNBType('${jsq(wk)}','${jsq(type)}','${jsq(targetName)}')" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:16px;font-weight:700;padding:0;line-height:1">×</button>`:'&nbsp;'}</td>`;

      // NB OT sub-row
      if(nbOT){
        let otTotal=0;

        for(let i=0;i<7;i++){
          const v=gNB(wk,type,targetName,7+i);
          otTotal+=v;
          const hasNote=i<5&&getCellNote(wk,'Non-billable',type,targetName,7+i).trim().length>0;
          h+=`<td class="${i>=5?'weekend':''}" style="text-align:center;padding:3px"><div class="cell-wrap"><input type="number" class="tinput" min="0" max="16" step="0.5" value="${v||''}" ${!canEdit?'disabled':''} data-wk="${wk}" data-nbt="${escAttr(type)}" data-pe="${escAttr(targetName)}" data-d="${7+i}" onchange="logNB(this)"/>${i<5?`<button tabindex="-1" class="cn-btn ${hasNote?'has-note':''}" title="${hasNote?'Edit note':'Add note'}" onclick="openCellNote(this,'${jsq(wk)}','Non-billable','${jsq(type)}','${jsq(targetName)}',${7+i})"></button>`:''}</div></td>`;
        }
        h+=`<td class="total-col">${otTotal||''}</td><td class="ot-col"></td><td class="del-col"></td></tr>`;
      }
    }
  }
  // Add-category row (always shown, consistent with Add project pattern)
  if(canEdit){
    const availNB=NB_TYPES.filter(t=>!nbActive.includes(t));
    if(availNB.length){
      h+=`<tr class="add-row"><td colspan="12">
        <div style="display:flex;gap:8px;align-items:center">
          <select id="nb-add-sel" style="min-width:200px;font-size:11px">
            <option value="">+ Select category</option>
            ${availNB.map(t=>`<option value="${escAttr(t)}">${t}</option>`).join('')}
          </select>
          <button class="btn btn-sm btn-primary" onclick="doAddNBType('${jsq(wk)}','${jsq(targetName)}')">Add</button>

      </td></tr>`;
    } else {
      h+=`<tr class="add-row"><td colspan="12" style="color:var(--dkgrey);font-size:11px">All non-billable categories are on this timesheet.</td></tr>`;
    }
  }
  }
  // Section gap
  h+=`<tr class="section-gap"><td colspan="12"></td></tr>`;

  // ── Section 3: Projects (near-black header) ─────────────────────────────────
  const projsWithAvailableStages=canEdit?st.projects.filter(p=>{
    if(p.archived)return false;
    if(!canLogToProject(targetName,p.name))return false;
    const activeStgs=(p.phases||[]).filter(ph=>ph.active!==false).map(ph=>ph.name);
    const selStgs=tsStagesForWeek(wk,targetName,p.name);

  const projOpen=tsSectionOpen.has('projects');
  h+=`<tr class="section-header section-projects" onclick="toggleTsSection('projects')" style="cursor:pointer" title="${projOpen?'Collapse':'Expand'} section"><td colspan="12"><div style="display:flex;align-items:center;justify-content:space-between"><span class="sec-label"><span class="caret-icon" style="color:#fff">${projOpen?'▾':'▸'}</span> Projects</span>${!projOpen&&projHrs>0?`<span style="font-size:11px;font-weight:700;color:rgba(255,255,255,.92)">${projHrs.toFixed(1)}h</span>`:''}</div></td></tr>`;
  if(projOpen){
  if(!myProjObjs.length){
    h+=`<tr><td colspan="12" style="padding:10px 12px;color:var(--dkgrey);font-size:12px">${viewMode?'No projects on this timesheet.':'No projects yet — add below.'}</td></tr>`;

  for(const proj of myProjObjs){

    const phasesWithHoursThisWk=new Set(
      allPhases.filter(ph=>rT(wk,proj.name,ph.name,targetName)>0).map(ph=>ph.name)
    );

      if(ph&&!seen.has(name)){stages.push(ph);seen.add(name);}

    for(const ph of allPhases){
      if(!seen.has(ph.name)&&phasesWithHoursThisWk.has(ph.name)){

      }
    }

    if(!stages.length){
      h+=`<tr class="proj-first-in-group"><td class="proj-cell" colspan="12" style="padding:6px 12px">
        <div style="display:flex;align-items:center;gap:10px">

        </div>
      </td></tr>`;
      continue;
    }

    const projCollapsed=tsProjCollapsed.has(proj.name);
    if(projCollapsed){
      const dayTots=[0,0,0,0,0,0,0];let projTot=0;
      for(const ph of stages)for(let i=0;i<14;i++){const v=parseFloat(gE(wk,proj.name,ph.name,targetName,i))||0;dayTots[i%7]+=v;projTot+=v;}
      h+=`<tr class="proj-first-in-group"><td class="proj-cell" style="border-right:2px solid var(--mid);padding:6px 8px;cursor:pointer" onclick="toggleTsProj('${jsq(proj.name)}')" title="Expand project">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span class="caret-icon">▸</span>${proj.code?`<span class="code-chip" style="font-size:10px">${proj.code}</span>`:''}<span style="font-weight:600;font-size:12px">${proj.name}</span></div>

      for(let i=0;i<7;i++)h+=`<td class="${i>=5?'weekend':''}${(i<5&&bhDays.has(i))?' bh-cell':''}" style="text-align:center;font-weight:600;font-size:12px;color:var(--dkgrey)">${dayTots[i]||''}</td>`;

      if(isFirst){
        h+=`<tr class="proj-first-in-group">`;
        h+=`<td class="proj-cell" rowspan="${totalRows}" style="border-right:2px solid var(--mid);vertical-align:top;padding:6px 8px;cursor:pointer" onclick="toggleTsProj('${jsq(proj.name)}')" title="Collapse project">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            <span class="caret-icon">▾</span>
            ${proj.code?`<span class="code-chip" style="font-size:10px">${proj.code}</span>`:''}
            <span style="font-weight:600;font-size:12px">${proj.name}</span>
          </div>
        </td>`;
      } else {
        h+=`<tr>`;
      }

      const inactiveLabel=!stageActive?` <span style="font-size:9px;letter-spacing:.05em;color:var(--grey);font-weight:500">(inactive)</span>`:'';
      h+=`<td class="stage-cell" style="${!stageActive?'color:var(--grey)':''}">${phase.name}${inactiveLabel}</td>`;
      for(let i=0;i<7;i++){
        const isWknd=i>=5;
        const editableCell=stageEditable&&(!isWknd||stageOT);
        const v=gE(wk,proj.name,phase.name,targetName,i);
        const hasNote=getCellNote(wk,proj.name,phase.name,targetName,i).trim().length>0;
        h+=`<td class="${isWknd?'weekend':''}${isWknd&&!stageOT?' disabled':''}${(i<5&&bhDays.has(i))?' bh-cell':''}" style="text-align:center;padding:3px;${!stageActive?'opacity:.6':''}">
          <div class="cell-wrap">
            <input type="number" class="tinput" min="0" max="16" step="0.5" value="${v}" ${!editableCell?'disabled':''} data-wk="${wk}" data-pj="${escAttr(proj.name)}" data-ph="${escAttr(phase.name)}" data-pe="${escAttr(targetName)}" data-d="${i}" onchange="logT(this)"/>
            ${i<5?`<button tabindex="-1" class="cn-btn ${hasNote?'has-note':''}" title="${hasNote?'Edit note':'Add note'}" onclick="openCellNote(this,'${jsq(wk)}','${jsq(proj.name)}','${jsq(phase.name)}','${jsq(targetName)}',${i})"></button>`:''}
          </div>
        </td>`;
      }
      const rowTot=(()=>{let t=0;for(let i=0;i<7;i++)t+=parseFloat(gE(wk,proj.name,phase.name,targetName,i))||0;return t||'';})();
      h+=`<td class="total-col" style="${!stageActive?'opacity:.6':''}"> ${rowTot}</td>`;
      h+=`<td class="ot-col">${stageEditable?`<input type="checkbox" class="ot-stage-cb" title="Log overtime — ticking adds an overtime row (evenings and weekends) beneath this one" ${stageOT?'checked':''} onchange="togStageOT('${jsq(wk)}','${jsq(proj.name)}','${jsq(phase.name)}','${jsq(targetName)}',this.checked)"/>`:'&nbsp;'}</td>`;
      h+=`<td class="del-col">${stageEditable?`<button tabindex="-1" onclick="rmStageFromTS('${jsq(wk)}','${jsq(proj.name)}','${jsq(phase.name)}','${jsq(targetName)}')" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:16px;font-weight:700;padding:0;line-height:1">×</button>`:'&nbsp;'}</td>`;
      h+=`</tr>`;

      // Inactive stage edit-mode notice
      if(!stageActive&&inEditMode){
        h+=`<tr><td></td><td colspan="10" style="padding:4px 10px 8px;font-size:11px;color:var(--warn);font-weight:500">
          ⚠ Stage inactive — ask an admin to reactivate it before you can edit these hours.
        </td><td></td></tr>`;
      }

      // OT row for this stage (if enabled and stage is active)
      if(stageOT&&stageActive){
        const otTot=(()=>{let t=0;for(let i=7;i<14;i++)t+=parseFloat(gE(wk,proj.name,phase.name,targetName,i))||0;return t||'';})();
        h+=`<tr class="ot-row"><td class="stage-cell">${phase.name} <span style="font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)">(OT)</span></td>`;
        for(let i=0;i<7;i++){
          const v=gE(wk,proj.name,phase.name,targetName,7+i);
          const hasNote=i<5&&getCellNote(wk,proj.name,phase.name,targetName,7+i).trim().length>0;
          h+=`<td class="${i>=5?'weekend':''}" style="text-align:center;padding:3px"><div class="cell-wrap"><input type="number" class="tinput" min="0" max="16" step="0.5" value="${v}" ${!stageEditable?'disabled':''} data-wk="${wk}" data-pj="${escAttr(proj.name)}" data-ph="${escAttr(phase.name)}" data-pe="${escAttr(targetName)}" data-d="${7+i}" onchange="logT(this)"/>${i<5?`<button tabindex="-1" class="cn-btn ${hasNote?'has-note':''}" title="${hasNote?'Edit note':'Add note'}" onclick="openCellNote(this,'${jsq(wk)}','${jsq(proj.name)}','${jsq(phase.name)}','${jsq(targetName)}',${7+i})"></button>`:''}</div></td>`;
        }
        h+=`<td class="total-col">${otTot}</td><td class="ot-col"></td><td class="del-col"></td></tr>`;
      }
    }
  }

  // Add-project row (always shown, consistent with Leave/NB add pattern)
  if(canEdit){
    const addProjs=projsWithAvailableStages.length?projsWithAvailableStages:(!myProjObjs.length?st.projects.filter(p=>!p.archived&&(p.phases||[]).some(ph=>ph.active!==false)&&canLogToProject(targetName,p.name)):[]);
    if(addProjs.length){
      h+=`<tr class="add-row"><td colspan="12">
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" id="ts-addproj" list="ts-addproj-list" placeholder="+ Type project name or code" style="min-width:200px;font-size:11px" onchange="refreshStageDropdown()" autocomplete="off"/>
          <datalist id="ts-addproj-list">
            ${addProjs.map(p=>`<option value="${escAttr(projLabel(p))}">`).join('')}
          </datalist>
          <select id="ts-addstage" style="min-width:160px;font-size:11px">
            <option value="">— then select stage —</option>
          </select>
          <button class="btn btn-sm btn-primary" onclick="doAddProjStageToTS('${jsq(wk)}','${jsq(targetName)}')">Add</button>
        </div>
      </td></tr>`;
    } else {
      h+=`<tr class="add-row"><td colspan="12" style="color:var(--dkgrey);font-size:11px">All available project stages are on this timesheet.</td></tr>`;
    }
  }
  }

  // ── Daily totals (regular rows only — overtime excluded). A weekday over 7.5h
// blocks submission; the offending totals are highlighted so the cause is obvious.
h+=`<tr class="ts-daytotal"><td colspan="2" class="left">Daily total</td>${DAY_LABELS.map((l,i)=>{const t=dayTotalHrs(wk,targetName,i);const over=t>DAY_MAX+0.001;return `<td id="ts-dt-${i}" class="${over?'over':''}" title="${over?'Over the 7.5h day — move extra hours to an overtime row':'Regular hours this day (max 7.5h — use overtime rows for more)'}">${t?t.toFixed(1):''}${over?' ⚠':''}</td>`;}).join('')}<td class="total-col" id="ts-dt-sum">${(()=>{let t=0;for(let i=0;i<7;i++)t+=dayTotalHrs(wk,targetName,i);return t?t.toFixed(1):'';})()}</td><td class="ot-col"></td><td class="del-col"></td></tr>`;
h+=`</tbody></table></div></div>`;

  if(isFuture){h+=`<div class="subbar"><span style="font-size:12px;color:var(--dkgrey)">This week hasn't started — timesheets for future weeks are view only. Approved leave shows booked; requested leave shows above as pending.</span></div>`;return h;}
  h+=buildSubmissionBar(targetName,wk,sub,od,myProjObjs.length,inEditMode,editPermitted,days,hrsOk,hrsOver,hrsUnder,remaining,target);
  return h;
}

function escAttr(s){return(s||'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function jsq(s){return escAttr(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,'\\n'));}


// Note popover rendered as overlay in the DOM
function renderNotePopover(){
  const el=document.getElementById('note-popover-container');
  if(!el)return;
  if(!activeNoteCell){el.innerHTML='';return;}
  const{wk,pj,ph,pe,day,x,y}=activeNoteCell;
  const txt=getCellNote(wk,pj,ph,pe,day);
  const dayLabels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const label=`${pj} · ${ph} · ${dayLabels[day]||'Day '+day}`;
  el.innerHTML=`<div class="note-popover" id="note-popover" style="top:${y}px;left:${x}px">
    <div class="note-popover-hdr"><span>📝 Note</span><button onclick="closeNotePopover()" style="background:none;border:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--dkgrey)">×</button></div>
    <div style="font-size:10px;color:var(--dkgrey);padding:4px 11px;border-bottom:1px solid var(--mid)">${label}</div>
    <textarea id="note-ta" placeholder="Add a note, e.g. 'Window elevations for Chris'">${txt}</textarea>
    <div class="note-popover-footer">
      <button class="btn btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="clearCellNote()">Clear</button>
      <button class="btn btn-primary btn-sm" onclick="saveCellNotePopover()">Save</button>
    </div>
  </div>`;
}

function buildSubmissionBar(targetName,wk,sub,od,nProjs,inEditMode,editPermitted,days,hrsOk,hrsOver,hrsUnder,remaining,target){
  if(!editPermitted)return '';
  let blockMsg='';
  if(hrsUnder)blockMsg=`${(remaining||0).toFixed(1)}h short of ${target}h — add more hours before submitting`;
  if(hrsOver)blockMsg=`${Math.abs(remaining||0).toFixed(1)}h over ${target}h — move extra hours to overtime rows`;
  const overDays=wkDaysOver(targetName,wk);
  if(overDays.length)blockMsg=`${overDays.map(i=>['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]).join(', ')} ${overDays.length===1?'has':'have'} more than ${DAY_MAX}h — move the extra hours to an overtime row (highlighted in the Daily total)`;
  const pendingLv=pendingLeaveOverlapsWeek(targetName,wk);
  if(pendingLv)blockMsg=`a leave request for this week is awaiting approval — it must be decided before submitting`;
  const canSubmitHrs=hrsOk&&!pendingLv&&!overDays.length;
  if(sub&&!inEditMode){
    const subAt=st.submissions[`${targetName}||${wk}`]?.at;
    const subDt=subAt?new Date(subAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    return `<div class="subbar"><span style="font-size:12px;color:var(--ok);font-weight:600">✓ Submitted${subDt?` on ${subDt}`:''}</span>
      <button class="btn btn-sm" onclick="editSubmitted('${jsq(targetName)}','${wk}')">Edit &amp; resubmit</button></div>`;
  }
  if(inEditMode){
    return `<div class="subbar" style="background:var(--warn-bg);border-color:var(--warn)">
      <div><div style="font-size:12px;font-weight:600;color:var(--warn)">Editing submitted week</div>
      <div id="sub-hrs-msg" style="font-size:11px;color:var(--danger);font-weight:600;margin-top:4px;${canSubmitHrs?'display:none':''}">${canSubmitHrs?'':`⚠ ${blockMsg}`}</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="cancelEditSubmitted('${jsq(targetName)}','${wk}')">Cancel</button>
        <button class="btn btn-primary btn-sm" id="sub-hrs-btn" onclick="resubmitSubmitted('${jsq(targetName)}','${wk}')" ${!canSubmitHrs?'disabled':''}>Resubmit</button>
      </div></div>`;
  }
  return `<div class="subbar">
    <div>
      <div style="font-size:12px;font-weight:600;margin-bottom:2px">${od?'<span style="color:var(--danger)">⚠ Overdue</span>':`Submit for ${fmt(days[0])} – ${fmt(days[4])}`}</div>
      <div id="sub-hrs-ok" style="font-size:11px;color:var(--dkgrey);${canSubmitHrs?'':'display:none'}">Once submitted this week will be locked.</div>
      <div id="sub-hrs-msg" style="font-size:11px;color:var(--danger);font-weight:600;${canSubmitHrs?'display:none':''}">${canSubmitHrs?'':`⚠ ${blockMsg}`}</div>
    </div>
    <button class="btn btn-primary" id="sub-hrs-btn" onclick="doSubmit('${jsq(targetName)}','${wk}')" ${!canSubmitHrs?'disabled':''}>Submit Timesheet</button>
  </div>`;
}



// ── Forecast — Resource Planner ─────────────────────────────────────────────────
function buildForecast(){
  const ed=planEditor();
  if(!ed)planMode='projects'; // members: single, read-only projects view
  const cols=planColumnsFor(planView,planOffsetDays);
  const rangeLabel=planView==='month'
    ?`${cols[0].label} ${cols[0].subLabel} – ${cols[cols.length-1].label} ${cols[cols.length-1].subLabel}`
    :`${fmt(cols[0].start)} – ${fmt(cols[cols.length-1].end)}`;
  const sortArrow=(col)=>st._projSort.by===col?(st._projSort.dir==='asc'?' ▲':' ▼'):'';
  const fcActions=ed?`<span style="position:relative;display:inline-flex;gap:8px">
    <button class="btn-add" onclick="toggleAddProjMenu()">+ Add project</button>
    <button class="btn" style="font-size:13px;padding:9px 18px;border-radius:var(--r)" onclick="openPlaceholderPopover()" title="A forecast-only person — no login, no timesheets — for planning a future hire's time and cost on projects">+ Placeholder person</button>
    ${planAddProjOpen?`<div style="position:absolute;top:calc(100% + 6px);right:0;z-index:60;background:var(--wht);border:1px solid var(--mid);border-radius:10px;box-shadow:0 8px 28px rgba(38,34,30,.14);padding:8px;min-width:280px;max-height:320px;overflow:auto">
      ${projectAddOptions().length?projectAddOptions().map(o=>`<button style=\"display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:7px;font-family:'Figtree',sans-serif;font-size:12px;font-weight:600;color:var(--blk);cursor:pointer\" onmouseover=\"this.style.background='var(--off)'\" onmouseout=\"this.style.background='none'\" onclick=\"doAddProjectRowFromMenu('${jsq(o.value)}')\">${escAttr(o.label)}</button>`).join(''):`<div style=\"padding:10px;font-size:12px;color:var(--dkgrey)\">Every project is already on the forecast.</div>`}
    </div>`:''}
  </span>`:'';
  let h=pageHead('Forecast','forecast',fcActions)+`
  ${ed?`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
  <div class="plan-mode-toggle">
    <button class="${planMode==='projects'?'active':''}" onclick="setPlanMode('projects')">Projects</button>
    <button class="${planMode==='team'?'active':''}" onclick="setPlanMode('team')">Team</button>
  </div>
  </div>`:`<div class="notice">You're viewing the plan for your projects, plus the team's leave and non-billable time. Only PMs and admins can change it — leave is requested from the Leave page.</div>`}
  ${planMode==='team'?`<div class="notice">See how each person&rsquo;s time is allocated across projects, leave and non-billable work — green means full, light means open capacity, red means over-allocated. Expand a person to see and edit the detail.</div>`:(planView==='month'?`<div class="notice">Month view is a long-range overview — switch to Week or Day to create or edit entries.</div>`:'')}
  <div class="wknav" style="justify-content:space-between;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn btn-sm" onclick="planNav(-1)">← earlier</button>
      <span class="wklabel" style="min-width:230px">${rangeLabel}</span>
      <button class="btn btn-sm" onclick="planNav(1)">later →</button>
      <button class="btn btn-sm" onclick="planNavToday()">Today</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div class="plan-view-toggle">
        <button class="${planView==='day'?'active':''}" onclick="setPlanView('day')">Day</button>
        <button class="${planView==='week'?'active':''}" onclick="setPlanView('week')">Week</button>
        <button class="${planView==='month'?'active':''}" onclick="setPlanView('month')">Month</button>
      </div>
      ${planMode==='projects'?`<span style="display:flex;gap:8px"><button class="btn btn-sm" onclick="planExpandAll()">Expand all</button><button class="btn btn-sm" onclick="planCollapseAll()">Collapse all</button></span>`:''}
    </div>
  </div>`;
  if(!st.users.length)return h+`<div class="empty">No team members yet.</div>`;
  if(planMode==='team')return h+buildTeamForecast(cols);

  h+=`<div class="card"><div class="plan-scroll"><table class="plan-table view-${planView}">
  <colgroup><col class="plan-numcol"><col style="width:230px">${cols.map(()=>`<col style="width:${planView==='day'?38:74}px">`).join('')}</colgroup>
  <thead><tr><th class="plan-rowhead plan-numcol"></th><th class="plan-rowhead"></th>
    ${cols.map(c=>`<th class="plan-wkcol ${c.isToday?'plan-now':''}${c.isWeekend?' plan-weekend-col':''}${c.isBH?' plan-bh-col':''}${(!c.isBH&&c.bhCount)?' plan-bhweek-col':''}" data-key="${c.key}" data-days="${c.days}">${c.label}${c.isBH?' <span class="bh-badge" title="UK bank holiday — office closed">BH</span>':c.bhCount?` <span class="bh-badge" title="${c.bhCount} UK bank holiday${c.bhCount>1?'s':''} this week — office closed">${c.bhCount>1?c.bhCount+'×':''}BH</span>`:''}${c.subLabel?`<br><span style="font-weight:500;font-size:9px;color:var(--grey)">${c.subLabel}</span>`:''}</th>`).join('')}
  </tr></thead><tbody>`;

  h+=buildPlanSectionHeader('leave','Leave',cols,null,null);
  if(planSectionExpanded.has('leave'))for(const person of getLeaveRows())h+=buildAssignmentRow('leave',{},person,cols,person,14,false);
  h+=buildPlanSectionGap(cols);

  h+=buildPlanSectionHeader('nb','Non-billable',cols,null,null);
  if(planSectionExpanded.has('nb'))for(const person of getNBRows())h+=buildAssignmentRow('nb',{},person,cols,person,14,false);
  h+=buildPlanSectionGap(cols);

  h+=buildPlanSectionHeader('projects','Projects',cols,null,null);
  if(planSectionExpanded.has('projects')){
    h+=buildProjectColumnHeader(cols,sortArrow);
    if(!st.projects.length){
      h+=`<tr><td class="plan-rowhead" style="padding-left:14px;color:var(--grey)" colspan="${cols.length+2}">No projects yet.${isAdmin()?'':' Ask an admin to create some.'}</td></tr>`;
    } else {
      const addedProjects=sortedProjects().filter(p=>getProjectRows().includes(p.name)&&(ed||canLogToProject(st.currentUser,p.name)));
      if(!addedProjects.length){
        h+=`<tr><td class="plan-rowhead" style="padding-left:14px;color:var(--grey);font-style:italic" colspan="${cols.length+2}">No projects added to the forecast yet — use the add row below.</td></tr>`;
      } else {
        for(const proj of addedProjects){
          const expanded=planExpanded.has(proj.name);
          h+=buildPlanProjectRow(proj,cols,expanded);
          if(expanded){
            const stageNames=getStageRows(proj.name);
            const stages=stageNames.map(n=>(proj.phases||[]).find(ph=>ph.name===n)||{name:n,active:true});
            if(!stages.length){
              h+=`<tr><td class="plan-rowhead" style="padding-left:32px;color:var(--grey);font-style:italic" colspan="${cols.length+2}">No time assigned yet — click a cell above to add a stage.</td></tr>`;
            }
            for(const stage of stages)h+=buildPlanStageBlock(proj,stage,cols);
          }
        }
      }
    }
    if(ed){
      const planAddProjs=st.projects.filter(p=>!p.archived&&(p.phases||[]).some(ph=>ph.active!==false));
      h+=`<tr class="add-row"><td colspan="${cols.length+2}"><div style="display:flex;gap:8px;align-items:center;padding:4px 8px">
        <input type="text" id="plan-addproj" list="plan-addproj-list" placeholder="+ Type project name or code" style="min-width:200px;font-size:11px" onchange="refreshPlanStageDropdown()" autocomplete="off"/>
        <datalist id="plan-addproj-list">${planAddProjs.map(p=>`<option value="${escAttr(projLabel(p))}">`).join('')}</datalist>
        <select id="plan-addstage" style="min-width:160px;font-size:11px"><option value="">— then select stage —</option></select>
        <button class="btn btn-sm btn-primary" onclick="doAddPlanProjStage()">Add</button>
      </div></td></tr>`;
    }
  }
  h+=`</tbody></table></div></div>`;
  return h;
}
// The project number/name column headers live here, inside the Projects section
// itself, rather than at the very top of the whole table — Leave and Non-billable
// don't have numbers, so a shared top-level "#" header made the sort control feel
// like it applied to everything rather than just Projects.
function buildProjectColumnHeader(cols,sortArrow){
  return `<tr class="plan-col-subheader">
    <td class="plan-rowhead plan-numcol sortable" onclick="sortProj('code')">#${sortArrow('code')}</td>
    <td class="plan-rowhead sortable" onclick="sortProj('name')">Name${sortArrow('name')}</td>
    <td colspan="${cols.length}"></td>
  </tr>`;
}

function buildPlanSectionHeader(key,label,cols,addOptions,addJs,extraHtml){
  const isOpen=planSectionExpanded.has(key);
  const addSelect=addOptions?renderAddSelect(addOptions,addJs):'';
  // Leave/NB section bands carry their own per-column milestone cells (chips render
  // via the .plan-section-row .plan-ms-chip styles); the Projects band stays a spacer
  // since project milestones live on the project rows themselves.
  const msProject=key==='leave'?'__leave__':key==='nb'?'__nb__':null;
  const edH=planEditor();
  const dateCells=msProject
    ?cols.map(c=>c.isWeekend
        ?`<td class="plan-cell plan-weekend-cell plan-ms-trigger${planColCls(c)}" ${edH?`onclick="event.stopPropagation();openPlanMilestonesRange('${msProject}',null,'${isoDate(c.msStart||c.start)}','${isoDate(c.msEnd||c.end)}',event.clientX,event.clientY,null)"`:''}>${renderMilestoneChips(milestonesInRange(msProject,null,c.start,c.end,null))}</td>`
        :(()=>{const bandMs=milestonesInRange(msProject,null,c.start,c.end,null);const click=!edH?'':bandMs.length?`onclick="event.stopPropagation();openPlanMilestonesRange('${msProject}',null,'${isoDate(c.msStart||c.start)}','${isoDate(c.msEnd||c.end)}',event.clientX,event.clientY,null)"`:(c.assignStart?`onclick="event.stopPropagation();openPlanChoice({entryKind:'${key}',project:'${msProject}',stage:'',person:'',startDate:'${isoDate(c.assignStart)}',endDate:'${isoDate(c.assignEnd)}',x:event.clientX,y:event.clientY})"`:'');return `<td class="plan-cell plan-ms-trigger" ${click}>${renderMilestoneChips(bandMs)}</td>`;})()).join('')
    :`<td colspan="${cols.length}"></td>`;
  return `<tr class="plan-section-row plan-section-${key}" onclick="togglePlanSection('${key}')">
    <td class="plan-rowhead plan-section-cell" colspan="2"><div class="cell-flex"><span class="plan-section-label"><span class="caret-icon">${isOpen?'▾':'▸'}</span> ${label}</span>${extraHtml||''}${addSelect}</div></td>
    ${dateCells}
  </tr>`;
}
function buildPlanSectionGap(cols){return `<tr class="plan-section-gap"><td colspan="${cols.length+2}"></td></tr>`;}
window.togglePlanSection=function(key){if(planSectionExpanded.has(key))planSectionExpanded.delete(key);else planSectionExpanded.add(key);render();}
window.toggleTsSection=function(key){if(tsSectionOpen.has(key))tsSectionOpen.delete(key);else tsSectionOpen.add(key);render();}
window.toggleTsProj=function(name){if(tsProjCollapsed.has(name))tsProjCollapsed.delete(name);else tsProjCollapsed.add(name);render();}

window.tsCollapseAll=function(){tsSectionOpen.clear();for(const p of st.projects)tsProjCollapsed.add(p.name);render();}

// ── Team forecast view ────────────────────────────────────────────────────────────
function buildTeamForecast(cols){
  let h=`<div class="card"><div class="plan-scroll"><table class="plan-table view-${planView}">
  <thead><tr><th class="plan-rowhead">Name</th>
    ${cols.map(c=>`<th class="plan-wkcol ${c.isToday?'plan-now':''}${c.isWeekend?' plan-weekend-col':''}${c.isBH?' plan-bh-col':''}${(!c.isBH&&c.bhCount)?' plan-bhweek-col':''}">${c.label}${c.isBH?' <span class="bh-badge" title="UK bank holiday — office closed">BH</span>':c.bhCount?` <span class="bh-badge" title="${c.bhCount} UK bank holiday${c.bhCount>1?'s':''} this week — office closed">${c.bhCount>1?c.bhCount+'×':''}BH</span>`:''}${c.subLabel?`<br><span style="font-weight:500;font-size:9px;color:var(--grey)">${c.subLabel}</span>`:''}</th>`).join('')}
  </tr></thead><tbody>`;
  const roster=[...st.users.map(u=>({...u,_ph:false})),...st.placeholders.map(p=>({...p,_ph:true}))];
  for(const person of roster)h+=buildTeamPersonRow(person,cols);
  h+=`</tbody></table></div>
  </div>`;
  return h;
}

function buildTeamPersonRow(person,cols){
  const expanded=planTeamExpanded.has(person.name);
  const initials=person.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  let h=`<tr class="plan-proj-row"><td class="plan-rowhead plan-proj-cell" onclick="toggleTeamPerson('${jsq(person.name)}')">
    <div class="cell-flex" style="justify-content:flex-start;gap:7px"><span class="plan-caret caret-icon">${expanded?'▾':'▸'}</span>
    <span class="plan-avatar${person._ph?' plan-avatar-ph':''}">${person._ph?'?':initials}</span>
    <span style="display:flex;flex-direction:column;line-height:1.25">
      <span style="font-weight:600">${person.name}${person._ph?' <span class="badge badge-info" style="font-size:9px">Placeholder</span>':''}</span>
      ${person.role?`<span style="font-size:10px;color:var(--grey);font-weight:500">${escAttr(person.role)}</span>`:''}
    </span></div>
  </td>`;
  for(const c of cols){
    const u=personUtilStatus(person.name,c);
    h+=`<td class="plan-cell${planColCls(c)}">${u?`<div class="plan-util-bar plan-util-${u.status}" onclick="event.stopPropagation();openPlanBreakdown(event,'${jsq(person.name)}','${isoDate(c.start)}','${isoDate(c.end)}')" title="Click to see how this is made up">${u.label}</div>`:''}${!person._ph?bdayChip(person.name,c):''}</td>`;
  }
  h+=`</tr>`;
  if(expanded){
    const stages=personProjectStages(person.name);
    if(person._ph)h+=`<tr><td class="plan-rowhead" style="padding-left:32px" colspan="${cols.length+1}"><button class="btn btn-sm" onclick="event.stopPropagation();openPlaceholderPopover('${person.id}')">Edit placeholder</button> <button class="btn btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="event.stopPropagation();triggerRemovePlaceholder('${person.id}')">Remove placeholder</button></td></tr>`;
    for(const s of stages)h+=buildAssignmentRow('proj',{project:s.project,stage:s.stage},person.name,cols,`${s.project} · ${s.stage}`,32,false,1);
    h+=buildTeamAddRow(person.name,cols);
  }
  return h;
}
window.toggleTeamPerson=function(name){if(planTeamExpanded.has(name))planTeamExpanded.delete(name);else planTeamExpanded.add(name);render();}

// A light "+ Add" row under each expanded Team-view person — click or drag to bring
// up the same milestone-or-time-entry choice used on Projects/Non-billable, with the
// person already fixed; project & stage are picked in the popover that follows.
function buildTeamAddRow(personName,cols){
  const _lvR=personLeaveRanges(personName);
  let h=`<tr class="plan-stage-row"><td class="plan-rowhead plan-stage-cell" style="font-style:italic;font-weight:500;color:var(--dkgrey)">+ Add</td>`;
  for(const c of cols){
    const tc=leaveClashCls(_lvR,c.start,c.end,personName);
    if(planView==='month'||!c.assignStart){h+=`<td class="plan-cell${planColCls(c)}${tc.cls}"${tc.title}></td>`;continue;}
    h+=`<td class="plan-cell plan-empty-cell plan-ms-trigger${planColCls(c)}${tc.cls}"${tc.title} data-start="${isoDate(c.assignStart)}" data-end="${isoDate(c.assignEnd)}" onmousedown="planCreateStart(event,'choice-proj','','','${jsq(personName)}','${isoDate(c.assignStart)}','${isoDate(c.assignEnd)}')" onmouseenter="planCreateHover(event,'${isoDate(c.assignStart)}','${isoDate(c.assignEnd)}')"></td>`;
  }
  h+=`</tr>`;
  return h;
}
