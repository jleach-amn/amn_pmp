// ── Team-view breakdown popover — explains what makes up a utilization bar
// (which projects/stages, which leave type, which non-billable category) without
// needing to open that person's Timesheet.
window.openPlanBreakdown=function(e,person,startISO,endISO){
  planBreakdownState={person,colStart:startISO,colEnd:endISO,x:e.clientX,y:e.clientY};
  renderPlanBreakdown();
}
window.closePlanBreakdown=function(){planBreakdownState=null;renderPlanBreakdown();}
function renderPlanBreakdown(){
  const el=document.getElementById('plan-breakdown-container');if(!el)return;
  if(!planBreakdownState){el.innerHTML='';return;}
  const{person,colStart,colEnd,x,y}=planBreakdownState;
  const col={start:parseISO(colStart),end:parseISO(colEnd)};
  const{proj,leave,nb}=personBreakdownInCol(person,col);
  const capacity=personCapacityInCol(person,col);
  const sum=(o)=>Object.values(o).reduce((a,b)=>a+b,0);
  const allocated=sum(proj)+sum(leave)+sum(nb);
  const rangeLabel=colStart===colEnd?fmt(col.start):`${fmt(col.start)} – ${fmt(col.end)}`;
  const group=(title,obj)=>Object.keys(obj).length?`<div class="plan-breakdown-group">${title}</div>${Object.entries(obj).map(([k,v])=>`<div class="plan-breakdown-row"><span>${escAttr(k)}</span><span>${v.toFixed(1)}h</span></div>`).join('')}`:'';
  const top=Math.max(8,Math.min(y,window.innerHeight-340)),left=Math.max(8,Math.min(x,window.innerWidth-300));
  el.innerHTML=`<div class="note-popover plan-popover-lg" id="plan-breakdown-popover" style="top:${top}px;left:${left}px">
    <div class="note-popover-hdr"><span>${escAttr(person)}</span><button onclick="event.stopPropagation();closePlanBreakdown()" style="background:none;border:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--dkgrey)">×</button></div>
    <div style="font-size:10px;color:var(--dkgrey);padding:6px 14px;border-bottom:1px solid var(--mid)">${rangeLabel}</div>
    <div style="padding:8px 14px;max-height:260px;overflow-y:auto">
      ${group('Projects',proj)}${group('Leave',leave)}${group('Non-billable',nb)}
      ${allocated<=0?`<div style="font-size:12px;color:var(--dkgrey);padding:4px 0">Nothing allocated in this period.</div>`:''}
    </div>
    <div style="padding:8px 14px;border-top:1px solid var(--mid);display:flex;justify-content:space-between;font-size:11px;font-weight:700">
      <span>Total</span><span>${allocated.toFixed(1)}h of ${capacity.toFixed(1)}h capacity</span>
    </div>
  </div>`;
}

// Project likelihood / temperature — the ONLY four colours a project may take,
// shared by the Projects page and the Forecast so they can never diverge.
const PROJ_TEMPS=[
  {c:'#718157',label:'100% — project is a go'},
  {c:'#DFA64F',label:'40% — likely'},
  {c:'#E9734B',label:'10% — long shot'},
  {c:'#C9C3BA',label:'Dormant'}
];
const PLAN_COLORS=PROJ_TEMPS.map(t=>t.c);
// Stage-level likelihood (Income page): each stage inherits the project's
// likelihood colour unless ph.likelihood (100|40|10|0) is set — e.g. Stage 1
// appointed at 100% while Stage 2 waits at 40%. Forecast/Projects keep using
// the single project colour; only the Income page reads the per-stage value.
const LIK_VALUES=[100,40,10,0];
const LIK_BY_COLOR={'#718157':100,'#DFA64F':40,'#E9734B':10,'#C9C3BA':0};
function likColor(v){return v===40?'#DFA64F':v===10?'#E9734B':v===0?'#C9C3BA':'#718157';}
function likShort(v){return v===0?'Dormant':v+'%';}
function projLikelihood(p){return p&&LIK_BY_COLOR[p.planColor]!==undefined?LIK_BY_COLOR[p.planColor]:100;}
function stageLikelihood(p,ph){return ph&&typeof ph.likelihood==='number'?ph.likelihood:projLikelihood(p);}
window.setPhLikelihood=function(i,pi,v){if(!(isAdmin()||isPM()))return;const p=st.projects[i],ph=p&&(p.phases||[])[pi];if(!ph)return;if(v===''||v===null||v===undefined)delete ph.likelihood;else ph.likelihood=parseInt(v)||0;save();render();}
function tempRank(p){const i=PLAN_COLORS.indexOf(p&&p.planColor);return i===-1?PLAN_COLORS.length:i;}
function tempLabel(c){const t=PROJ_TEMPS.find(x=>x.c===c);return t?t.label:'';}
window.openPlanColorPicker=function(e,projName){planColorState={proj:projName,x:e.clientX,y:e.clientY};renderPlanColorPicker();}
window.closePlanColorPicker=function(){planColorState=null;renderPlanColorPicker();}
window.setProjTempFilter=function(v){projTempFilter=v;render();};
window.setProjPlanColor=function(projName,color){const p=st.projects.find(x=>x.name===projName);if(p){if(color)p.planColor=color;else delete p.planColor;save();}planColorState=null;render();}
function renderPlanColorPicker(){
  const el=document.getElementById('plan-color-container');if(!el)return;
  if(!planColorState){el.innerHTML='';return;}
  const{proj,x,y}=planColorState;
  const p=st.projects.find(pp=>pp.name===proj);

  el.innerHTML=`<div class="note-popover" style="top:${top}px;left:${left}px;min-width:210px" onclick="event.stopPropagation()">
    <div class="note-popover-hdr"><span>Colour label</span><button onclick="closePlanColorPicker()" style="background:none;border:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--dkgrey)">×</button></div>
    <div style="padding:10px 12px">
      <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:8px">${PROJ_TEMPS.map(t=>`<button onclick="setProjPlanColor('${jsq(proj)}','${t.c}')" style="display:flex;align-items:center;gap:9px;border:1px solid ${p&&p.planColor===t.c?'var(--blk)':'var(--mid)'};background:${p&&p.planColor===t.c?'var(--off)':'var(--wht)'};border-radius:7px;padding:6px 10px;cursor:pointer;font-family:'Figtree',sans-serif;font-size:12px;font-weight:600;color:var(--blk);text-align:left"><span class="temp-dot" style="background:${t.c};width:14px;height:14px"></span>${t.label}</button>`).join('')}</div>
      <button class="btn btn-sm" style="width:100%" onclick="setProjPlanColor('${jsq(proj)}',null)">No colour</button>
      <div style="font-size:10px;color:var(--grey);margin-top:6px">The likelihood colour is shared everywhere the project appears — Projects page and Forecast always match.</div>
    </div>
  </div>`;
}
function buildPlanProjectRow(proj,cols,expanded){
  const edP=planEditor();
  const pc=proj.planColor;
  let h=`<tr class="plan-proj-row">
    <td class="plan-rowhead plan-numcol plan-proj-cell" style="${pc?`box-shadow:inset 4px 0 0 ${pc}`:''}" onclick="togglePlanProj('${jsq(proj.name)}')">
      <div class="cell-flex"><span><span class="plan-caret caret-icon">${expanded?'▾':'▸'}</span> ${proj.code?`<span class="code-chip" style="font-size:9px">${proj.code}</span>`:''}</span></div>
    </td>
    <td class="plan-rowhead plan-proj-cell" onclick="togglePlanProj('${jsq(proj.name)}')">
      <div class="cell-flex"><span style="font-weight:600">${proj.name}${canManage()?`<button class="plan-color-dot" title="${pc?'Change or clear the colour label':'Add a colour label'}" onclick="event.stopPropagation();openPlanColorPicker(event,'${jsq(proj.name)}')" style="width:13px;height:13px;border-radius:50%;margin-left:8px;vertical-align:middle;cursor:pointer;background:${pc||'transparent'};border:${pc?'1px solid rgba(0,0,0,.15)':'1px dashed var(--grey)'}"></button>`:''}</span>
      ${edP?`<button class="plan-rm-person" title="Remove from forecast" onclick="event.stopPropagation();triggerRemoveProjectRow('${jsq(proj.name)}')">×</button>`:''}</div>
    </td>`;
  for(const c of cols){
    // Collapsed rows read as a milestone timeline: project-level milestones plus,
    // when collapsed, every stage's milestones (so nothing hides). Hour totals
    // now live on the stage rows below (visible when expanded).
    let ms=milestonesInRange(proj.name,null,c.start,c.end);
    if(!expanded)for(const ph of (proj.phases||[]))ms=ms.concat(milestonesInRange(proj.name,ph.name,c.start,c.end));
    const body=renderMilestoneChips(ms);
    if(!edP){
      h+=`<td class="plan-cell plan-agg${c.isWeekend?' plan-weekend-cell':''}${planColCls(c)}">${body}</td>`;
    } else if(planView==='month'){
      h+=`<td class="plan-cell plan-agg plan-ms-trigger${planColCls(c)}" onclick="planOpenMilestones(event,'${jsq(proj.name)}',null,'${isoDate(c.start)}','${isoDate(c.end)}')">${body}</td>`;
    } else {
      if(c.isWeekend){
        h+=`<td class="plan-cell plan-agg plan-weekend-cell plan-ms-trigger${planColCls(c)}" onclick="event.stopPropagation();openPlanMilestonesRange('${jsq(proj.name)}',null,'${isoDate(c.msStart||c.start)}','${isoDate(c.msEnd||c.end)}',event.clientX,event.clientY,null)">${body}</td>`;
      } else {
        h+=`<td class="plan-cell plan-agg plan-empty-cell plan-ms-trigger" data-start="${isoDate(c.start)}" data-end="${isoDate(c.end)}" onmousedown="planCreateStart(event,'choice-proj','${jsq(proj.name)}','','','${isoDate(c.start)}','${isoDate(c.end)}')" onmouseenter="planCreateHover(event,'${isoDate(c.start)}','${isoDate(c.end)}')">${body}</td>`;
      }
    }
  }
  h+=`</tr>`;
  return h;
}

function buildPlanStageBlock(proj,stage,cols){
  const edS=planEditor();
  let h=`<tr class="plan-stage-row"><td class="plan-rowhead plan-stage-cell" colspan="2">
    <div class="cell-flex"><span><span>${stage.name}</span>${stage.active===false?' <span style="font-size:9px;color:var(--grey);font-weight:500">(inactive)</span>':''}</span>
    ${edS?`<button class="plan-rm-person" title="Remove from forecast" onclick="event.stopPropagation();triggerRemoveStageRow('${jsq(proj.name)}','${jsq(stage.name)}')">×</button>`:''}</div>
  </td>`;
  for(const c of cols){
    const ms=milestonesInRange(proj.name,stage.name,c.start,c.end);
    const hrs=planStageColHrs(proj,stage.name,c);
    const body=`${hrs>0?`<div class="plan-agg-hrs">${hrs.toFixed(1)}h</div>`:''}${renderMilestoneChips(ms)}`;
    if(!edS){
      h+=`<td class="plan-cell${c.isWeekend?' plan-weekend-cell':''}${hrs>0?' plan-agg has-hrs':''}${planColCls(c)}">${body}</td>`;
    } else if(planView==='month'){
      h+=`<td class="plan-cell plan-ms-trigger${hrs>0?' plan-agg has-hrs':''}${planColCls(c)}" onclick="planOpenMilestones(event,'${jsq(proj.name)}','${jsq(stage.name)}','${isoDate(c.start)}','${isoDate(c.end)}')">${body}</td>`;
    } else {
      if(c.isWeekend){
        h+=`<td class="plan-cell plan-weekend-cell plan-ms-trigger${hrs>0?' plan-agg has-hrs':''}" onclick="event.stopPropagation();openPlanMilestonesRange('${jsq(proj.name)}','${jsq(stage.name)}','${isoDate(c.msStart||c.start)}','${isoDate(c.msEnd||c.end)}',event.clientX,event.clientY,null)">${body}</td>`;
      } else {
        h+=`<td class="plan-cell plan-empty-cell plan-ms-trigger${hrs>0?' plan-agg has-hrs':''}" data-start="${isoDate(c.start)}" data-end="${isoDate(c.end)}" onmousedown="planCreateStart(event,'choice-proj','${jsq(proj.name)}','${jsq(stage.name)}','','${isoDate(c.start)}','${isoDate(c.end)}')" onmouseenter="planCreateHover(event,'${isoDate(c.start)}','${isoDate(c.end)}')">${body}</td>`;
      }
    }
  }
  h+=`</tr>`;
  const people=getPlanRows(proj.name,stage.name);
  for(const person of people)h+=buildAssignmentRow('proj',{project:proj.name,stage:stage.name},person,cols,personIsPlaceholder(person)?`${escAttr(person)} <span class="badge badge-info" style="font-size:9px">Placeholder</span>`:person,32,true);
  return h;
}

function bdayChip(name,c){
  const u=st.users.find(x=>x.name===name);
  if(!u||!u.birthday)return '';
  const bm=parseInt(u.birthday.slice(5,7),10),bd=parseInt(u.birthday.slice(8,10),10);
  let d=c.start;const e=c.end;
  while(d<=e){if((d.getMonth()+1)===bm&&d.getDate()===bd)return ' <span class="plan-bday" title="Birthday!">🎂</span>';d=new Date(d);d.setDate(d.getDate()+1);}
  return '';
}
function renderMilestoneChips(list){
  if(!list.length)return'';
  const shown=list.slice(0,2);
  const tip=escAttr(encodeURIComponent(JSON.stringify(list.map(m=>({d:m.date,t:m.text})))));
  return `<div class="plan-ms-chips" data-mstip="${tip}" onmouseenter="planMsTipShow(event,this)" onmousemove="planMsTipMove(event)" onmouseleave="planMsTipHide()">${shown.map(m=>`<span class="plan-ms-chip">${escAttr(m.text)}</span>`).join('')}${list.length>shown.length?`<span class="plan-ms-more">+${list.length-shown.length}</span>`:''}</div>`;
}

function availablePeopleForRow(kind,project,stage){
  if(kind==='proj')return rosterForKind('proj').filter(u=>!getPlanRows(project,stage).includes(u.name));
  if(kind==='leave')return st.users.filter(u=>!u.deactivated&&!getLeaveRows().includes(u.name)&&(isAdmin()||u.name===st.currentUser));
  return st.users.filter(u=>!u.deactivated&&!getNBRows().includes(u.name));
}

// ── "+" column — structural adds (bring in a project, a stage, or a person), kept
// separate from the milestone/time-entry choice on content cells. It's a plain
// <select> so the browser opens it on a single click — picking an option adds the
// row immediately. Only Leave, Non-billable, and Projects get this; stages and
// people-under-a-stage appear purely by assigning them time on a cell (see below).
function projectAddOptions(){
  const added=new Set(getProjectRows());
  return st.projects.filter(p=>!p.archived&&!added.has(p.name)).map(p=>({value:p.name,label:(p.code?p.code+' — ':'')+p.name}));
}

    <option value="">+</option>

window.refreshPlanStageDropdown=function(){

window.doAddPlanProjStage=function(){
  if(!planEditor())return;
  const pSel=document.getElementById('plan-addproj');
  const sSel=document.getElementById('plan-addstage');
  if(!pSel||!sSel||!pSel.value||!sSel.value)return;
  const pool=st.projects.filter(p=>!p.archived&&(p.phases||[]).some(ph=>ph.active!==false));
  const proj=resolveProjInput(pSel.value,pool);
  if(!proj)return;

  save();render();
}

// A weekend cell allows milestones only (weekends never carry forecast time). Clicking
// opens the milestone popover for that single day, scoped to the given project/person.
function weekendMsCell(msProject,stage,person,c){
  const chips=renderMilestoneChips(milestonesInRange(msProject,stage,c.start,c.end,person));
  return `<td class="plan-cell plan-weekend-cell plan-ms-trigger${planColCls(c)}" onclick="event.stopPropagation();openPlanMilestonesRange('${jsq(msProject)}',${stage===null?'null':`'${jsq(stage)}'`},'${isoDate(c.msStart||c.start)}','${isoDate(c.msEnd||c.end)}',event.clientX,event.clientY,${person===null?'null':`'${jsq(person)}'`})">${chips}${person?bdayChip(person,c):''}</td>`;
}
// Renders one draggable-bar row, shared by Projects (kind='proj', backed by st.planAssignments)
// and Leave/Non-billable (kind='leave'|'nb', backed by contiguous runs over the raw stores).
function buildAssignmentRow(kind,identity,person,cols,rowLabel,indent,removable,labelSpan){
  labelSpan=labelSpan||2; // Projects table has # + Name columns; Team has one
  const edR=planEditor();
  if(!edR)removable=false;
  const removeHandler=`triggerRemovePlanPerson('${escAttr(identity.project)}','${escAttr(identity.stage)}','${escAttr(person)}')`;
  const chosenProject=kind==='proj'?identity.project:(kind==='leave'?'__leave__':'__nb__');
  const chosenStage=kind==='proj'?identity.stage:'';
  let h=`<tr class="plan-person-row${kind==='leave'?' plan-krow-leave':kind==='nb'?' plan-krow-nb':''}"><td class="plan-rowhead plan-person-cell" colspan="${labelSpan}" style="padding-left:${indent}px">
    <div class="cell-flex">${rowLabel}${removable?` <button class="plan-rm-person" title="Remove from planner" onclick="${removeHandler}">×</button>`:''}</div>
  </td>`;
  const _lvRanges=kind==='proj'?personLeaveRanges(person):null;
  const clashAt=(cs,ce)=>kind==='proj'?leaveClashCls(_lvRanges,cs,ce,person):{cls:'',title:''};
  const candidates=kind==='proj'?st.planAssignments.filter(a=>a.project===identity.project&&a.stage===identity.stage&&a.person===person):personRuns(kind,person,cols);
  const findCovering=(c)=>candidates.find(a=>parseISO(a.startDate)<=c.end&&parseISO(a.endDate)>=c.start);
  let i=0;
  while(i<cols.length){
    const c=cols[i];
    const a=findCovering(c);
    if(a){
      // Full column extent this assignment covers (may include weekend columns in day view).
      let end=i;
      while(end+1<cols.length&&findCovering(cols[end+1])===a)end++;
      const dayMode=planView==='day';
      const _clo=kind==='leave'&&a.closure;
      const label=kind==='proj'?`${a.hrsPerDay}h/d`:_clo?'Office closure':(kind==='leave'&&!isAdmin()&&person!==st.currentUser?(a.pending?'Leave (pending)':'Leave'):(kind==='leave'&&a.pending?a.type+' (pending)':a.type));
      const hasNote=!!getAssignmentNote({kind,project:identity.project,stage:identity.stage,person,type:a.type,startDate:a.startDate});
      const barData=`data-kind="${kind}" data-id="${a.id||''}" data-person="${escAttr(person)}" data-project="${kind==='proj'?escAttr(identity.project):''}" data-stage="${kind==='proj'?escAttr(identity.stage):''}" data-type="${kind!=='proj'?escAttr(a.type):''}" data-start="${a.startDate}" data-end="${a.endDate}" data-hrs="${a.hrsPerDay}"`;
      // Walk the extent: weekday columns render as bar segments; weekend columns as
      // hatched cells, so the coloured bar visibly stops and restarts around weekends.
      // Resize handles appear only on the outer edges of the whole assignment.
      let j=i,firstSeg=true;
      while(j<=end){
        if(cols[j].isWeekend){
          h+=`<td class="plan-cell plan-weekend-cell${cols[j].isToday?' plan-today-cell':''}"></td>`;
          j++;
        } else {
          let k=j;while(k+1<=end&&!cols[k+1].isWeekend)k++;
          const segCols=cols.slice(j,k+1);
          const segClash=clashAt(segCols[0].start,segCols[segCols.length-1].end);
          const isOuterL=(j===i),isOuterR=(k===end);
          h+=`<td class="plan-cell plan-bar-cell${segClash.cls}"${segClash.title} colspan="${k-j+1}">
            <div class="plan-bar${kind!=='proj'?' plan-bar-'+kind:''}${a.pending?' plan-bar-pending':''}" ${a.pending?'data-pending="1"':''} ${a.closure?'data-closure="1"':''} ${kind==='leave'&&(isAdmin()||person===st.currentUser)?`onclick="lvBarClick('${jsq(person)}','${a.startDate}')"`:''} ${barData} ${(()=>{if(kind!=='proj')return'';const pp=st.projects.find(x=>x.name===identity.project);return pp&&pp.planColor?`style="background:${pp.planColor}"`:'';})()} ${edR?'onmousedown="planBarMouseDown(event)"':''}>
              ${dayMode?`<div class="plan-bar-days">${segCols.map(sc=>`<span class="plan-bar-day"></span>`).join('')}</div>`:''}
              ${planView!=='month'&&isOuterL&&edR?`<span class="plan-bar-handle plan-bar-handle-l" onmousedown="planResizeStart(event,'l')"></span>`:''}
              ${firstSeg?`<span class="plan-bar-label">${escAttr(label)}</span>${hasNote?`<span class="plan-bar-note-dot" title="Has a note">•</span>`:''}`:''}
              ${planView!=='month'&&isOuterR&&edR?`<span class="plan-bar-handle plan-bar-handle-r" onmousedown="planResizeStart(event,'r')"></span>`:''}
            </div>
          </td>`;
          firstSeg=false;
          j=k+1;
        }
      }
      i=end+1;
    } else if(planView==='month'){
      const mc=clashAt(c.start,c.end);
      h+=`<td class="plan-cell${planColCls(c)}${mc.cls}"${mc.title}></td>`;
      i++;
    } else if(!c.assignStart){
      // Weekend cell on a Leave/NB row: milestones allowed, time is not.
      h+=(kind==='leave'||kind==='nb')&&edR?weekendMsCell(chosenProject,null,person,c):`<td class="plan-cell plan-weekend-cell${planColCls(c)}">${(kind==='leave'||kind==='nb')?bdayChip(person,c):''}</td>`;
      i++;
    } else {
      // Individual milestone chips for this person on their Leave/NB row.
      const msHere=(kind==='leave'||kind==='nb')?milestonesInRange(chosenProject,null,c.start,c.end,person):[];
      const ec=clashAt(c.start,c.end);
      h+=edR?`<td class="plan-cell plan-empty-cell plan-ms-trigger${planColCls(c)}${ec.cls}"${ec.title} data-start="${isoDate(c.assignStart)}" data-end="${isoDate(c.assignEnd)}" onmousedown="planCreateStart(event,'choice-${kind}','${jsq(chosenProject)}','${jsq(chosenStage)}','${jsq(person)}','${isoDate(c.assignStart)}','${isoDate(c.assignEnd)}')" onmouseenter="planCreateHover(event,'${isoDate(c.assignStart)}','${isoDate(c.assignEnd)}')">${renderMilestoneChips(msHere)}${(kind==='leave'||kind==='nb')?bdayChip(person,c):''}</td>`:`<td class="plan-cell${planColCls(c)}${ec.cls}"${ec.title}>${renderMilestoneChips(msHere)}${(kind==='leave'||kind==='nb')?bdayChip(person,c):''}</td>`;
      i++;
    }
  }
  h+=`</tr>`;
  return h;
}

function openPlanMilestonesRange(project,stage,startISO,endISO,x,y,person){
  planMsPopoverState={project,stage,colStart:startISO,colEnd:endISO,x,y,person:person!==undefined?person:null};
  renderMsPopover();
}
window.planOpenMilestones=function(e,project,stage,startISO,endISO){
  openPlanMilestonesRange(project,stage,startISO,endISO,e.clientX,e.clientY);
}
window.closeMsPopover=function(){planMsPopoverState=null;renderMsPopover();}
// Flattened "Project · Stage" options, used wherever neither is known yet
// (e.g. adding a brand-new assignment for a person from the Team view).
function projectStageOptions(){
  return st.projects.flatMap(p=>(p.phases&&p.phases.length?p.phases:[{name:'(no stage)'}]).map(ph=>
    `<option value="${escAttr(p.name)}|||${escAttr(ph.name)}">${p.code?p.code+' — ':''}${escAttr(p.name)} · ${escAttr(ph.name)}</option>`
  )).join('');
}
window.planMsBeginEdit=function(id){if(!planMsPopoverState)return;planMsPopoverState.editingId=id;renderMsPopover();}
window.planMsCancelEdit=function(){if(!planMsPopoverState)return;planMsPopoverState.editingId=null;renderMsPopover();}
window.doAddMilestone=function(){
  const ps=planMsPopoverState;if(!ps)return;
  const psEl=document.getElementById('plan-ms-projstage-input');
  let project=ps.project,stage=ps.stage;
  if(psEl){if(!psEl.value){undoToast('Choose a project and stage for the milestone.');return;}[project,stage]=psEl.value.split('|||');}

  addMilestone(project,stage,date,text,ps.person);
  if(psEl){planMsPopoverState=null;render();return;}
  renderMsPopover();render();
}
window.doRemoveMilestone=function(id){removeMilestone(id);renderMsPopover();render();}
function friendlyMsScope(project,stage){
  if(!project)return'a project';

  return base+(stage?` · ${stage}`:'');
}

// ── Choice popover — a stage cell can start either a one-off milestone or a
// person-specific time entry; this small menu picks which before handing off
// to the relevant popover, so a stage no longer needs its own "+ Add" row.
function openPlanChoice(opts){planChoiceState=opts;renderPlanChoice();}
window.closePlanChoice=function(){planChoiceState=null;renderPlanChoice();}
window.choosePlanMilestone=function(){
  const c=planChoiceState;if(!c)return;
  planChoiceState=null;renderPlanChoice();
  // Leave/NB rows carry a person (individual milestone); banner cells pass '' → office-wide (null).
  const person=(c.entryKind==='leave'||c.entryKind==='nb')?(c.person||null):undefined;
  openPlanMilestonesRange(c.project,c.stage||null,c.startDate,c.endDate,c.x,c.y,person);
}
window.choosePlanTimeEntry=function(){
  const c=planChoiceState;if(!c)return;
  planChoiceState=null;renderPlanChoice();
  const isProj=c.entryKind==='proj';
  // Leave is request-driven everywhere: any leave entry from the forecast opens the
  // same Add-leave window as the Leave page and calendar (office-wide banner → Everyone).
  if(c.entryKind==='leave'){
    openLeaveModal({person:c.person||'__office',start:c.startDate,end:c.endDate});
    return;
  }
  // NB office-wide keeps the bulk popover
  if(c.entryKind==='nb'&&!c.person){
    openOfficeWidePopover({kind:'nb',startDate:c.startDate,endDate:c.endDate,x:c.x,y:c.y});
    return;
  }
  openPlanPopover({mode:'new',kind:c.entryKind,project:isProj?(c.project||undefined):undefined,stage:isProj?(c.stage||null):undefined,person:c.person||'',startDate:c.startDate,endDate:c.endDate,x:c.x,y:c.y});
}

window.applyOfficeWide=function(){
  const ow=officeWideState;if(!ow)return;
  const sd=document.getElementById('ow-start-input').value,ed=document.getElementById('ow-end-input').value;
  const type=document.getElementById('ow-type-input').value;
  if(!sd||!ed||sd>ed){undoToast(sd&&ed?'The end date is before the start date.':'Choose a start and end date.');return;}
  if(!type){undoToast('Choose a type.');return;}
  const people=st.users.filter(u=>!u.deactivated);
  for(const u of people){
    const perDay=Math.round(((u.weeklyHours||37.5)/5)*10)/10;
    writeRawRange(ow.kind,u.name,type,sd,ed,perDay);
  }
  officeWideState=null;render();
}

// ── Move / resize an existing bar (day/week view only) ───────────────────────────
function planColumnLookup(){
  return[...document.querySelectorAll('table.plan-table thead th.plan-wkcol')].map(th=>{
    const r=th.getBoundingClientRect();return{key:th.dataset.key,left:r.left,right:r.right,days:parseInt(th.dataset.days||'7',10)};
  });
}
function planColIndexAtX(x){
  if(!planCols||!planCols.length)return null;
  for(let i=0;i<planCols.length;i++)if(x>=planCols[i].left&&x<planCols[i].right)return i;
  return x<planCols[0].left?0:planCols.length-1;
}
function descFromBarEl(el){
  const kind=el.dataset.kind;
  const desc={kind,person:el.dataset.person,startDate:el.dataset.start,endDate:el.dataset.end,hrsPerDay:parseFloat(el.dataset.hrs)};
  if(kind==='proj'){desc.id=el.dataset.id;desc.project=el.dataset.project;desc.stage=el.dataset.stage;}
  else desc.type=el.dataset.type;
  return desc;
}
// The bar's dataset only carries a slim descriptor; enrich with notes (from the shared
// cellNotes store) and, for proj, the audit trail from the stored record.
function enrichDesc(desc){
  const notes=getAssignmentNote(desc);
  if(desc.kind==='proj'){const a=st.planAssignments.find(x=>x.id===desc.id);if(a)return{...desc,notes,updatedAt:a.updatedAt,updatedBy:a.updatedBy};}
  return{...desc,notes};
}
// Leave bars may be dragged/resized only when the change can route through the
// request ledger: the covering request is edited and re-enters approval if needed.
function canDragLeaveBar(ds){
  if(!planEditor())return false;               // members: forecast is read-only
  if(ds.kind!=='leave')return true;
  if(ds.closure)return false;                 // closures are office-wide, fixed
  if(ds.type==='Bank Holiday')return false;   // system bookings
  if(!(isAdmin()||ds.person===st.currentUser))return false;
  const r=reqCoveringAny(ds.person,ds.start); // covers pending too — an edited
  return !!r&&!r.closure;                     // pending request simply stays pending
}
window.planBarMouseDown=function(e){
  if(!planEditor())return; // read-only viewers: the bar's click still opens the view modal
  const ds0=e.currentTarget&&e.currentTarget.dataset;
  if(ds0&&ds0.pending&&!canDragLeaveBar(ds0))return;
  if(ds0&&ds0.kind==='leave'&&!canDragLeaveBar(ds0))return;
  e.preventDefault();
  const el=e.currentTarget;
  const desc=descFromBarEl(el);
  // Month view: no dragging. Leave bars defer to their click handler (the leave
  // modal — the ledger's proper edit route); other kinds open the edit popover.
  if(planView==='month'){if(desc.kind!=='leave')openPlanPopover({mode:'edit',...enrichDesc(desc),x:e.clientX,y:e.clientY});return;}
  planCols=planColumnLookup();
  planDragState={mode:'move',desc,anchorIdx:planColIndexAtX(e.clientX),previewDelta:0};
  document.addEventListener('mousemove',planMoveHandler);
  document.addEventListener('mouseup',planMoveEnd,{once:true});
}
window.planResizeStart=function(e,side){
  if(!planEditor())return;
  e.preventDefault();e.stopPropagation();
  const el=e.currentTarget.closest('.plan-bar');
  if(el&&el.dataset&&el.dataset.kind==='leave'&&!canDragLeaveBar(el.dataset))return;
  const desc=descFromBarEl(el);
  planCols=planColumnLookup();
  planDragState={mode:'resize',desc,side,anchorIdx:planColIndexAtX(e.clientX),previewDelta:0};
  document.addEventListener('mousemove',planMoveHandler);
  document.addEventListener('mouseup',planResizeEnd,{once:true});
}
function planMoveHandler(e){
  if(!planDragState)return;
  const idx=planColIndexAtX(e.clientX);if(idx==null)return;
  planDragState.previewDelta=idx-planDragState.anchorIdx;
}
// Moves/resizes commit the date change and, if the start date shifted, relocate any
// note so it stays attached to the entry rather than being orphaned at the old date.
function commitDescRangeAndNote(desc,newStart,newEnd,newHrs){
  const note=getAssignmentNote(desc);
  commitDescRange(desc,newStart,newEnd,newHrs);
  if(note&&newStart!==desc.startDate){
    setAssignmentNote(desc,'');
    setAssignmentNote({...desc,startDate:newStart},note);
  }
}
window.planMoveEnd=function(e){
  document.removeEventListener('mousemove',planMoveHandler);
  const ds=planDragState;planDragState=null;
  if(!ds||ds.mode!=='move')return;
  const delta=ds.previewDelta||0;
  if(delta===0){if(ds.desc.kind==='leave')return;openPlanPopover({mode:'edit',...enrichDesc(ds.desc),x:e.clientX,y:e.clientY});return;}
  const stepDays=(planCols[0]&&planCols[0].days)||7;
  const deltaDays=delta*stepDays;
  const newStart=isoDate(addDays(parseISO(ds.desc.startDate),deltaDays));
  const newEnd=isoDate(addDays(parseISO(ds.desc.endDate),deltaDays));
  commitDescRangeAndNote(ds.desc,newStart,newEnd);
  render();
}
window.planResizeEnd=function(e){
  document.removeEventListener('mousemove',planMoveHandler);
  const ds=planDragState;planDragState=null;
  if(!ds||ds.mode!=='resize')return;
  const delta=ds.previewDelta||0;if(delta===0)return;
  const stepDays=(planCols[0]&&planCols[0].days)||7;
  const deltaDays=delta*stepDays;
  let newStart=ds.desc.startDate,newEnd=ds.desc.endDate;
  if(ds.side==='l')newStart=isoDate(addDays(parseISO(ds.desc.startDate),deltaDays));else newEnd=isoDate(addDays(parseISO(ds.desc.endDate),deltaDays));
  if(newStart>newEnd){if(ds.side==='l')newStart=newEnd;else newEnd=newStart;}
  commitDescRangeAndNote(ds.desc,newStart,newEnd);
  render();
}

window.savePlanPopover=function(){
  const sd=document.getElementById('plan-start-input').value,ed=document.getElementById('plan-end-input').value;
  const v=parseFloat(document.getElementById('plan-hrs-input').value);
  const hrsPerDay=(!isNaN(v)&&v>0)?v:1;
  const ps=planPopoverState;if(!ps)return;
  if(!sd||!ed||sd>ed){undoToast(sd&&ed?'The end date is before the start date.':'Choose a start and end date.');return;}
  const typeEl=document.getElementById('plan-type-input');
  const type=typeEl?typeEl.value:undefined;
  const personEl=document.getElementById('plan-person-input');
  const person=personEl?personEl.value:ps.person;
  if(!person){undoToast('Choose a person for this entry.');return;}
  const projStageEl=document.getElementById('plan-projstage-input');
  let project=ps.project,stage=ps.stage;
  if(projStageEl){if(!projStageEl.value){undoToast('Choose a project and stage for this entry.');return;}[project,stage]=projStageEl.value.split('|||');}
  else{const stageEl=document.getElementById('plan-stage-input');stage=stageEl?stageEl.value:ps.stage;}
  if(ps.kind==='proj'&&(!project||!stage)){undoToast('Choose a project and stage for this entry.');return;}
  const notesEl=document.getElementById('plan-notes-input');
  const notes=notesEl?notesEl.value.trim():'';
  if(ps.mode==='new'){
    if(ps.kind==='proj')addPlanRow(project,stage,person);
    // (leave/nb rows appear automatically for every active user — no explicit row add needed)
    const repeatCb=document.getElementById('plan-repeat-cb');
    const weeks=repeatCb&&repeatCb.checked?(parseInt(document.getElementById('plan-repeat-weeks').value,10)||1):1;
    const extraPeople=ps.kind==='proj'?[...document.querySelectorAll('.plan-extra-person')].filter(cb=>cb.checked&&cb.value!==person).map(cb=>cb.value):[];
    for(const who of [person,...extraPeople]){
      if(ps.kind==='proj'&&who!==person)addPlanRow(project,stage,who);
      for(let i=0;i<Math.max(1,weeks);i++){
        const s=isoDate(addDays(parseISO(sd),i*7)),e=isoDate(addDays(parseISO(ed),i*7));
        commitDescCreate(ps.kind,{project,stage,person:who,type},s,e,hrsPerDay,notes);
        if(notes)setAssignmentNote({kind:ps.kind,project,stage,person:who,type,startDate:s},notes);
      }
    }
  } else {
    const copyTo=ps.kind==='proj'?[...document.querySelectorAll('.plan-extra-person')].filter(cb=>cb.checked&&cb.value!==ps.person).map(cb=>cb.value):[];
    for(const who of copyTo){
      addPlanRow(project,stage,who);
      commitDescCreate(ps.kind,{project,stage,person:who,type},sd,ed,hrsPerDay,notes);
      if(notes)setAssignmentNote({kind:ps.kind,project,stage,person:who,type,startDate:sd},notes);
    }
    const oldDesc={kind:ps.kind,project:ps.project,stage:ps.stage,person:ps.person,type:ps.type,startDate:ps.startDate,endDate:ps.endDate};
    if(ps.kind==='proj')updatePlanAssignment(ps.id,{hrsPerDay,startDate:sd,endDate:ed});
    else{clearRawRange(ps.kind,ps.person,ps.type,ps.startDate,ps.endDate);writeRawRange(ps.kind,person,type,sd,ed,hrsPerDay);}
    if(oldDesc.startDate!==sd||oldDesc.type!==type)setAssignmentNote(oldDesc,'');

function drawCustomReportChart(){
  const canvas=document.getElementById('crChart');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const data=customReportChart;
  const H=220;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth-44;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  if(!data||!data.keys.length||data.cumulative[data.cumulative.length-1]<=0){
    ctx.fillStyle='#857F76';ctx.font='12px Figtree,sans-serif';
    ctx.fillText('No billable hours matched these filters in this period.',20,40);
    return;
  }
  const pad={t:20,r:16,b:36,l:72};
  const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  const n=data.keys.length;
  const maxV=Math.max(...data.cumulative,1)*1.15;
  const xP=i=>pad.l+i*(cW/n)+(cW/n)/2;
  const yP=v=>pad.t+cH-(v/maxV)*cH;
  const bw=Math.max(2,Math.floor(cW/n)-4);
  for(let i=0;i<=4;i++){const y=pad.t+cH*(i/4);ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();ctx.fillStyle='#55504A';ctx.font='600 11.5px Figtree,sans-serif';ctx.textAlign='right';ctx.fillText(gbp(maxV*(1-i/4)),pad.l-5,y+4);}
  for(let i=0;i<n;i++){if(data.perPeriod[i]>0){const bh=(data.perPeriod[i]/maxV)*cH;ctx.fillStyle='#8A9BB1';ctx.fillRect(xP(i)-bw/2,pad.t+cH-bh,bw,bh);}}
  ctx.save();ctx.strokeStyle='#26221E';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.beginPath();
  for(let i=0;i<n;i++){const x=xP(i),y=yP(data.cumulative[i]);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
  ctx.stroke();
  for(let i=0;i<n;i++){ctx.fillStyle='#26221E';ctx.beginPath();ctx.arc(xP(i),yP(data.cumulative[i]),3,0,Math.PI*2);ctx.fill();}
  ctx.restore();
  ctx.fillStyle='#55504A';ctx.font='600 11px Figtree,sans-serif';ctx.textAlign='center';
  const step=n>10?Math.ceil(n/8):1;
  for(let i=0;i<n;i+=step)ctx.fillText(data.labels[i],xP(i),pad.t+cH+20);
}
function drawSpendChart(canvasId,proj,stageName,fee,H){

  const yP=v=>pad.t+cH-(v/maxV)*cH;

  // now line
  const nw=nowWk();const ni=nowIdxOverride!=null?nowIdxOverride:sorted.indexOf(nw);
  if(ni>=0){const tx=xP(ni);ctx.save();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(tx,pad.t);ctx.lineTo(tx,pad.t+cH);ctx.stroke();ctx.fillStyle='#55504A';ctx.font='600 11px Figtree,sans-serif';ctx.textAlign='center';ctx.fillText('NOW',tx,pad.t+cH+14);ctx.restore();}
  // start/end date lines (only on project-level chart, not stage filter)
  if(!stageName){

// ── Projects ──────────────────────────────────────────────────────────────────
// Active workstages of a project, for the sortable Stages column. Each active
// phase contributes {n,label}: n = the FIRST number in the phase name (sort
// key), label = the number-ish token for display ("0\u20131", "3", "2.1"). Phases
// with no number (custom names like "Planning") are ignored for ranking.
function projStageNums(p){const out=[];
  for(const ph of (p.phases||[])){
    if(ph.active===false)continue;
    const m=String(ph.name||'').match(/(\d+(?:\.\d+)?)(\s*[\u2013\u2014-]\s*\d+(?:\.\d+)?)?/);
    if(m)out.push({n:parseFloat(m[1]),label:(m[1]+(m[2]||'')).replace(/\s+/g,'')});
  }
  return out.sort((a,b)=>a.n-b.n);
}
// Joe's hierarchy (28 Jul): rank by the SET of active stage numbers, compared
// lexicographically \u2014 [1] < [1,2] < [1,3] < [1,4] < [2] < [2,3] < [4].
// An active stage 1 outranks a stage-2-only project even if stage 4 is also
// active. Projects with no numbered active stages sort last.
function projStageKeyCmp(A,B){const a=projStageNums(A),b=projStageNums(B);
  if(!a.length&&!b.length)return 0;if(!a.length)return 1;if(!b.length)return -1;
  const n=Math.min(a.length,b.length);
  for(let i=0;i<n;i++)if(a[i].n!==b[i].n)return a[i].n-b[i].n;
  return a.length-b.length;
}

      }

    }
  }
  h+=`</tbody></table></div>`;
  if(admin){
    const archived=st.projects.filter(p=>p.archived&&(!q||projMatches(p,q)));
    if(archived.length){
      h+=`<div class="card"><div class="card-title">Archived Projects (${archived.length})</div>
      <table class="rtable"><thead><tr><th>Project #</th><th>Project</th><th>Client</th><th></th></tr></thead><tbody>
      ${archived.map(p=>{const client=st.clients.find(c=>c.id===p.clientId);return `<tr><td><span class="code-chip">${p.code||'—'}</span></td><td>${escAttr(p.name)}</td><td>${client?escAttr(client.company):'<span style="color:var(--grey)">—</span>'}</td><td style="text-align:right"><button class="btn btn-sm" onclick="doUnarchiveProject('${jsq(p.name)}')">Reactivate</button> <button class="btn btn-danger btn-sm" onclick="triggerDeleteProject('${jsq(p.name)}')">Delete</button></td></tr>`;}).join('')}

    }
  }
  return h;
}

// ── Income forecast ────────────────────────────────────────────────────────────
// Admin-only monthly view over the invoice installments — the portal's version
// of the cashflow spreadsheet's Income Forecast tab. Rows are project/stage
// lines (per-stage likelihood weights the Probable total), columns are months;
// a cell is that line's installments dated in that month and clicks open an
// editing popover that writes the SAME records as the project modal's Invoicing
// card. Amounts are net of VAT throughout, matching the spreadsheet.
const INC_BACK=3,INC_FWD=20; // 24 rendered months: wide enough to overflow
// the page and scroll sideways (the ‹ › / Today buttons still jump the window)
function ymNow(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymAdd(ym,n){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymLabel(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'short'})+' '+String(y).slice(2);}
function incMonths(){const base=ymAdd(ymNow(),incOff);const out=[];for(let i=-INC_BACK;i<=INC_FWD;i++)out.push(ymAdd(base,i));return out;}
function vatQuarterOf(ym){const[y,m]=ym.split('-').map(Number);return{y,q:Math.ceil(m/3)};}
// Ordered blocks: every non-archived project with an active stage (or any
// installments), sorted by project number then name. Stage-fee projects list
// each stage that's active or carries a fee/installments; total-fee projects
// are one line priced by the project's own likelihood colour.
function incLines(){
  const blocks=st.projects.map((p,i)=>({p,i}))
    .filter(({p})=>!p.archived&&((p.phases||[]).some(ph=>ph.active!==false)||pInvSums(p.name).n>0))
    .map(({p,i})=>{
      const total=p.feeMode==='total';
      const lines=total
        ?[{pi:-1,label:'Total fee',fee:parseFloat(p.totalFee)||0,list:p.invoices||[],lik:projLikelihood(p),inherit:true}]
        :(p.phases||[]).map((ph,pi)=>({pi,label:ph.name,fee:parseFloat(ph.fee)||0,list:ph.invoices||[],lik:stageLikelihood(p,ph),inherit:typeof ph.likelihood!=='number'}))
          .filter(l=>{const ph=p.phases[l.pi];return ph.active!==false||(ph.invoices&&ph.invoices.length)||ph.fee;});
      for(const l of lines){const su=invSums(l.list);l.mm=l.fee>0&&invMismatch(su.conf,l.fee);}
      const n=lines.reduce((sm,l)=>sm+l.list.length,0);
      const client=st.clients.find(c=>c.id===p.clientId);
      return{p,i,total,lines,n,client:client?client.company:'',sortLik:lines.reduce((m,l)=>Math.max(m,l.lik),0)};
    });
  // Sortable: project number (default), name, client, or probability (a
  // project's most likely line). Direction flips on a second header click.
  const d=incSort.dir,by=incSort.by;
  const cmpCode=(a,b)=>{const ac=a.p.code||'',bc=b.p.code||'';if(ac&&bc&&ac!==bc)return ac<bc?-1:1;if(ac&&!bc)return -1;if(bc&&!ac)return 1;return a.p.name.localeCompare(b.p.name);};
  blocks.sort((a,b)=>{
    let r=0;
    if(by==='name')r=a.p.name.localeCompare(b.p.name);
    else if(by==='client')r=(a.client||'\uffff').localeCompare(b.client||'\uffff');
    else if(by==='lik')r=a.sortLik-b.sortLik;
    if(r===0)r=cmpCode(a,b);
    return r*d;
  });
  return blocks;
}
window.incSortBy=function(by){if(incSort.by===by)incSort.dir=-incSort.dir;else incSort={by,dir:1};render();}
window.incSearch=function(el){const v=el.value,pos=el.selectionStart;incQ=v;render();const e2=document.getElementById('inc-search');if(e2){e2.focus();try{e2.setSelectionRange(pos,pos);}catch(_){}}}
window.incTogDorm=function(){incHideDorm=!incHideDorm;render();}
// A block matches on project code, name, client, or any stage-line label.
function incBlockMatch(b,q){
  if(!q)return true;
  if((b.p.code||'').toLowerCase().includes(q))return true;
  if(b.p.name.toLowerCase().includes(q))return true;
  if((b.client||'').toLowerCase().includes(q))return true;
  return b.lines.some(l=>String(l.label||'').toLowerCase().includes(q));
}
function incCell(list,ym){let conf=0,unconf=0,inv=0,paid=0,all=0,n=0;
  for(const v of list||[]){if((v.date||'').slice(0,7)!==ym)continue;n++;const a=invAmt(v);all+=a;if(v.confirmed)conf+=a;else unconf+=a;if(v.invoiced)inv+=a;if(v.paid)paid+=a;}
  return{conf,unconf,inv,paid,all,n};}
// Cell colour: cyan while any invoice awaits payment, salmon when the month's
// invoices are all paid, plain for planned, grey italic for unconfirmed-only.
// A dot marks a month mixing states — the popover tells the full story.
function incCellCls(c){if(!c.n)return'';
  const states=[];if(c.inv-c.paid>0.005)states.push('inv');if(c.paid>0.005)states.push('paid');if(c.conf-c.inv>0.005)states.push('plan');if(c.unconf>0.005)states.push('unconf');
  const primary=states.includes('inv')?'inc-inv':states.includes('paid')?'inc-paid':states.includes('plan')?'':'inc-unconf';
  const parts=[];if(primary)parts.push(primary);if(states.length>1)parts.push('inc-mixed');return parts.join(' ');}
// Month totals across all lines. Confirmed = confirmed installments on
// 100%-likelihood lines; Probable = confirmed installments weighted by their
// line's likelihood; Max potential = everything at face value (unconfirmed
// possibles included — they appear ONLY here).
function incMonthTotals(blocks,ym){let conf=0,prob=0,max=0,inv=0,paid=0;
  for(const b of blocks)for(const l of b.lines){const c=incCell(l.list,ym);max+=c.all;prob+=c.conf*l.lik/100;if(l.lik===100)conf+=c.conf;inv+=c.inv;paid+=c.paid;}
  return{conf,prob,max,inv,paid};}
function incQuarterInvoiced(blocks,y,q){let t=0;
  for(const b of blocks)for(const l of b.lines)for(const v of l.list){if(!v.invoiced)continue;const d=v.date||'';if(+d.slice(0,4)===y&&Math.ceil(+d.slice(5,7)/3)===q)t+=invAmt(v);}
  return t;}
// AMN's financial year is assumed to start 1 APRIL (the UK default) — CONFIRM
// with Joe; if different this constant is the only change needed.
const FY_START_MONTH=4;
function fyOf(ym){const[y,m]=ym.split('-').map(Number);return m>=FY_START_MONTH?y:y-1;}
function fyLabel(startY){return'FY '+startY+'/'+String(startY+1).slice(2);}
function fyNowStart(){return fyOf(ymNow())+'-'+String(FY_START_MONTH).padStart(2,'0');}
// Sum a line's installments over an inclusive YYYY-MM range (YtD / FY columns).
function incRangeCell(list,from,to){let conf=0,all=0;
  for(const v of list||[]){const ym=(v.date||'').slice(0,7);if(!ym||ym<from||ym>to)continue;const a=invAmt(v);all+=a;if(v.confirmed)conf+=a;}
  return{conf,all};}
function incRangeTotals(blocks,from,to){let conf=0,prob=0,max=0;
  for(const b of blocks)for(const l of b.lines){const c=incRangeCell(l.list,from,to);max+=c.all;prob+=c.conf*l.lik/100;if(l.lik===100)conf+=c.conf;}
  return{conf,prob,max};}
// Deep link: open THIS project's Edit modal with the Invoicing card (and the
// clicked stage's section) already expanded — the table and the modal edit the
// same records, this makes the link tangible.
window.incOpenInvoicing=function(i,pi){

  save();render();}
// Likelihood dot picker (the column is just the coloured circle; the labels
// live here and in the page key).
window.incLikOpen=function(e,i,pi){if(!isAdmin())return;incLikPick={i,pi,x:e.clientX,y:e.clientY};renderIncLikPicker();}
window.incLikSet=function(i,pi,v){incLikPick=null;renderIncLikPicker();setPhLikelihood(i,pi,v);}
function renderIncLikPicker(){
  const el=document.getElementById('inc-lik-container');if(!el)return;
  if(!incLikPick){el.innerHTML='';return;}
  const{i,pi,x,y}=incLikPick;const p=st.projects[i];const ph=p&&(p.phases||[])[pi];
  if(!p||!ph){incLikPick=null;el.innerHTML='';return;}
  const cur=typeof ph.likelihood==='number'?ph.likelihood:null;

function daysInYm(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
// Drag-to-repeat (Excel-style fill, as on the Forecast/Leave tables): drag a
// cell along its row to copy that month's installments into the covered months.
// Copies land as PLANNED (never invoiced/paid — you can't repeat an issued
// invoice), keep amount/note/confirmed, clamp the day to shorter months, and
// only fill EMPTY months — existing installments are never overwritten.
// Client expenses belong to the actual invoice they were billed on and are
// deliberately NOT copied onto repeats (copies are plain fee installments).
window.incRepeat=function(i,pi,fromYm,toYm){
  if(!isAdmin())return 0;
  const list=invListFor(st.projects[i],pi);if(!list)return 0;
  const src=list.filter(v=>(v.date||'').slice(0,7)===fromYm);
  if(!src.length||fromYm===toYm)return 0;
  const step=toYm>fromYm?1:-1;let added=0;
  for(let ym=ymAdd(fromYm,step);;ym=ymAdd(ym,step)){
    if(step>0?ym>toYm:ym<toYm)break;
    if(incCell(list,ym).n===0){
      for(const v of src){
        const day=Math.min(parseInt((v.date||'').slice(8,10))||1,daysInYm(ym));
        list.push({id:crmId('iv'),amount:parseFloat(v.amount)||0,date:ym+'-'+String(day).padStart(2,'0'),ref:v.ref||'',invoiced:false,confirmed:!!v.confirmed,paid:false,paidDate:''});
        added++;
      }
    }
    if(ym===toYm)break;
  }
  if(added){save();render();}
  return added;
}
function ymDiff(a,b){const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return(ya-yb)*12+(ma-mb);}
// Shift a selected range of PLANNED installments by whole months (the manual
// slip tool: select with shift+click, drag the selection sideways). Issued or

window.incShift=function(i,pi,from,to,delta){
  if(!isAdmin()||!delta)return 0;
  const list=invListFor(st.projects[i],pi);if(!list)return 0;
  const lo=from<to?from:to,hi=from<to?to:from;
  let moved=0,held=0;
  for(const v of list){
    const ym=(v.date||'').slice(0,7);if(!ym||ym<lo||ym>hi)continue;
    if(v.invoiced||v.paid){held++;continue;}
    const t=ymAdd(ym,delta);
    const day=Math.min(parseInt(v.date.slice(8,10))||1,daysInYm(t));
    v.date=t+'-'+String(day).padStart(2,'0');moved++;
  }
  if(moved){save();render();}
  if(held)undoToast(held+' issued/paid installment'+(held>1?'s':'')+' stayed put — only planned installments move');
  return moved;
}

function incDragPaint(){
  try{
    const d=incDrag;if(!d)return;
    let lo,hi;
    if(d.mode==='move'){const delta=ymDiff(d.to,d.from);lo=ymAdd(d.selLo,delta);hi=ymAdd(d.selHi,delta);}
    else{lo=d.from<d.to?d.from:d.to;hi=d.from<d.to?d.to:d.from;}
    document.querySelectorAll('td[data-line="'+d.i+':'+d.pi+'"]').forEach(c=>{
      const ym=c.getAttribute('data-ym');
      const on=!!ym&&ym>=lo&&ym<=hi&&(d.mode==='move'||ym!==d.from);

    });
  }catch(e){}
}
function incDragUp(){
  const d=incDrag;incDrag=null;

  if(!d||d.to===d.from)return;      // no movement: the click opens the popover as usual

// Line chart of the monthly scenario totals, pixel-aligned with the table:
// x positions come from the measured centres of the month header cells, so a
// point sits directly beneath its column, the two stay locked while scrolling
// (same container), and ‹ › / Today re-align both. The table header IS the
// x-axis, so the chart draws no month labels of its own. £ gridline labels sit
// at BOTH ends because either end can be scrolled out of view.
const INC_SERIES=[
  {key:'conf',label:'Confirmed',color:'#718157',dash:''},
  {key:'prob',label:'Probable',color:'#DFA64F',dash:''},
  {key:'max',label:'Max potential',color:'#8C857B',dash:'5,4'},
  {key:'paid',label:'Paid',color:'#B04A3F',dash:''}];
function incChartSvg(months,tots,centers,edges,W,now){
  // centers = data-point x per month; edges = LEFT x of each month column.
  // The verticals are drawn at the edges so they CONTINUE the table's own
  // rules through the chart band (Joe's screenshot: centre-drawn FY lines sat
  // half a column right of the 3px table rules). Widths/colours match the
  // table: 3px dkgrey boundary + FY rules, 2px accent this-month inset.
  const top=Math.max(...tots.map(t=>Math.max(t.conf,t.prob,t.max,t.paid)));
  if(top<=0.005)return'';
  const mag=Math.pow(10,Math.floor(Math.log10(top)));
  const ymax=[1,2,5,10].map(k=>k*mag).find(v=>v>=top);
  const H=222,T=14,B=10,ph=H-T-B;
  const Y=v=>T+ph-(v/ymax)*ph;
  const fmt=v=>v>=1000?('£'+((v/1000)%1===0?(v/1000):(v/1000).toFixed(1))+'k'):'£'+Math.round(v);
  const x0=edges&&edges.length?edges[0]:0;
  let g='';
  for(let gi=0;gi<=4;gi++){const v=ymax*gi/4,y=Y(v);
    g+=`<line x1="${x0}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--mid)" stroke-width="1"/>`;
    if(gi>0)g+=`<text x="${Math.max(24,x0-6)}" y="${y-3}" text-anchor="end" font-size="9" fill="var(--dkgrey)">${fmt(v)}</text><text x="${W-6}" y="${y-3}" text-anchor="end" font-size="9" fill="var(--dkgrey)">${fmt(v)}</text>`;}
  g+=`<line x1="${x0+1.5}" y1="0" x2="${x0+1.5}" y2="${H}" stroke="var(--dkgrey)" stroke-width="3"/>`;
  months.forEach((ym,i)=>{const xe=edges[i];
    if(i>0&&+ym.split('-')[1]===FY_START_MONTH)g+=`<line x1="${xe+1.5}" y1="0" x2="${xe+1.5}" y2="${H}" stroke="var(--dkgrey)" stroke-width="3"/>`;
    if(ym===now)g+=`<line x1="${xe+1}" y1="0" x2="${xe+1}" y2="${H}" stroke="var(--accent)" stroke-width="2"/>`;});
  for(const sr of INC_SERIES){
    const pts=tots.map((t,i)=>`${centers[i].toFixed(1)},${Y(t[sr.key]).toFixed(1)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="${sr.color}" stroke-width="2"${sr.dash?` stroke-dasharray="${sr.dash}"`:''}/>`;
    g+=tots.map((t,i)=>t[sr.key]>0.005?`<circle cx="${centers[i].toFixed(1)}" cy="${Y(t[sr.key]).toFixed(1)}" r="2.6" fill="${sr.color}"><title>${sr.label} · ${ymLabel(months[i])} · ${gbpInv(t[sr.key])}</title></circle>`:'').join('');
  }
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block" role="img" aria-label="Monthly Confirmed, Probable, Max potential and Paid totals, aligned with the table columns">${g}</svg>`;
}
window.drawIncChart=function(){
  try{
    const wrap=document.getElementById('inc-chart-wrap');if(!wrap)return;
    const table=document.querySelector('.inc-table');if(!table){wrap.innerHTML='';return;}
    const months=incMonths(),blocks=incLines();
    const tots=months.map(ym=>incMonthTotals(blocks,ym));
    const hdr=table.tHead,row=hdr&&hdr.rows&&hdr.rows[hdr.rows.length-1];
    if(!row||!row.cells){wrap.innerHTML='';return;}
    const ths=Array.prototype.slice.call(row.cells,5,5+months.length);
    if(ths.length!==months.length){wrap.innerHTML='';return;}
    const base=wrap.getBoundingClientRect();
    if(!base.width)return; // hidden/collapsed — nothing to draw against
    const centers=[],edges=[];
    for(const th of ths){const r=th.getBoundingClientRect();edges.push(r.left-base.left);centers.push(r.left-base.left+r.width/2);}
    wrap.innerHTML=incChartSvg(months,tots,centers,edges,Math.max(1,Math.round(base.width)),ymNow());
    // THE ALIGNMENT FIX: re-measure whenever the table's size changes for any
    // reason — the Figtree webfont arriving after the first 60ms paint, a
    // column growing after an edit, a window resize. The chart can never be
    // left drawn against stale column positions. rAF-debounced so the
    // observer's own repaint can't loop.
    if(typeof ResizeObserver!=='undefined'){
      if(window._incRO)window._incRO.disconnect();
      window._incRO=new ResizeObserver(function(){try{
        if(st&&st._tab==='income'&&!window._incROBusy){window._incROBusy=true;
          requestAnimationFrame(function(){window._incROBusy=false;try{drawIncChart();}catch(e){}});}
      }catch(e){}});
      window._incRO.observe(table);
    }
  }catch(e){}
}
if(typeof document!=='undefined'&&document.fonts&&document.fonts.ready&&document.fonts.ready.then)document.fonts.ready.then(function(){try{if(st&&st._tab==='income')drawIncChart();}catch(e){}});

// ── Week-level workload maths — shared by the Home dashboard and the Team page ──
function weekCapacityFor(u,days){
  const wh=(u&&u.weeklyHours)||37.5;
  let bh=0;for(const d of days){const dow=d.getDay();if(dow>=1&&dow<=5&&UK_BH.has(isoDate(d)))bh++;}
  return Math.max(0,wh-(wh/5)*bh); // capacity honestly drops on bank-holiday weeks
}
function weekHoursFor(person,days){
  const wk=wkKey(days);
  let billable=0,unbilled=0,nb=0,lv=0;
  for(const[k,v]of Object.entries(st.entries)){const p=k.split('||');if(p[0]!==wk||p[3]!==person)continue;const h=parseFloat(v)||0;if(!h)continue;if(billableOn(person,p[1],dateForWk(wk,p[4]))>0)billable+=h;else unbilled+=h;}
  for(const[k,v]of Object.entries(st.nonBillable)){const p=k.split('||');if(p[0]===wk&&p[2]===person)nb+=parseFloat(v)||0;}
  for(const[k,v]of Object.entries(st.leave)){const p=k.split('||');if(p[0]===wk&&p[2]===person)lv+=parseFloat(v)||0;}
  return{billable,unbilled,nb,lv,total:billable+unbilled+nb+lv};
}
function weekScheduledFor(person,days){
  let t=0;
  for(const a of st.planAssignments){
    if(a.person!==person)continue;
    for(const d of days){const iso=isoDate(d);if(iso>=a.startDate&&iso<=a.endDate&&!isClosedDate(d))t+=parseFloat(a.hrsPerDay)||0;}
  }
  return t;
}
function utilBarHTML(billable,other,capacity){
  const cap=Math.max(capacity,0.01);
  const pb=Math.min(billable/cap*100,100);
  const po=Math.min(other/cap*100,Math.max(0,100-pb));
  const pct=Math.round(billable/cap*100);
  return`<div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:13px;border:1px solid var(--mid);border-radius:7px;overflow:hidden;background:#fff;display:flex;min-width:90px"><div style="width:${pb}%;background:var(--blue);flex-shrink:0" title="Billable"></div><div style="width:${po}%;background:var(--blue-lt);flex-shrink:0" title="Non-billable / unbilled"></div></div><span class="num" style="font-size:11px;font-weight:700;min-width:36px;text-align:right">${pct}%</span></div>`;
}

function homeAwayCardBody(){
  const mk=(days,title)=>{
    const rows=homeAwayRows(days);
    let h=`<div style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);font-weight:700;margin:2px 0 6px">${title}</div>`;
    if(!rows.length)return h+`<div style="font-size:12px;color:var(--dkgrey);margin-bottom:10px">Everyone's in.</div>`;
    h+=rows.map(({r,from,to})=>{
      const canSee=isAdmin()||r.person===st.currentUser;
      const label=canSee?r.type:'Leave';
      const range=from===to?fmt(parseISO(from)):`${fmt(parseISO(from))} – ${fmt(parseISO(to))}`;
      return`<div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0"><span style="font-weight:600">${escAttr(r.person)}</span><span style="color:var(--dkgrey)">${escAttr(label)} · ${range}${r.status==='pending'?' <span class="badge badge-pending" style="font-size:9px">pending</span>':''}${r.closure?' <span class="badge" style="font-size:9px">closure</span>':''}</span></div>`;
    }).join('');
    return h+`<div style="height:8px"></div>`;
  };
  // getWkDates(off,nDays): off is a WEEK offset — (7,7) was seven weeks out.
  return mk(getWkDates(0,7),'This week')+mk(getWkDates(1,7),'Next week');
}
function homeMilestones(u,horizonDays){
  const t0=isoDate(new Date()),t1=isoDate(addDays(new Date(),horizonDays));
  let ms=st.milestones.filter(m=>m.date>=t0&&m.date<=t1);
  if(!isAdmin()&&!isPM()){
    const myProjects=new Set([...(st.userProjects[u.name]||[]),...st.planAssignments.filter(a=>a.person===u.name).map(a=>a.project)]);
    ms=ms.filter(m=>m.person===u.name||(!m.person&&myProjects.has(m.project)));
  }
  return ms.sort((a,b)=>a.date<b.date?-1:1);
}
function homeActiveProjects(days){
  const wk=wkKey(days),s0=isoDate(days[0]),e0=isoDate(days[6]);
  const set=new Set();
  for(const a of st.planAssignments)if(!(a.startDate>e0||a.endDate<s0))set.add(a.project);
  for(const[k,v]of Object.entries(st.entries)){if((parseFloat(v)||0)<=0)continue;const p=k.split('||');if(p[0]===wk)set.add(p[1]);}
  return st.projects.filter(p=>!p.archived&&set.has(p.name));
}

let cpdYearFilter=new Date().getFullYear();

let cpdPersonFilter='me';
let cpdTopicEditorOpen=false;

window.doListSearch=function(which,el){

function projMatches(p,q){
  const c=st.clients.find(x=>x.id===p.clientId);
  return [(p.name||''),(p.code||''),(c?c.company:''),(p.clientName||'')].some(s=>String(s).toLowerCase().includes(q));

window.cpdToggleTopicEditor=()=>{cpdTopicEditorOpen=!cpdTopicEditorOpen;render();}
window.cpdArbAdd=function(){
  const el=document.getElementById('cpd-newtopic');const t=(el&&el.value||'').trim();
  if(!t)return;
  if(arbTopics().includes(t)){undoToast('That topic is already in the list.');return;}

window.cpdArbRemove=function(i){

function cpdEntriesFor(person,year){return st.cpd.filter(e=>e.attendees.includes(person)&&parseISO(e.date).getFullYear()===year);}
function cpdHoursFor(person,year){return cpdEntriesFor(person,year).reduce((s,e)=>s+(parseFloat(e.durationHours)||0),0);}
function cpdStructuredFor(person,year){return cpdEntriesFor(person,year).filter(e=>e.format!=='Informal').reduce((s,e)=>s+(parseFloat(e.durationHours)||0),0);}

// ── Time integration ──
// Undo whatever an entry previously wrote, then re-apply for its current
// date/hours/attendees. Submitted weeks get a pending notice instead of a write.
function applyCpdTime(e){
  for(const w of (e.timeWrites||[])){const{wk,dayIdx}=dateToWkDay(parseISO(w.date));sNB(wk,'CPD and training',w.person,dayIdx,Math.max(0,(gNB(wk,'CPD and training',w.person,dayIdx)||0)-w.hours));}
  e.timeWrites=[];
  st.cpdNotices=st.cpdNotices.filter(n=>!(n.cpdId===e.id&&n.status==='pending'));
  if(e.timeExempt){save();return;}
  const{wk,dayIdx}=dateToWkDay(parseISO(e.date));
  const hrs=parseFloat(e.durationHours)||0;if(hrs<=0)return;
  for(const person of e.attendees){
    if(isSub(person,wk)){
      st.cpdNotices.push({id:'cn'+Date.now()+Math.floor(Math.random()*1000),cpdId:e.id,person,date:e.date,hours:hrs,title:e.title,status:'pending'});
    } else {
      addNBActive(wk,person,'CPD and training');
      sNB(wk,'CPD and training',person,dayIdx,(gNB(wk,'CPD and training',person,dayIdx)||0)+hrs);
      e.timeWrites.push({person,date:e.date,hours:hrs});
    }
  }
  save();
}
window.acceptCpdNotice=function(id){
  const n=st.cpdNotices.find(x=>x.id===id);if(!n||n.status!=='pending')return;
  const e=st.cpd.find(x=>x.id===n.cpdId);
  const{wk,dayIdx}=dateToWkDay(parseISO(n.date));
  addNBActive(wk,n.person,'CPD and training');
  sNB(wk,'CPD and training',n.person,dayIdx,(gNB(wk,'CPD and training',n.person,dayIdx)||0)+n.hours);
  if(e)e.timeWrites.push({person:n.person,date:n.date,hours:n.hours});
  n.status='accepted';n.actedAt=new Date().toISOString();
  // The week was submitted; the CPD hours push it over target, so it must reopen
  // for the person to rebalance and resubmit — it can't stay "submitted" with
  // extra hours silently recorded.
  editingSubmitted.add(`${n.person}||${wk}`);
  save();render();
}
window.dismissCpdNotice=function(id){
  const n=st.cpdNotices.find(x=>x.id===id);if(!n||n.status!=='pending')return;
  n.status='dismissed';n.actedAt=new Date().toISOString();
  save();render();
}
// Banner shown on a person's own timesheet when submitted weeks have pending CPD time.
function cpdNoticeBanner(person){
  const pend=(st.cpdNotices||[]).filter(n=>n.person===person&&n.status==='pending');
  if(!pend.length)return'';
  return `<div class="card" style="border-left:3px solid var(--blue);margin-bottom:14px">
    <div class="card-title">CPD time awaiting your acceptance</div>
    ${pend.map(n=>`<div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--off)">
      <div style="flex:1;font-size:12px"><b>${escAttr(n.title)}</b> — ${n.hours}h on ${fmt(parseISO(n.date))}. Your timesheet for that week was already submitted; accepting adds the time to it.</div>
      <button class="btn btn-primary btn-sm" onclick="acceptCpdNotice('${jsq(n.id)}')">Accept &amp; add to timesheet</button>
      <button class="btn btn-sm" onclick="dismissCpdNotice('${jsq(n.id)}')">Ignore</button>
    </div>`).join('')}
  </div>`;
}

// ── Page ──
// A CPD entry's shared write-up (what we learned / how we're applying it /
// next steps) is expected once the event has happened. Live-computed nudge for
// the entry's CREATOR — no store, so it shows while any of the three boxes is
// empty and vanishes the moment they're completed (by anyone who can edit).
// Imported history (importId) is exempt: those gaps predate the portal.
function cpdWriteupsDue(person){
  const today=isoDate(new Date());
  return(st.cpd||[]).filter(e=>e&&!e.importId&&e.createdBy===person&&e.date&&e.date<today
    &&(!(e.notes||'').trim()||!(e.applying||'').trim()||!(e.nextSteps||'').trim()))
    .sort((a,b)=>a.date<b.date?-1:1);
}
function buildCPD(){
  ensureCpdRefs();
  const me=cur().name;
  const years=[...new Set([new Date().getFullYear(),...st.cpd.map(e=>parseISO(e.date).getFullYear())])].sort((a,b)=>b-a);
  const person=cpdView==='person'?(canManage()?(cpdPersonFilter==='me'?me:cpdPersonFilter):me):null;
  let h=pageHead('CPD','cpd',`<button class="btn-add" onclick="cpdOpenNew()">+ Add CPD entry</button>`)+`
  <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <div style="display:flex;gap:0">
      <button class="btn btn-sm" style="height:32px;${cpdView==='overview'?'background:var(--blk);color:#fff':''}" onclick="cpdSetView('overview')">Practice overview</button>
      <button class="btn btn-sm" style="height:32px;${cpdView==='person'?'background:var(--blk);color:#fff':''}" onclick="cpdSetView('person')">${canManage()?'Individual record':'My record'}</button>
    </div>
    ${cpdView==='person'&&canManage()?`<select onchange="cpdSetPerson(this.value)" style="font-size:12px;height:32px">

      ${st.users.filter(u=>!u.deactivated&&u.name!==me).map(u=>`<option value="${escAttr(u.name)}" ${cpdPersonFilter===u.name?'selected':''}>${escAttr(u.name)}</option>`).join('')}
    </select>`:''}
    <div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dkgrey);font-weight:600">Year</span>
      <select onchange="cpdSetYear(this.value)" style="font-size:12px;height:32px">${years.map(y=>`<option ${y===cpdYearFilter?'selected':''}>${y}</option>`).join('')}</select></div>
  </div>`;
  const due=cpdWriteupsDue(me);
  if(due.length)h+=`<div class="card" style="background:var(--warn-bg);border-color:var(--warn)">
    <div style="font-size:12px;font-weight:600;color:var(--warn);margin-bottom:6px">✎ ${due.length} CPD write-up${due.length===1?'':'s'} outstanding</div>
    <div style="font-size:11.5px;color:var(--dkgrey);margin-bottom:8px">These entries you created have happened but the shared boxes — what we learned, how we're applying it, next steps — aren't complete yet.</div>
    <div style="display:flex;flex-direction:column;gap:4px">${due.map(e=>`<div style="display:flex;align-items:center;gap:10px;font-size:12px"><span style="color:var(--dkgrey)">${fmt(parseISO(e.date))}</span><span style="font-weight:500;flex:1">${escAttr(e.title)}</span><button class="btn btn-sm" onclick="cpdOpenEdit('${jsq(e.id)}')">Complete write-up</button></div>`).join('')}</div>
  </div>`;
  h+=cpdView==='overview'?buildCPDOverview():buildCPDPerson(person);
  h+=`<div class="export-bar">
    <span class="export-note">${cpdView==='person'?'One person&rsquo;s record for the year, reflections included.':'Every entry × attendee for the year. Personal reflections are excluded.'}</span>
    ${cpdView==='person'?`<button class="btn" onclick="doExportCPD('${jsq(person)}',${cpdYearFilter})">Export ${person===me?'my':"this person's"} CPD (CSV)</button>`:`<button class="btn" onclick="doExportCPDPractice(${cpdYearFilter})">Export practice CPD (CSV)</button>`}

  return h;

// Practice overview: coverage pie, per-person compliance, attendance matrix.
function buildCPDOverview(){
  const yr=cpdYearFilter;
  const entries=st.cpd.filter(e=>parseISO(e.date).getFullYear()===yr).sort((a,b)=>a.date<b.date?1:-1);
  const people=st.users.filter(u=>!u.deactivated).map(u=>u.name);
  // hours per RIBA topic (an entry's hours count once per topic it covers)
  const topicHrs={};for(const t of CPD_RIBA)topicHrs[t]=0;
  for(const e of entries){const hrs=(parseFloat(e.durationHours)||0)*e.attendees.length;for(const t of (e.riba||[]))topicHrs[t]+=hrs;}
  const covered=CPD_RIBA.filter(t=>topicHrs[t]>0),uncovered=CPD_RIBA.filter(t=>!topicHrs[t]);
  let h=`<div class="card-row">
    <div class="card" style="flex:1;min-width:300px">
      <div class="card-title">Coverage by RIBA core topic — ${yr}</div>
      <div style="font-size:11px;color:var(--dkgrey);margin-bottom:8px">Person-hours across the practice (entry hours × attendees).</div>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <canvas id="cpdPie" width="190" height="190"></canvas>
        <div style="flex:1;min-width:200px;font-size:11px;line-height:1.9">${covered.map((t,i)=>`<div><span style="display:inline-block;width:9px;height:9px;background:${cpdPieColor(CPD_RIBA.indexOf(t))};margin-right:6px"></span>${escAttr(t)} — <b>${topicHrs[t].toFixed(1)}h</b></div>`).join('')||'<span style="color:var(--grey);font-style:italic">No CPD recorded this year yet.</span>'}</div>
      </div>
      ${uncovered.length?`<div style="margin-top:12px;font-size:11px;background:#FAF1DC;border:1px solid #EAC58C;color:#9A6E1F;padding:8px 10px"><b>Not yet covered in ${yr}:</b> ${uncovered.map(escAttr).join(' · ')}</div>`:''}
    </div>
    <div class="card" style="flex:1;min-width:300px">
      <div class="card-title">Per person — ${yr}</div>
      <table class="rtable"><thead><tr><th>Person</th><th style="text-align:right">Hours</th><th style="text-align:right">Structured</th>${arbTopics().map(t=>`<th style="text-align:center;font-size:9px" title="ARB mandatory: ${escAttr(t)}">${escAttr(t.split(' ')[0])} ✓</th>`).join('')}</tr></thead><tbody>
      ${people.map(p=>{

function buildCPDPerson(person){
  const yr=cpdYearFilter;
  const entries=cpdEntriesFor(person,yr).sort((a,b)=>a.date<b.date?1:-1);
  const hrs=cpdHoursFor(person,yr),sh=cpdStructuredFor(person,yr);
  // ARB lens: activities + mandatory topics (with RIBA equivalence) + reflections
  const reflDone=entries.filter(e=>((e.reflections||{})[person]||'').trim()).length;
  const arbRows=arbTopics().map(t=>({t,ok:entries.some(e=>entryCoversArb(e,t))}));
  // RIBA lens: 35h, 50% structured, core-topic spread (≥2h per topic)
  const topicHrs={};for(const t of CPD_RIBA)topicHrs[t]=0;
  for(const e of entries){const eh=parseFloat(e.durationHours)||0;for(const t of (e.riba||[]))topicHrs[t]+=eh;}
  const topicsMet=CPD_RIBA.filter(t=>topicHrs[t]>=2).length;
  const structPct=hrs>0?Math.round(sh/hrs*100):0;
  const tick=ok=>ok?'<span style="color:#5F7046;font-weight:700">✓</span>':'<span style="color:var(--danger);font-weight:700">✗</span>';
  let h=`<div class="card-row">
    <div class="card" style="flex:1;min-width:250px">
      <div class="card-title">${escAttr(person)} — ${yr}</div>
      <div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:10px">
        <div><div class="metric-label">Total</div><div class="metric-value" style="font-size:20px">${hrs.toFixed(1)}h</div></div>
        <div><div class="metric-label">Structured</div><div class="metric-value" style="font-size:20px">${sh.toFixed(1)}h</div></div>
        <div><div class="metric-label">Entries</div><div class="metric-value" style="font-size:20px">${entries.length}</div></div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">

        <div style="flex:1;min-width:160px;font-size:10px;line-height:1.8">${CPD_RIBA.filter(t=>topicHrs[t]>0).map((t,i)=>`<div><span style="display:inline-block;width:8px;height:8px;background:${cpdPieColor(CPD_RIBA.indexOf(t))};margin-right:5px"></span>${escAttr(t)} — <b>${topicHrs[t].toFixed(1)}h</b></div>`).join('')||'<span style="color:var(--grey);font-style:italic">Nothing recorded yet this year.</span>'}</div>
      </div>
    </div>
    <div class="card" style="flex:1;min-width:230px">
      <div class="card-title">ARB scheme view</div>
      <div style="font-size:11px;line-height:2">
        <div>Activities recorded: <b>${entries.length}</b> <span style="color:var(--dkgrey)">(ARB suggests ~8/yr)</span></div>
        ${arbRows.map(r=>`<div>${escAttr(r.t)}: ${tick(r.ok)}</div>`).join('')}
        <div>Personal reflections: <b>${reflDone}/${entries.length}</b> ${tick(entries.length>0&&reflDone===entries.length)}</div>
      </div>
      <div style="font-size:10px;color:var(--dkgrey);margin-top:8px;line-height:1.5">ARB is activity- and outcome-based — no hours target. Mandatory topics credit automatically from the equivalent RIBA topics.</div>
    </div>
    <div class="card" style="flex:1;min-width:230px">
      <div class="card-title">RIBA scheme view</div>
      <div style="font-size:11px;line-height:2">
        <div>Hours: <b>${hrs.toFixed(1)} / 35</b> ${tick(hrs>=35)}</div>
        <div>Structured: <b>${structPct}%</b> <span style="color:var(--dkgrey)">(target 50%)</span> ${tick(structPct>=50)}</div>
        <div>Core topics with ≥2h: <b>${topicsMet} / 10</b> ${tick(topicsMet===10)}</div>
      </div>
      <div style="font-size:10px;color:var(--dkgrey);margin-top:8px;line-height:1.5">Shown for everyone — use it if you follow RIBA's 35-hour scheme; ignore it if you record to ARB only.</div>
    </div>

  <div class="card"><div class="tbl-freeze"><table class="rtable"><thead><tr><th>Date</th><th>Title</th><th>Format</th><th style="text-align:right">Hours</th><th>RIBA criteria</th><th>ARB criteria</th></tr></thead><tbody>`;
  if(!entries.length)h+=`<tr><td colspan="7" style="color:var(--grey);font-style:italic">No CPD recorded for ${escAttr(person)} in ${yr}.</td></tr>`;
  for(const e of entries){
    h+=`<tr class="proj-click" onclick="cpdOpenEdit('${jsq(e.id)}')" title="Click to open"><td style="white-space:nowrap">${fmt(parseISO(e.date))}<div style="font-size:9px;color:var(--dkgrey)">${escAttr(e.ref||'')}</div></td>

const CPD_PIE_COLORS=['#26221E','#D44A2E','#576981','#A2761F','#5F7046','#806A94','#8A847B','#8A9BB1','#B06A5E','#4E7370'];
function cpdPieColor(i){return CPD_PIE_COLORS[i%CPD_PIE_COLORS.length];}
function drawTopicPie(canvasId,entriesList,weightByAttendees){
  const cv=document.getElementById(canvasId);if(!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
  const topicHrs={};for(const t of CPD_RIBA)topicHrs[t]=0;
  for(const e of entriesList){const hrs=(parseFloat(e.durationHours)||0)*(weightByAttendees?e.attendees.length:1);for(const t of (e.riba||[]))topicHrs[t]+=hrs;}
  const covered=CPD_RIBA.filter(t=>topicHrs[t]>0);
  const total=covered.reduce((s,t)=>s+topicHrs[t],0);
  if(!total)return;
  const cx=cv.width/2,cy=cv.height/2,r=Math.min(cx,cy)-4;
  let a=-Math.PI/2;
  covered.forEach(t=>{
    const frac=topicHrs[t]/total;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+frac*2*Math.PI);ctx.closePath();
    ctx.fillStyle=cpdPieColor(CPD_RIBA.indexOf(t));ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    a+=frac*2*Math.PI;
  });
}
function drawCpdPie(){
  const yr=cpdYearFilter;
  if(cpdView==='overview'){
    drawTopicPie('cpdPie',st.cpd.filter(x=>parseISO(x.date).getFullYear()===yr),true);
  } else {
    const me=cur().name;
    const person=canManage()?(cpdPersonFilter==='me'?me:cpdPersonFilter):me;
    drawTopicPie('cpdPiePerson',cpdEntriesFor(person,yr),false);
  }
}

window.doSaveCPD=function(){
  const me=cur().name;
  const isNew=cpdEditing==='new';
  let e=isNew?null:st.cpd.find(x=>x.id===cpdEditing);
  const canEditEntry=isNew||isAdmin()||isPM()||(e&&e.createdBy===me);
  const val=id=>{const el=document.getElementById(id);return el?el.value:null;};
  if(canEditEntry){
    const date=val('cpd-date'),title=(val('cpd-title')||'').trim();
    const hours=parseFloat(val('cpd-hours'));
    if(!date||!title){undoToast('A CPD entry needs at least a date and a title.');return;}
    if(isNaN(hours)||hours<=0){undoToast('Enter the duration in hours (e.g. 1.5).');return;}
    const riba=[...document.querySelectorAll('.cpd-riba:checked')].map(x=>x.value);
    const arb=[...document.querySelectorAll('.cpd-arb:checked')].map(x=>x.value);
    const pdbr=[...document.querySelectorAll('.cpd-pdbr:checked')].map(x=>x.value);
    const atts=[...document.querySelectorAll('.cpd-att:checked')].map(x=>x.value);
    if(!atts.length){undoToast('Tick at least one attendee.');return;}
    const speakers=[...document.querySelectorAll('#cpd-speakers .phase-tag')].map(t=>t.dataset.name).filter(Boolean);
    const base={date,title,provider:val('cpd-provider')||'',speakers,durationHours:hours,riba,arb,pdbr,attendees:atts,notes:val('cpd-notes')||'',applying:val('cpd-applying')||'',nextSteps:val('cpd-nextsteps')||'',activityType:val('cpd-type')||'Course / seminar',format:val('cpd-format')||'Structured',evidence:val('cpd-evidence')||''};
    if(isNew){
      e={id:'cpd'+Date.now()+Math.floor(Math.random()*1000),...base,reflections:{},createdBy:me,timeWrites:[]};
      st.cpd.push(e);ensureCpdRefs();
    } else {
      Object.assign(e,base);
      for(const k of Object.keys(e.reflections||{}))if(!atts.includes(k))delete e.reflections[k];
    }
    applyCpdTime(e);
  }
  const refEl=document.getElementById('cpd-reflection');
  if(refEl&&e){if(!e.reflections)e.reflections={};if(refEl.value.trim())e.reflections[me]=refEl.value.trim();else delete e.reflections[me];}
  cpdEditing=null;save();render();
}

window.doDeleteCPDConfirmed=function(id){
  const i=st.cpd.findIndex(x=>x.id===id);if(i<0)return;

  for(const w of (e.timeWrites||[])){const{wk,dayIdx}=dateToWkDay(parseISO(w.date));sNB(wk,'CPD and training',w.person,dayIdx,Math.max(0,(gNB(wk,'CPD and training',w.person,dayIdx)||0)-w.hours));}

}
window.doExportCPD=function(person,year){
  const q=(x)=>String(x==null?'':x).replace(/"/g,'""').replace(/[\r\n]+/g,' ');
  let csv='Reference,Date,Title,Provider,Speakers,Activity type,Format,Hours,RIBA core curriculum,ARB mandatory topics,Principal Designer (Building Regs) competences,What was learned,How it is being applied,Next steps,Evidence,Personal reflection\n';
  const rows=cpdEntriesFor(person,year).sort((a,b)=>a.date<b.date?-1:1);

  for(const e of rows){

let restoreFileData=null;
window.restoreFileChanged=function(input){
  const f=input.files&&input.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const s=data.state||data; // accept raw state too
      if(!s||!Array.isArray(s.users)||typeof s.entries!=='object')throw new Error('not a recognisable backup');
      restoreFileData={name:f.name,exportedAt:data.exportedAt||'unknown date',state:s};
      render();
    }catch(err){undoToast('That does not look like a backup file: '+err.message);restoreFileData=null;render();}
  };

}
window.doRestoreJSON=function(){

    `Replace EVERYTHING in this app with the backup “${escAttr(restoreFileData.name)}” (exported ${escAttr(String(restoreFileData.exportedAt).slice(0,10))})? All current data — timesheets, projects, clients, CPD, settings — is overwritten. This cannot be undone.`,
