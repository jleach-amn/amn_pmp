// Dedupe-as-you-type on the person field: matching existing contacts drop down;
// picking one opens their card instead of creating a near-duplicate.
window.crmAddNameTypeahead=function(inp){
  let el=document.getElementById('crm-add-name-suggest');
  if(!el){el=document.createElement('div');el.id='crm-add-name-suggest';el.className='cr-dropdown';el.style.position='fixed';el.style.zIndex=600;document.body.appendChild(el);}
  const q=inp.value.trim().toLowerCase();
  if(q.length<2){el.style.display='none';return;}
  const hits=st.crmContacts.filter(c=>c.name.toLowerCase().includes(q)).slice(0,6);
  if(!hits.length){el.style.display='none';return;}
  el.innerHTML=`<div style="padding:6px 12px;font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--dkgrey);font-weight:600;border-bottom:1px solid var(--mid)">Already in the CRM — click to open</div>`+hits.map(c=>`<div style="padding:8px 12px;cursor:pointer;font-size:12px" onmousedown="event.preventDefault();crmCloseModals();crmContactModal='${jsq(c.id)}';render()"><b>${escAttr(c.name)}</b>${c.orgId?` — ${escAttr(crmOrgName(c.orgId))}`:''}</div>`).join('');
  const r=inp.getBoundingClientRect();
  el.style.left=r.left+'px';el.style.top=(r.bottom+3)+'px';el.style.minWidth=r.width+'px';el.style.display='block';
}
document.addEventListener('click',e=>{const el=document.getElementById('crm-add-name-suggest');if(el&&el.style.display!=='none'&&!e.target.closest('#crm-add-name-suggest')&&!e.target.closest('#crm-add-name'))el.style.display='none';},true);
window.crmSaveAdd=function(){
  const me=cur().name;
  const val=id=>{const el=document.getElementById(id);return el?el.value:'';};
  const person=(val('crm-add-name')||'').trim();
  const orgName=(val('crm-add-org')||'').trim();
  if(!person&&!orgName){undoToast('Enter a person, a company, or both.');return;}
  const sectors=[...document.querySelectorAll('.crm-add-sec:checked')].map(x=>x.value);
  const rating=val('crm-add-rating')||'warm';
  const org=orgName?crmFindOrCreateOrgByName(orgName,{sectors,rating}):null;
  if(org){for(const s of sectors)if(!org.sectors.includes(s))org.sectors.push(s);
    const web=(val('crm-add-web')||'').trim();if(web&&!org.website)org.website=web;} // set only if the org has none, so we never clobber an existing website
  if(person){
    if(st.crmContacts.some(c=>c.name.trim().toLowerCase()===person.toLowerCase()&&c.orgId===(org?org.id:null))){undoToast('That person is already in the CRM at that company.');return;}
    const evId=val('crm-add-event');
    const ev=evId?crmEventById(evId):null;
    const c={id:crmId('ct'),name:person,orgId:org?org.id:null,role:val('crm-add-role').trim(),type:val('crm-add-type').trim(),typeNote:'',email:val('crm-add-email').trim(),phone:val('crm-add-phone').trim(),mobile:val('crm-add-mobile').trim(),linkedin:val('crm-add-linkedin').trim(),sectors,owner:val('crm-add-owner'),rating,source:ev?ev.name:'',links:[],createdBy:me,createdAt:crmTodayISO()};
    st.crmContacts.push(c);
    if(ev&&!ev.attendees.some(a=>a.contactId===c.id))ev.attendees.push({contactId:c.id,met:false,note:''});
    const noteTxt=(val('crm-add-note')||'').trim();
    if(noteTxt)st.crmInteractions.push({id:crmId('ci'),date:val('crm-add-note-date')||crmTodayISO(),by:me,note:noteTxt,contactIds:[c.id],orgIds:[]});
    const actTxt=(val('crm-add-act')||'').trim();
    if(actTxt)st.crmActions.push({id:crmId('ca'),text:actTxt,owner:crmMentionOwner(actTxt)||me,due:val('crm-add-act-due')||null,done:false,doneAt:null,doneBy:null,createdBy:me,createdAt:crmTodayISO(),contactId:c.id,orgId:null});
    crmCloseModals(); // straight back to the list — no second window (Joe, 13 Aug); the toast confirms what landed
    undoToast(`Added ${c.name}${org?' — '+org.name:''} to the CRM${noteTxt?' · conversation logged':''}${actTxt?' · action added':''}`);
  }else{
    org.rating=rating;
    if(val('crm-add-type').trim())org.notes=(org.notes?org.notes+'\n':'')+val('crm-add-type').trim();
    crmCloseModals();
    undoToast('Added '+org.name+' to the CRM');
  }
  save();render();
}

function crmLogModalHTML(){
  const rows=crmRows().sort((a,b)=>a.name.localeCompare(b.name));
  const body=`
  <div style="margin-bottom:14px">${crmL('Who with?')}
    <select id="crm-log-who" class="crm-biginput" style="width:100%">
      <option value="">— pick a person or company —</option>
      ${rows.map(r=>`<option value="${r.kind}:${r.id}">${escAttr(r.name)}${r.org?` (${escAttr(r.org)})`:r.kind==='org'?' (company)':''}</option>`).join('')}
    </select>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:14px">
    <div>${crmL('When')}<input type="date" id="crm-log-date" value="${crmTodayISO()}"/></div>
    <div style="flex:1">${crmL('What was said / agreed')}<textarea id="crm-log-note" rows="3" class="crm-biginput" style="width:100%;box-sizing:border-box;font-family:'Figtree',sans-serif;resize:vertical" placeholder="e.g. Called re the Banstead site — he'll send details next week"></textarea></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <div style="flex:2;min-width:220px;position:relative"><input id="crm-log-act" placeholder="Type @ to assign — e.g. @joe send capability statement" style="width:100%;box-sizing:border-box" oninput="crmActTypeahead(this)"/></div>
      <div><label style="font-size:10px;color:var(--dkgrey);font-weight:600;display:block;margin-bottom:2px">Due by</label><input type="date" id="crm-log-due" style="width:135px"/></div>
    </div>
  </div>`;
  const footer=`<button class="btn btn-sm" onclick="crmModalClose()">Discard</button>
    <button class="btn btn-primary crm-addbtn" onclick="crmSaveLog()">Save and close</button>`;
  return crmModalShell('Log a conversation',body,footer,700);
}
window.crmSaveLog=function(){
  const me=cur().name;
  const who=document.getElementById('crm-log-who').value;
  const note=(document.getElementById('crm-log-note').value||'').trim();
  if(!who){undoToast('Pick who the conversation was with.');return;}
  if(!note){undoToast('Write what was said.');return;}
  const[kind,id]=who.split(':');
  const date=document.getElementById('crm-log-date').value||crmTodayISO();
  st.crmInteractions.push({id:crmId('ci'),date,by:me,note,contactIds:kind==='person'?[id]:[],orgIds:kind==='org'?[id]:[]});
  const at=(document.getElementById('crm-log-act').value||'').trim();
  if(at){
    st.crmActions.push({id:crmId('ca'),text:at,owner:crmMentionOwner(at)||me,due:document.getElementById('crm-log-due').value||null,done:false,doneAt:null,doneBy:null,createdBy:me,createdAt:crmTodayISO(),contactId:kind==='person'?id:null,orgId:kind==='org'?id:null});
  }
  crmCloseModals();
  save();render();
}

    h+=`<div style="display:flex;flex-direction:column;gap:0">`;
    inters.forEach((i,idx)=>{
      const canDel=isAdmin()||i.by===me;
      if(crmEditingInter===i.id){

        // conversations are shared practice knowledge, so anyone can correct
        // or add to an entry. The edit is stamped below the note.
        h+=`<div class="crm-tl-item${idx===0?' crm-tl-latest':''}" style="background:var(--off);border-radius:8px;padding:10px">

          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
            <button class="btn btn-sm" onclick="crmCancelEditInteraction()">Cancel</button>
            <button class="btn btn-primary btn-sm" onclick="crmSaveInteraction('${jsq(i.id)}')">Save</button>

      }else{
      h+=`<div class="crm-tl-item${idx===0?' crm-tl-latest':''}">
        <div style="display:flex;gap:10px;align-items:baseline;margin-bottom:2px">

// Commit the contact edit form into the record (and its company's website)
// WITHOUT closing — so inline actions (linking an event, logging a note) can
// preserve typed-but-unsaved field edits by harvesting first. Returns false if
// the form isn't currently rendered or the name is blank.
function crmHarvestContactForm(c){
  if(!c)return false;
  const el=id=>document.getElementById(id);
  if(!el('crm-c-name'))return false;                 // modal not rendered
  const val=id=>{const e=el(id);return e?e.value:'';};
  const name=(val('crm-c-name')||'').trim();if(!name)return false;
  const origOrgId=c.orgId;
  const orgName=(val('crm-c-org')||'').trim();
  const org=orgName?crmFindOrCreateOrgByName(orgName):null;
  const sectors=[...document.querySelectorAll('.crm-c-sec:checked')].map(x=>x.value);
  Object.assign(c,{name,orgId:org?org.id:null,role:val('crm-c-role').trim(),type:val('crm-c-type').trim(),email:val('crm-c-email').trim(),phone:val('crm-c-phone').trim(),mobile:val('crm-c-mobile').trim(),linkedin:val('crm-c-linkedin').trim(),owner:val('crm-c-owner')||c.owner,rating:val('crm-c-rating')||'warm',sectors});
  // Company website lives on the org. Write the typed value through, but never
  // clobber a DIFFERENT company's existing website if the user switched company.
  if(org){const webEl=el('crm-c-web');if(webEl&&(org.id===origOrgId||!org.website))org.website=(webEl.value||'').trim();}
  return true;
}

// Promote a CRM company to a billing client. This is the shared core behind
// BOTH the company card's "Make available to projects" button and the project
// forms' company picker (a company chosen from the "Not yet a client" group is
// promoted on save). Returns the client id; performs no save()/render() of its
// own — the caller owns those, because the project forms hold unsaved typing.
function crmEnsureClientForOrg(oid){
  const o=crmOrg(oid);if(!o)return null;
  // A clientId can dangle if the client was deleted underneath it — treat that
  // as unpromoted rather than handing back a dead id.
  if(o.clientId&&st.clients.some(c=>c.id===o.clientId))return o.clientId;
  const primary=st.crmContacts.find(c=>c.orgId===oid);
  const cl={id:'c-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),company:o.name,contact:primary?primary.name:'',email:primary?primary.email||'':'',phone:primary?(primary.phone||primary.mobile||''):''};
  st.clients.push(cl);o.clientId=cl.id;
  return cl.id;
}
window.crmMarkClient=function(oid){
  const o=crmOrg(oid);if(!o||!canManage())return;
  if(o.clientId&&st.clients.some(c=>c.id===o.clientId))return;
  crmEnsureClientForOrg(oid);

}
window.crmUnmarkClient=function(oid){
  const o=crmOrg(oid);if(!o||!canManage()||!o.clientId)return;
  if(st.projects.some(p=>p.clientId===o.clientId)){undoToast('This client has projects — reassign or delete those first.');return;}
  st.clients=st.clients.filter(c=>c.id!==o.clientId);
  o.clientId=null;
  save();render();
}

// Write/adjust the event's Marketing and BD time: withdraw previous writes, then
// re-write for current staff × open days. Evening events go to the overtime row
// (day index +7). Submitted weeks are skipped and reported on the event card.
function applyEventTime(e){
  const TYPE='Marketing and BD';
  for(const w of(e.timeWrites||[])){
    const{wk,dayIdx}=dateToWkDay(parseISO(w.date));
    const di=w.ot?dayIdx+7:dayIdx;
    sNB(wk,TYPE,w.person,di,Math.max(0,(gNB(wk,TYPE,w.person,di)||0)-w.hours));
  }
  e.timeWrites=[];e.timeSkipped=[];
  const hrs=parseFloat(e.hoursPerDay)||0;
  if(hrs<=0||!e.staff.length||!e.start)return;
  const start=parseISO(e.start),end=e.end?parseISO(e.end):start;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    if(isClosedDate(d))continue;
    const date=isoDate(d);
    const{wk,dayIdx}=dateToWkDay(d);
    for(const person of e.staff){
      if(isSub(person,wk)){if(!e.timeSkipped.some(s=>s.person===person&&s.wk===wk))e.timeSkipped.push({person,wk});continue;}
      addNBActive(wk,person,TYPE);
      const di=e.evening?dayIdx+7:dayIdx;
      if(e.evening)setNBOT(wk,TYPE,person,true);
      sNB(wk,TYPE,person,di,(gNB(wk,TYPE,person,di)||0)+hrs);
      e.timeWrites.push({person,date,hours:hrs,ot:!!e.evening});
    }
  }
}

// Shared core: name → find-or-create contact (source = event) + attendee row;
// company only → target list. `met` differs by context: desktop list-building
// adds unmet; the phone's at-the-event quick add pre-ticks met.
function crmEvtAddPersonCore(e,name,orgName,type,met){
  if(!name&&!orgName){undoToast('Enter a name or a company.');return false;}
  if(!name){
    const o=crmFindOrCreateOrgByName(orgName,{rating:'cold'});
    if(!e.targetOrgIds.includes(o.id))e.targetOrgIds.push(o.id);
    save();return true;
  }
  const org=orgName?crmFindOrCreateOrgByName(orgName):null;
  let c=st.crmContacts.find(x=>x.name.trim().toLowerCase()===name.toLowerCase()&&(!org||x.orgId===org.id));
  if(!c){
    c={id:crmId('ct'),name,orgId:org?org.id:null,role:'',type:type||'',typeNote:'',email:'',phone:'',mobile:'',sectors:org?org.sectors.slice():[],owner:cur().name,rating:'warm',source:e.name,links:[],createdBy:cur().name,createdAt:crmTodayISO()};
    st.crmContacts.push(c);
  }
  const a=e.attendees.find(x=>x.contactId===c.id);
  if(!a)e.attendees.push({contactId:c.id,met:!!met,note:''});
  else if(met&&!a.met)a.met=true; // already listed, now met in person
  save();return true;
}

window.crmTriggerDeleteContact=function(id){
  const c=crmContact(id);if(!c||!canManage())return;
  const n=crmContactInters(id).filter(i=>i.contactIds.length===1&&!i.orgIds.length).length;
  openConfirmModal('Delete contact',`Delete "${escAttr(c.name)}"? Their conversation history (${n} note${n===1?'':'s'}), actions, links and event appearances go with them to Deleted Items, and can be restored from there.`,'delete','crmDeleteContactConfirmed',[id]);
}
window.crmDeleteContactConfirmed=function(id){
  const idx=st.crmContacts.findIndex(c=>c.id===id);if(idx<0)return;
  const c=st.crmContacts[idx];
  const payload={contact:c,interactions:[],interRefs:[],actions:[],eventRefs:[],linkRefs:[]};
  st.crmInteractions=st.crmInteractions.filter(i=>{
    if(!i.contactIds.includes(id))return true;
    if(i.contactIds.length===1&&!i.orgIds.length){payload.interactions.push(i);return false;}
    i.contactIds=i.contactIds.filter(x=>x!==id);payload.interRefs.push(i.id);return true;
  });
  st.crmActions=st.crmActions.filter(a=>{if(a.contactId===id){payload.actions.push(a);return false;}return true;});
  st.crmEvents.forEach(e=>{const a=e.attendees.find(x=>x.contactId===id);if(a){payload.eventRefs.push({eventId:e.id,att:a});e.attendees=e.attendees.filter(x=>x.contactId!==id);}});
  st.crmContacts.forEach(o=>{const li=o.links.findIndex(x=>x.id===id);if(li>=0){payload.linkRefs.push({contactId:o.id,link:o.links[li]});o.links.splice(li,1);}});
  st.crmContacts.splice(idx,1);
  crmCloseModals();
  pushTrash('crmContact',c.name,payload);
  render();
}
function restoreCrmContact(entry){
  const p=entry.payload;
  if(st.crmContacts.some(c=>c.id===p.contact.id))return false;
  st.crmContacts.push(p.contact);
  for(const i of p.interactions)if(!st.crmInteractions.some(x=>x.id===i.id))st.crmInteractions.push(i);
  for(const iid of p.interRefs){const i=st.crmInteractions.find(x=>x.id===iid);if(i&&!i.contactIds.includes(p.contact.id))i.contactIds.push(p.contact.id);}
  for(const a of p.actions)if(!st.crmActions.some(x=>x.id===a.id))st.crmActions.push(a);
  for(const r of p.eventRefs){const e=crmEventById(r.eventId);if(e&&!e.attendees.some(x=>x.contactId===p.contact.id))e.attendees.push(r.att);}
  for(const r of(p.linkRefs||[])){const o=crmContact(r.contactId);if(o&&!o.links.some(x=>x.id===p.contact.id))o.links.push(r.link);}
  // v1 payloads may carry leadRefs; leads are dormant now — ignore safely.
  return true;
}

window.crmDeleteOrgConfirmed=function(id){

  const o=st.crmOrgs[idx];
  const payload={org:o,interactions:[],interRefs:[],actions:[],eventRefs:[],client:null};

  st.crmEvents.forEach(e=>{if(e.targetOrgIds.includes(id)){payload.eventRefs.push(e.id);e.targetOrgIds=e.targetOrgIds.filter(x=>x!==id);}});

function restoreCrmOrg(entry){

  for(const i of p.interactions)if(!st.crmInteractions.some(x=>x.id===i.id))st.crmInteractions.push(i);
  for(const iid of p.interRefs){const i=st.crmInteractions.find(x=>x.id===iid);if(i&&!i.orgIds.includes(p.org.id))i.orgIds.push(p.org.id);}
  for(const a of p.actions)if(!st.crmActions.some(x=>x.id===a.id))st.crmActions.push(a);
  for(const eid of p.eventRefs){const e=crmEventById(eid);if(e&&!e.targetOrgIds.includes(p.org.id))e.targetOrgIds.push(p.org.id);}
  return true;
}

  for(const i of[...st.crmInteractions].sort((a,b)=>a.date<b.date?-1:1)){

    rows.push(['Conversation',i.date,names,orgs,'','','',i.by||'','','',i.note,''].map(crmCsv).join(','));
  }
  for(const a of st.crmActions){

    rows.push(['Action',a.createdAt||'',a.contactId?(crmContact(a.contactId)||{}).name||'':'',a.orgId?crmOrgName(a.orgId):(a.contactId?crmOrgName((crmContact(a.contactId)||{}).orgId):''),'','','',a.owner||'',a.done?'Done'+(a.doneAt?' '+a.doneAt:''):'Open',a.due||'',a.text,ctx?ctx.label:''].map(crmCsv).join(','));
  }

    rows.push(['Event',e.start||'','','','','','',(e.staff||[]).join('; '),e.evening?'Evening / overtime':'','',e.name,[e.link,e.notes].filter(Boolean).join(' · ')].map(crmCsv).join(','));
    for(const at of e.attendees){const c=crmContact(at.contactId);if(!c)continue;
      rows.push(['Event attendee',e.start||'',c.name,crmOrgName(c.orgId),'','','','',at.met?'Met':'Not met','',at.note||'',e.name].map(crmCsv).join(','));}
    for(const oid of e.targetOrgIds){rows.push(['Event target company',e.start||'','',crmOrgName(oid),'','','','','','','',e.name].map(crmCsv).join(','));}
  }
  const el=document.createElement('a');el.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));el.download='amn-crm-all.csv';el.click();
}
// Which events wrote time for this person in a date range — for the forecast popover.
function eventWritesInRange(person,sISO,eISO){
  const out=[];
  for(const e of st.crmEvents)for(const w of(e.timeWrites||[]))if(w.person===person&&w.date>=sISO&&w.date<=eISO&&!out.some(x=>x.e===e))out.push({e,hours:w.hours,ot:w.ot});
  return out.sort((a,b)=>(a.e.start||'')<(b.e.start||'')?-1:1);
}

function mobEditable(wk,me){const sub=isSub(me,wk);return mobWkOff<=0&&(!sub||editingSubmitted.has(`${me}||${wk}`));}
function buildMobTime(){

  const sub=isSub(me,wk),canS=canSubmit(wk),od=canS&&isOverdue(wk)&&!sub,isFut=mobWkOff>0;

  for(const t of getLeaveActive(wk,me)){

  if(editable)h+=`<button class="mob-btn sec" onclick="mobSheetOpen('addproj')">+ Add project to this week</button>`;

    h+=`<div class="mob-list-item" style="border-left-color:${MOB_RATE_EDGE[crmOrgRating(o)]||'#C9C3BA'};border-left-style:dashed" onclick="mobCrmOpen('${jsq(o.id)}')"><div class="ml-main"><div class="ml-t">${escAttr(o.name)}</div><div class="ml-s">Company — nobody here yet</div>${t?`<div class="ml-s" style="color:var(--grey)">${fmt(parseISO(t.date))} — ${escAttr(t.note.slice(0,70))}${t.note.length>70?'…':''}</div>`:''}</div><span style="color:var(--grey)">›</span></div>`;

  const od=canManage()?crmMyOpenActions(me).filter(crmActionOverdue):[];
  if(od.length)rows+=note('warn',`<b>${od.length} overdue CRM action${od.length===1?'':'s'}</b> — listed below.`,'');
  const pend=pendingLeaveOverlapsWeek(me,nowWk());
  if(pend)rows+=note('info',`A pending leave request overlaps this week — it needs deciding before the week can be submitted.`,`<button class="mob-nbtn sec" onclick="mobNav('leave')">See leave</button>`);
  if(!rows)rows=`<div class="mob-mut">Nothing needs your attention.</div>`;
  return`<div class="mob-card"><div class="mc-title">Needs attention</div>${rows}</div>`;
}
window.mobActGo=function(id){if(!canManage())return;mobTab='crm';mobCrmView=id;mobSheet=null;render();}
function mobActionsCard(){
  if(!canManage())return'';
  const me=cur().name;
  const acts=crmMyOpenActions(me).sort((a,b)=>{const ao=crmActionOverdue(a),bo=crmActionOverdue(b);if(ao!==bo)return ao?-1:1;return(a.due||'9999-12-31').localeCompare(b.due||'9999-12-31');});
  if(!acts.length)return'';
  return`<div class="mob-card"><div class="mc-title">My CRM actions (${acts.length})</div>${acts.map(a=>{
    const c=a.contactId?st.crmContacts.find(x=>x.id===a.contactId):null;
    const o=a.orgId?st.crmOrgs.find(x=>x.id===a.orgId):(c&&c.orgId?st.crmOrgs.find(x=>x.id===c.orgId):null);
    const who=c?escAttr(c.name)+(o?' · '+escAttr(o.name):''):(o?escAttr(o.name):'');
    const od=crmActionOverdue(a);
    return`<div class="mob-act"><input type="checkbox" onchange="crmToggleAction('${jsq(a.id)}')" title="Mark done"/><div style="flex:1;min-width:0">
      <div>${crmFmtNote(a.text)}</div>
      ${who?`<div class="ma-who"${c?` onclick="mobActGo('${jsq(c.id)}')"`:''}>${who}${c?' ›':''}</div>`:''}
      ${a.due?`<div style="font-size:10px;font-weight:700;color:${od?'var(--danger)':'var(--grey)'}">${od?'overdue — was ':'due '}${fmt(parseISO(a.due))}</div>`:''}
    </div></div>`;}).join('')}</div>`;
}
function buildMobHome(){
  const me=cur().name,wk=nowWk(),year=new Date().getFullYear();
  const wkTotal=[0,1,2,3,4,5,6].reduce((t,i)=>t+dayTotalHrs(wk,me,i),0);
  let h=mobNotices();
  h+=`<div class="mob-card"><div class="mc-title">This week</div><div style="font-size:13px"><b>${mobH(wkTotal)}h logged</b> · ${isSub(me,wk)?'submitted':'not submitted yet'}</div><button class="mob-btn sec" onclick="mobNav('time')">Open my timesheet</button></div>`;
  h+=mobActionsCard();
  h+=mobTeamCal();
  h+=`<div class="mob-card"><div class="mc-title">Leave</div><div style="font-size:13px"><b>${leaveRemaining(me,year)-pendingDays(me,year)} days</b> remaining this year</div></div>`;
  h+=`<div class="mob-card" style="font-size:11px;color:var(--grey)">This is the phone companion — timesheets, leave and CRM basics. Forecasting, projects, reports and everything else live on the desktop portal.<div style="margin-top:6px">v${APP_BUILD} · ${APP_VERSION_LABEL}</div></div>`;
  h+=`<button class="mob-btn sec" onclick="doLogout()">Sign out</button>`;
  return h;
}

// ── Bottom sheets ────────────────────────────────────────────────────────────
function buildMobSheet(){
  const k=mobSheet.kind;let inner='';
  if(k==='addproj'){
    const me=cur().name;
    const addable=st.projects.filter(p=>!p.archived&&canLogToProject(me,p.name));
    if(!mobSheet.id){
      inner=`<h3>Add a project</h3>${addable.map(p=>`<div class="mob-list-item" onclick="mobSheetOpen('addproj','${jsq(p.name)}')"><div class="ml-main"><div class="ml-t">${p.code?`[${escAttr(p.code)}] `:''}${escAttr(p.name)}</div><div class="ml-s">${escAttr(p.clientName||'')}</div></div><span style="color:var(--grey)">›</span></div>`).join('')||'<div style="font-size:12px;color:var(--grey)">No projects available — ask an admin to add you to a project team.</div>'}`;
    }else{
      const p=st.projects.find(x=>x.name===mobSheet.id);
      const stages=((p&&p.phases)||[]).filter(ph=>ph.active!==false);
      inner=`<h3>${escAttr(mobSheet.id)} — pick a stage</h3>${stages.map(ph=>`<div class="mob-list-item" onclick="mobAddRow('${jsq(mobSheet.id)}','${jsq(ph.name)}')"><div class="ml-main"><div class="ml-t">${escAttr(ph.name)}</div></div></div>`).join('')||'<div style="font-size:12px;color:var(--grey)">This project has no active stages.</div>'}`;
    }
  }else if(k==='logconv'){
    inner=`<h3>Log a conversation</h3>
    <div class="mob-field"><label>Date</label><input id="mob-ci-date" type="date" value="${crmTodayISO()}"/></div>
    <div class="mob-field"><label>What was said</label><textarea id="mob-ci-note" rows="4" placeholder="Coffee with…"></textarea></div>
    <div class="mob-field"><label>Follow-up action (optional)</label><input id="mob-ci-act" placeholder="e.g. send capability statement"/></div>
    <button class="mob-btn" onclick="mobCrmLog()">Save</button>`;
  }else if(k==='editconv'){
    const i=st.crmInteractions.find(x=>x.id===mobSheet.id);
    if(!i)inner=`<h3>Edit note</h3><div class="mob-mut">That note is no longer there.</div>`;
    else inner=`<h3>Edit note</h3>
    <div class="mob-mut" style="margin:-6px 0 12px">logged by ${escAttr(i.by)} — anyone can edit or add to it</div>
    <div class="mob-field"><label>Date</label><input id="mob-ce-date" type="date" value="${i.date}"/></div>
    <div class="mob-field"><label>What was said</label><textarea id="mob-ce-note" rows="5">${escAttr(i.note)}</textarea></div>
    <button class="mob-btn" onclick="mobCrmSaveConv()">Save</button>`;
  }else if(k==='editcontact'){
    const c=st.crmContacts.find(x=>x.id===mobSheet.id);
    if(!c)inner=`<h3>Edit contact</h3><div class="mob-mut">That contact is no longer there.</div>`;
    else inner=`<h3>Edit contact</h3>
    <div class="mob-field"><label>Name</label><input id="mob-ec-name" value="${escAttr(c.name)}"/></div>
    <div class="mob-field"><label>Company</label><input id="mob-ec-org" list="mob-orgs2" value="${escAttr(c.orgId?crmOrgName(c.orgId):'')}" placeholder="matches existing as you type"/><datalist id="mob-orgs2">${st.crmOrgs.map(o=>`<option value="${escAttr(o.name)}">`).join('')}</datalist></div>
    <div class="mob-field"><label>Role</label><select id="mob-ec-type"><option value="">—</option>${crmRoles().map(r=>`<option${c.type===r?' selected':''}>${escAttr(r)}</option>`).join('')}</select></div>
    <div class="mob-field"><label>Job title</label><input id="mob-ec-role" value="${escAttr(c.role||'')}"/></div>
    <div class="mob-field"><label>Email</label><input id="mob-ec-email" type="email" value="${escAttr(c.email||'')}"/></div>
    <div class="mob-field"><label>Phone</label><input id="mob-ec-phone" type="tel" value="${escAttr(c.phone||'')}"/></div>
    <div class="mob-field"><label>Mobile</label><input id="mob-ec-mobile" type="tel" value="${escAttr(c.mobile||'')}"/></div>
    <div class="mob-field"><label>LinkedIn</label><input id="mob-ec-li" value="${escAttr(c.linkedin||'')}" placeholder="profile URL"/></div>
    <button class="mob-btn" onclick="mobCrmSaveContact()">Save</button>`;
  }else if(k==='newevent'){
    inner=`<h3>New event</h3>
    <div class="mob-field"><label>Name</label><input id="mob-ne-name" placeholder="e.g. Futurebuild London"/></div>
    <div class="mob-field"><label>First day</label><input id="mob-ne-start" type="date"/></div>
    <div class="mob-field"><label>Last day (blank = one day)</label><input id="mob-ne-end" type="date"/></div>
    <div class="mob-field"><label>Hours per day</label><div style="display:flex;gap:8px;align-items:center"><input id="mob-ne-hours" type="number" step="0.5" min="0" value="7.5" style="flex:1"/><button class="mob-chip mut" style="border:none;cursor:pointer;font-family:inherit" onclick="document.getElementById('mob-ne-hours').value='7.5'">All day</button></div></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 10px"><input id="mob-ne-evening" type="checkbox"/> Evening event — logs as overtime</label>
    <div class="mob-field"><label>Weblink (optional)</label><input id="mob-ne-link" placeholder="https://…"/></div>
    <div class="mob-field"><label>Notes (optional)</label><textarea id="mob-ne-notes" rows="2"></textarea></div>
    <div class="mob-field"><label>Who's going from amn — writes Marketing and BD time to their timesheet & forecast</label>${st.users.filter(u=>!u.deactivated).map(u=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0"><input type="checkbox" class="mob-ne-staff" value="${escAttr(u.name)}"/> ${escAttr(u.name)}</label>`).join('')}</div>
    <button class="mob-btn" onclick="mobEvCreate()">Create event</button>`;
  }else if(k==='newcontact'){
    inner=`<h3>New contact</h3>
    <div class="mob-field"><label>Name</label><input id="mob-nc-name" placeholder="Jane Smith"/></div>
    <div class="mob-field"><label>Company</label><input id="mob-nc-org" list="mob-orgs" placeholder="matches existing as you type"/><datalist id="mob-orgs">${st.crmOrgs.map(o=>`<option value="${escAttr(o.name)}">`).join('')}</datalist></div>
    <div class="mob-field"><label>Role</label><select id="mob-nc-type"><option value="">—</option>${crmRoles().map(r=>`<option>${escAttr(r)}</option>`).join('')}</select></div>
    <div class="mob-field"><label>Job title</label><input id="mob-nc-role" placeholder="optional"/></div>
    <div class="mob-field"><label>Email</label><input id="mob-nc-email" type="email"/></div>
    <div class="mob-field"><label>Phone</label><input id="mob-nc-phone" type="tel"/></div>
    <div class="mob-field"><label>LinkedIn</label><input id="mob-nc-li" placeholder="profile URL"/></div>
    <div class="mob-field"><label>Rating</label><select id="mob-nc-rating"><option value="warm">Warm</option><option value="hot">Hot</option><option value="cold">Cold</option><option value="dormant">Dormant</option></select></div>
    <div class="mob-field"><label>First note (optional)</label><textarea id="mob-nc-note" rows="2" placeholder="How we met…"></textarea></div>
    <button class="mob-btn" onclick="mobCrmCreate()">Add contact</button>`;
  }else if(k==='reqleave'){
    inner=`<h3>Request leave</h3>
    <div class="mob-field"><label>Type</label><select id="mob-lv-type">${LEAVE_TYPES.filter(t=>t!=='Bank Holiday').map(t=>`<option>${escAttr(t)}</option>`).join('')}</select></div>
    <div class="mob-field"><label>First day</label><input id="mob-lv-start" type="date" oninput="mobLvHalves()" onchange="mobLvHalves()"/></div>
    <div class="mob-field"><label>Last day</label><input id="mob-lv-end" type="date" oninput="mobLvHalves()" onchange="mobLvHalves()"/></div>
    <div id="mob-lv-halves" style="margin-bottom:8px"></div>
    <div class="mob-field"><label>Note (optional)</label><input id="mob-lv-note"/></div>
    <button class="mob-btn" onclick="mobLvRequest()">Send request</button>`;
  }else if(k==='ms'){
    const m=st.milestones.find(x=>x.id===mobSheet.id);
    if(!m)inner=`<h3>Milestone</h3><div class="mob-mut">That milestone is no longer there.</div>`;
    else{
      const p=st.projects.find(x=>x.name===m.project);
      inner=`<h3>${escAttr(p&&p.code?`[${p.code}] `:'')}${escAttr(m.project)}</h3>
      <div class="mob-mut" style="margin:-6px 0 12px">${fmtLong(parseISO(m.date))}${m.stage?' · '+escAttr(m.stage):''}${m.person?' · '+escAttr(m.person):''}</div>
      <div style="font-size:14px;line-height:1.5;white-space:pre-wrap">${escAttr(m.text)}</div>`;
    }
  }else if(k==='ev'){
    const e=st.crmEvents.find(x=>x.id===mobSheet.id);
    if(!e)inner=`<h3>Event</h3><div class="mob-mut">That event is no longer there.</div>`;
    else{
      const going=(e.staff||[]);
      // CRM contacts are admin+PM only — members have no CRM page on the
      // desktop, so the phone must not show them attendee names either.
      const crmOK=canManage();
      inner=`<h3>${escAttr(e.name)}</h3>
      <div class="mob-mut" style="margin:-6px 0 12px">${e.start?fmtLong(parseISO(e.start)):'no date'}${e.end&&e.end!==e.start?' – '+fmtLong(parseISO(e.end)):''}</div>
      ${e.notes?`<div class="mob-sec"><div class="mc-title">Notes</div><div style="font-size:12.5px;line-height:1.45;white-space:pre-wrap">${escAttr(e.notes)}</div></div>`:''}
      <div class="mob-sec"><div class="mc-title">From amn</div>${going.length?going.map(n=>`<div class="ms-row">${escAttr(n)}</div>`).join(''):'<div class="mob-mut">Nobody logged yet.</div>'}</div>
      ${crmOK?`<div class="mob-sec"><div class="mc-title">People to meet — tick who you met</div>${(e.attendees||[]).map(a=>{const c=st.crmContacts.find(x=>x.id===a.contactId);if(!c)return'';
        return`<div class="ms-row" style="display:block;padding:7px 0"><label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" ${a.met?'checked':''} onchange="crmEvtMet('${jsq(e.id)}','${jsq(c.id)}',this.checked)"/><span><b>${escAttr(c.name)}</b>${c.orgId?` <span style="color:var(--grey);font-size:11px">· ${escAttr(crmOrgName(c.orgId))}</span>`:''}</span></label><input placeholder="note — what was said" value="${escAttr(a.note||'')}" onchange="crmEvtNote('${jsq(e.id)}','${jsq(c.id)}',this.value)" style="width:100%;box-sizing:border-box;margin-top:4px;font-size:12px"/></div>`;}).join('')||'<div class="mob-mut">Nobody listed yet.</div>'}
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><div style="font-size:10.5px;color:var(--grey);margin-bottom:4px">Met someone new? A name creates the contact (source: this event). A company alone joins the target list.</div><input id="mob-ev-newname" placeholder="Name" style="width:100%;box-sizing:border-box;margin-bottom:5px"/><input id="mob-ev-neworg" placeholder="Company" list="mob-ev-orgs" style="width:100%;box-sizing:border-box;margin-bottom:6px"/><datalist id="mob-ev-orgs">${st.crmOrgs.map(o=>`<option value="${escAttr(o.name)}">`).join('')}</datalist><button class="mob-btn" style="margin:0" onclick="mobEvQuickAdd('${jsq(e.id)}')">Add</button></div>

    }
  }else if(k==='calday'){
    const iso=mobSheet.id,d=parseISO(iso),me=cur().name;
    const ms=mobDayMs(iso),evs=mobDayEvents(iso),away=mobDayLeave(iso,null);
    inner=`<h3>${fmtLong(d)}</h3>`;
    if(UK_BH.has(iso))inner+=`<div class="mob-chip mut" style="margin:-6px 0 12px">Bank holiday</div>`;
    else if(isClosedDate(d))inner+=`<div class="mob-chip mut" style="margin:-6px 0 12px">Weekend</div>`;
    inner+=`<div class="mob-sec"><div class="mc-title">Milestones</div>${ms.length?ms.map(m=>{const p=st.projects.find(x=>x.name===m.project);return`<div class="ms-row"><b>${escAttr(p&&p.code?`[${p.code}] `:'')}${escAttr(m.project)}</b>${m.stage?` · ${escAttr(m.stage)}`:''}<div>${escAttr(m.text)}</div></div>`;}).join(''):'<div class="mob-mut">None.</div>'}</div>`;
    inner+=`<div class="mob-sec"><div class="mc-title">Events</div>${evs.length?evs.map(e=>`<div class="ms-row"><b>${escAttr(e.name)}</b>${(e.staff||[]).length?` · ${e.staff.map(n=>escAttr(n.split(' ')[0])).join(', ')}`:''}<div><button class="mob-nbtn sec" style="margin-top:4px" onclick="mobSheetOpen('ev','${jsq(e.id)}')">Open event</button></div></div>`).join(''):'<div class="mob-mut">None.</div>'}</div>`;
    inner+=`<div class="mob-sec"><div class="mc-title">Away</div>${away.length?away.map(r=>`<div class="ms-row">${escAttr(r.person)} — ${escAttr(mobLvType(r))}${(r.halfDays&&r.halfDays[iso])?' (half day)':''}${r.status==='pending'?' <span class="mob-chip warn">pending</span>':''}</div>`).join(''):'<div class="mob-mut">Everyone\u2019s in.</div>'}</div>`;
  }
  return `<div class="mob-sheet-back" onclick="mobSheetClose()"></div><div class="mob-sheet">${inner}</div>`;
}

init().catch(e=>{console.error("Init failed:",e);_appReady=true;render();});
