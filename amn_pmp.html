*{box-sizing:border-box;margin:0;padding:0}
:root{
  --proj:#D44A2E;--proj-dk:#B93E24;--leave:#806A94;--nb:#576981;
  --blk:#26221E;--wht:#ffffff;--off:#F7F5F1;--mid:#E8E3DA;--grey:#857F76;
  --dkgrey:#55504A;--ok:#5F7046;--warn:#9A6E1F;--danger:#A8262A;
  --ok-bg:#E9EEDF;--warn-bg:#FAF1DC;--danger-bg:#F8E2E0;
  --blue:#576981;--blue-lt:#E2E9EE;--blue-md:#8A9BB1;
  --accent:#D44A2E;--accent-dk:#B93E24;--accent-soft:#FDE2D5;--accent-faint:#FCEDDA;
  --code-bg:#D44A2E;--code-fg:#ffffff;
  --r-sm:6px;--r:8px;--r-lg:12px;--r-xl:16px;
}
body{font-family:'Figtree',sans-serif;font-size:13px;color:var(--blk);background:var(--off);line-height:1.55;min-height:100vh;font-weight:400}
.side-logo{width:150px;height:auto;border-radius:14px;display:block;margin:16px 11px 18px;cursor:pointer}
.hdr-title{font-family:'Figtree',sans-serif;font-weight:500;font-size:11px;letter-spacing:.16em;color:var(--grey);text-transform:lowercase}
.ubar{background:var(--wht);border-bottom:1px solid var(--mid);padding:9px 24px;display:flex;justify-content:space-between;align-items:center}
.sb-sync{font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.sb-sync.sb-ok{color:var(--grey)}
.sb-sync.sb-busy{color:var(--blue)}
.sb-sync.sb-err{color:var(--danger)}
.layout{display:flex;min-height:calc(100vh - 45px)}
.sidebar{width:172px;flex-shrink:0;background:var(--wht);border-right:1px solid var(--mid);padding:0 0 16px;display:flex;flex-direction:column}
.side-version{margin-top:auto;padding:14px 16px 4px;font-size:10px;color:var(--grey);letter-spacing:.04em}
/* Fluid width app-wide: every page takes the window it is given (Joe, 28 Jul
   — Harvest-like). Cards/tables are width:100% so they expand and collapse
   with the browser; .content min-width guards nothing below phone width. */
.content{flex:1;padding:30px 22px;overflow-x:auto;min-width:0}
.nav-item{display:block;width:calc(100% - 16px);margin:1px 8px;text-align:left;padding:9px 13px;font-family:'Figtree',sans-serif;font-size:13px;font-weight:500;color:var(--dkgrey);border:none;background:none;cursor:pointer;border-radius:var(--r)}
.nav-item:hover{color:var(--blk);background:var(--off)}
.nav-item.active{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.card{background:var(--wht);border:1px solid var(--mid);border-radius:var(--r-lg);box-shadow:0 1px 3px rgba(38,34,30,.04);padding:20px 22px;margin-bottom:14px}
.card-row{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;margin-bottom:14px}
.card-row>.card{margin-bottom:0}
/* Custom report filter form */
.cr-grid{display:grid;grid-template-columns:130px 340px;gap:12px 14px;align-items:start}
.cr-row{display:contents}
.cr-label{font-size:11.5px;color:var(--dkgrey);font-weight:600;padding-top:9px}
.cr-control{width:100%}
.cr-row select.cr-control,.cr-row input[type=date]{font-size:12px;width:100%}
.cr-multiselect{position:relative;width:100%}
.cr-multiselect-box{border:1px solid var(--mid);border-radius:var(--r);min-height:36px;padding:5px 9px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;cursor:pointer;background:var(--wht);width:100%;box-sizing:border-box}
.cr-multiselect-box:hover{border-color:var(--dkgrey)}
.cr-placeholder{color:var(--grey);font-size:12px}
.cr-multiselect-arrow{margin-left:auto;font-size:9px;color:var(--grey);padding-left:6px}
.cr-chip{background:var(--off);border:1px solid var(--mid);border-radius:999px;font-size:11px;padding:2px 9px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.cr-chip button{background:none;border:none;cursor:pointer;color:var(--grey);font-size:11px;font-weight:700;padding:0;line-height:1}
.cr-chip button:hover{color:var(--danger)}
.cr-dropdown{position:absolute;top:100%;left:0;min-width:100%;width:max-content;max-width:440px;background:#fff;border:1px solid var(--mid);border-radius:var(--r);box-shadow:0 6px 18px rgba(38,34,30,.12);max-height:220px;overflow-y:auto;z-index:50;margin-top:3px}
.cr-dropdown-item{padding:7px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.cr-dropdown-item:hover{background:var(--off)}
.cr-dropdown-item.selected{font-weight:600}
.cr-dropdown-empty{padding:10px;font-size:12px;color:var(--grey);white-space:nowrap}
.card-title{font-family:'Figtree',sans-serif;font-size:16px;font-weight:600;letter-spacing:.04em;margin-bottom:14px;color:var(--blk)}
.page-title{font-family:'Figtree',sans-serif;font-size:22px;font-weight:600;margin-bottom:20px;letter-spacing:.02em;color:var(--blk)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head .page-title{margin-bottom:0}
.page-head-actions{display:flex;align-items:center;gap:8px}
.btn-add{font-size:13px;font-weight:600;padding:9px 18px;border-radius:var(--r);background:var(--accent);border:1px solid var(--accent);color:var(--wht);cursor:pointer;font-family:'Figtree',sans-serif}
.btn-add:hover{background:var(--accent-dk);border-color:var(--accent-dk)}
.help-card{background:var(--accent-faint);border:1px solid var(--accent-soft);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:16px}
.help-card .card-title{margin-bottom:8px}
.ep-head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.ep-chev{font-size:11px;color:var(--dkgrey);flex:0 0 auto;width:12px}
.ep-sum{margin-left:auto;font-size:11px;color:var(--dkgrey);font-weight:500;text-align:right;letter-spacing:0;text-transform:none;font-family:'Figtree',sans-serif}
.inv-stat .lbl{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--dkgrey);font-weight:600;margin-bottom:2px}
.inv-stat .val{font-size:15px;font-weight:700;font-family:'Figtree',sans-serif;letter-spacing:-.01em}
.inv-stat .sub{font-size:10px;font-weight:600;margin-top:1px}
.filt-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--mid);border-radius:999px;background:var(--wht)}
.filt-group-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--grey);margin-right:2px}
.export-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:12px}
.export-bar .export-note{font-size:10px;color:var(--dkgrey);text-align:right;max-width:420px}
.btn{font-family:'Figtree',sans-serif;font-size:12.5px;font-weight:600;padding:8px 16px;cursor:pointer;border:1px solid var(--mid);border-radius:var(--r);background:var(--wht);color:var(--blk);transition:all .15s}
.btn:hover{border-color:var(--blk)}
.btn:disabled{opacity:.35;cursor:not-allowed}.btn:disabled:hover{border-color:var(--mid)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--wht)}.btn-primary:hover{background:var(--accent-dk);border-color:var(--accent-dk)}
.btn-danger{border-color:var(--danger-bg);color:var(--danger)}.btn-danger:hover{background:var(--danger);border-color:var(--danger);color:var(--wht)}
.btn-sm{font-size:11.5px;padding:6px 12px}
.badge{display:inline-block;font-size:10.5px;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:var(--mid);color:var(--dkgrey);font-family:'Figtree',sans-serif;font-weight:600}
.badge-ok{background:var(--ok-bg);color:var(--ok)}.badge-warn{background:var(--warn-bg);color:var(--warn)}.badge-info{background:var(--blue-lt);color:var(--blue)}.badge-accent{background:var(--accent-soft);color:var(--accent)}
.badge-submitted{background:var(--ok-bg);color:var(--ok)}.badge-pending{background:var(--warn-bg);color:var(--warn)}.badge-overdue{background:var(--danger-bg);color:var(--danger)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.metric{background:var(--wht);border:1px solid var(--mid);border-radius:var(--r-lg);box-shadow:0 1px 3px rgba(38,34,30,.04);padding:18px 16px}
.metric-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dkgrey);margin-bottom:6px;font-weight:500}
.metric-value{font-family:'Figtree',sans-serif;font-size:26px;font-weight:600;line-height:1;color:var(--blk)}
.metric-sub{font-size:10px;color:var(--grey);margin-top:5px;font-weight:500}
.rtable{width:100%;border-collapse:collapse;font-size:12px}
.rtable th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dkgrey);padding:9px 10px;border-bottom:1.5px solid var(--blk);font-weight:600;background:var(--off)}
.rtable td{padding:9px 10px;border-bottom:1px solid var(--mid);color:var(--blk)}
.rtable tr:last-child td{border-bottom:none}
.rtable tr:hover td{background:var(--off)}
.proj-stage-row td{background:var(--off);font-size:11.5px}
.sortable{cursor:pointer;user-select:none}.sortable:hover{color:var(--blk)}
.sort-arrow{display:inline-block;margin-left:3px;opacity:.5;font-size:9px}
.sort-arrow.active{opacity:1;color:var(--blue)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input:not([type]),select,textarea{border:1px solid var(--mid);padding:8px 11px;font-size:13px;font-family:'Figtree',sans-serif;background:var(--wht);color:var(--blk);width:100%;outline:none;border-radius:var(--r);font-weight:400;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,74,46,.10)}
textarea{line-height:1.6;resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:var(--grey);opacity:.85}input[type=checkbox]{width:auto;accent-color:var(--accent)}
.total-cell{font-weight:600;font-size:12px;color:var(--blk)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.row label,.field label{font-size:11.5px;color:var(--dkgrey);display:block;margin-bottom:4px;font-weight:600}
.field{margin-bottom:14px}
.empty{color:var(--dkgrey);font-size:13px;padding:2rem 0;text-align:center;letter-spacing:.03em;font-weight:400}
.notice{font-size:12px;color:var(--dkgrey);background:var(--blue-lt);border-left:3px solid var(--blue);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;margin-bottom:16px}
.wknav{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.wklabel{font-family:'Figtree',sans-serif;font-size:16px;font-weight:600;min-width:200px;text-align:center;color:var(--blk);letter-spacing:.01em}
.subbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--off);border:1px solid var(--mid);border-radius:var(--r-lg);margin-top:14px;gap:10px;flex-wrap:wrap}
.proj-click{cursor:pointer;transition:background-color .15s}.proj-click:hover{background:var(--off)}
.back-btn{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);cursor:pointer;margin-bottom:20px;background:none;border:none;padding:0;font-family:'Figtree',sans-serif;font-weight:600}
.back-btn:hover{color:var(--blk)}
.hbadge{display:inline-block;font-size:11px;letter-spacing:.02em;padding:5px 13px;border-radius:999px;font-family:'Figtree',sans-serif;font-weight:700}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dkgrey);font-weight:600}
.ldot{width:13px;height:13px;flex-shrink:0;border-radius:3px}
.phase-tag{display:inline-block;font-size:10.5px;padding:3px 10px;border-radius:999px;background:var(--blue-lt);color:var(--blue);margin:2px;font-weight:600}
.code-chip{display:inline-block;background:var(--code-bg);color:var(--code-fg);font-family:'Figtree',sans-serif;font-size:11px;font-weight:600;letter-spacing:.05em;padding:3px 8px;min-width:42px;text-align:center;border-radius:var(--r-sm)}
.proj-name{font-weight:600;color:var(--blk)}
.delta-pos{color:var(--ok);font-weight:600}
.delta-neg{color:var(--danger);font-weight:600}
.num{font-variant-numeric:tabular-nums;font-weight:500}
/* action dropdown */
.action-wrap{position:relative;display:inline-block}
.action-btn{font-size:14px;line-height:1;padding:5px 10px;cursor:pointer;border:1px solid var(--mid);border-radius:var(--r-sm);background:var(--wht);color:var(--blk);font-weight:600;letter-spacing:.05em}
.action-btn:hover{border-color:var(--blk);background:var(--off)}
.action-menu{position:absolute;top:100%;right:0;margin-top:4px;background:var(--wht);border:1px solid var(--mid);border-radius:var(--r);overflow:hidden;min-width:140px;z-index:50;box-shadow:0 6px 18px rgba(38,34,30,.14)}
.action-menu button{display:block;width:100%;text-align:left;padding:9px 13px;font-size:12px;font-family:'Figtree',sans-serif;font-weight:500;background:none;border:none;color:var(--blk);cursor:pointer}
.action-menu button:hover{background:var(--off)}
.action-menu button.danger{color:var(--danger)}
.action-menu button.danger:hover{background:var(--danger-bg)}
.action-menu button+button{border-top:1px solid var(--mid)}
/* Unified timesheet table */
.tsmaster{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.tsmaster th{text-align:center;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dkgrey);padding:9px 4px;border-bottom:2px solid var(--blk);font-weight:600;background:var(--off)}
.tsmaster th.left{text-align:left}
.tsmaster th.weekend{background:#EFEBE3;color:var(--blue-md)}
.tsmaster th.weekend.ot-on{background:var(--warn-bg);color:var(--warn)}
.tsmaster td{padding:4px 5px;border-bottom:1px solid var(--mid);vertical-align:middle;color:var(--blk)}
.tsmaster td.weekend{background:rgba(87,105,129,.04)}
.tsmaster td.weekend.disabled{background:var(--off);opacity:.45}
/* Section headers — coloured blocks */
.tsmaster tr.section-header td{border-top:none;border-bottom:1px solid rgba(255,255,255,.2);padding:9px 14px}
.tsmaster tr.section-header td span.sec-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#fff}
.tsmaster tr.section-leave td{background:var(--leave)}
.tsmaster tr.section-nb td{background:var(--nb)}
.tsmaster tr.section-projects td{background:var(--proj)}
/* Section spacing — gap rows between the three sections */
.tsmaster tr.section-gap td{background:var(--off);height:10px;border:none;padding:0}
/* Add-row — consistent across all three sections, always at the bottom of each section */
.tsmaster tr.add-row td{padding:7px 10px;background:var(--off);border-top:1px dashed var(--mid)}
.tsmaster tr.leave-row td{background:#F2F5EA}
.tsmaster tr.nb-row td{background:#EFF2F5}
.tsmaster tr.proj-first-in-group td{border-top:2px solid var(--blk)}
.tsmaster tr.ot-row td{background:#FAF1DC}
.tsmaster tr.ot-row td.stage-cell{color:var(--warn);font-weight:600}
.tsmaster .proj-cell{font-weight:600;color:var(--blk);vertical-align:middle;min-width:150px}
.tsmaster .stage-cell{font-weight:500;color:var(--blk);white-space:nowrap;padding-left:10px}
.tsmaster .total-col{font-weight:600;background:var(--off);text-align:center;width:52px}
/* Narrow aligned columns for OT checkbox and delete X */
.tsmaster .ot-col{text-align:center;width:30px;padding:2px 4px}
.tsmaster .del-col{text-align:center;width:28px;padding:2px 4px}
/* Cell note button */
.cell-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:2px}
.cn-btn{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mid);background:transparent;cursor:pointer;padding:0;flex-shrink:0;display:inline-block}
.cn-btn.has-note{background:var(--blue);border-color:var(--blue)}
.cn-btn:hover{border-color:var(--blk)}
/* Note popover */
.note-popover{position:fixed;z-index:300;background:var(--wht);border:1px solid var(--mid);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 10px 30px rgba(38,34,30,.20);min-width:230px;max-width:300px;max-height:calc(100vh - 20px);overflow-y:auto}
.note-popover-hdr{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;border-bottom:1px solid var(--mid);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--dkgrey)}
.note-popover textarea{width:100%;border:none;padding:11px 13px;font-family:'Figtree',sans-serif;font-size:13px;color:var(--blk);resize:none;min-height:80px;outline:none;line-height:1.55;display:block}
.note-popover-footer{padding:8px 12px;border-top:1px solid var(--mid);display:flex;justify-content:space-between;gap:6px;position:sticky;bottom:0;background:var(--wht);z-index:2}
/* Hour inputs — wider to show e.g. 37.5 */
.rate-btn{font-family:'Figtree',sans-serif;font-size:12.5px;font-weight:600;color:var(--blk);background:var(--wht);border:1px solid var(--mid);border-radius:var(--r);padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.rate-btn:hover{border-color:var(--accent);color:var(--accent)}
.hrs-input{width:70px;text-align:center;font-size:13px;font-weight:600;padding:7px 8px;border:1px solid var(--mid);border-radius:var(--r);font-family:'Figtree',sans-serif;color:var(--blk);background:var(--wht)}
.hrs-input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(212,74,46,.10)}
.role-select{font-size:12.5px;font-weight:500;padding:7px 10px;border-radius:var(--r)}
.tinput{width:58px;text-align:center;font-size:12.5px;padding:5px 3px;border:1px solid var(--mid);border-radius:var(--r-sm);font-family:'Figtree',sans-serif;font-weight:500;color:var(--blk)}
.tinput:disabled{opacity:.35;cursor:not-allowed;background:var(--off)}.tinput:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px rgba(212,74,46,.10)}
/* OT checkbox in stage row */
.ot-stage-cb{accent-color:var(--warn);width:13px;height:13px;cursor:pointer}
/* Copy-from-last-week bar */
.copy-bar{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;background:var(--off);border:1px solid var(--mid);border-radius:var(--r-lg);margin-bottom:10px;gap:10px;flex-wrap:wrap}
.copy-bar-label{font-size:11px;color:var(--dkgrey);font-weight:600;letter-spacing:.04em}
/* Hours target bar */
.hrs-bar{display:flex;align-items:stretch;gap:0;border:1px solid var(--mid);border-radius:var(--r-lg);background:var(--wht);margin-bottom:14px;overflow:hidden}
.hrs-segment{flex:1;padding:12px 16px;border-right:1px solid var(--mid);min-width:0}
.hrs-segment:last-child{border-right:none}
.hrs-segment-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dkgrey);font-weight:600;margin-bottom:4px}
.hrs-segment-val{font-family:'Figtree',sans-serif;font-size:22px;font-weight:600;line-height:1;color:var(--blk);letter-spacing:-.01em}
.hrs-segment-val.ok{color:var(--ok)}.hrs-segment-val.danger{color:var(--danger)}
.hrs-bar-status{display:flex;align-items:center;padding:12px 18px;min-width:200px;flex-direction:column;justify-content:center;gap:4px;background:var(--off)}
/* login */
/* Resource planner (Forecast) */
.tbl-freeze{max-height:76vh;overflow:auto}
.tbl-freeze thead th{position:sticky;top:0;z-index:6;background-clip:padding-box}
.tbl-freeze thead th::after{content:"";position:absolute;left:0;right:0;bottom:-1px;border-bottom:2px solid var(--blk)}
/* Forecast: part of the page, not a window in it. Horizontal scroll only —
   the page handles vertical, so your place survives an edit. The dates row is
   pinned by planStickyHead() translating the thead (see the JS for why). */
.plan-scroll{overflow-x:auto;overflow-y:visible}
.plan-scroll thead{position:relative;z-index:7;will-change:transform}
.plan-scroll thead th{background-clip:padding-box}
.plan-scroll thead th::after{content:"";position:absolute;left:0;right:0;bottom:-1px;border-bottom:2px solid var(--blk)}
/* Income page — cell fills mirror the cashflow spreadsheet exactly:
   cyan = invoiced awaiting payment, salmon = paid. */
/* Sticky right-hand totals need border-collapse:separate (collapsed-mode
   borders are painted by the table grid and do NOT move with a stuck cell).
   Row separation therefore moves to border-TOP on body cells, so a border
   never lags behind a sticky cell and rowspan bottoms cannot double up. */
.inc-table{border-collapse:separate;border-spacing:0}
.inc-table tbody td{border-top:1px solid var(--mid);border-bottom:none}
.inc-table td{font-size:11px;padding:3px 8px}
.inc-table th{font-size:10px;padding:5px 8px}
.inc-prob td{color:var(--grey);font-style:italic;font-size:10px;padding-top:1px;padding-bottom:2px}
.inc-drag-over{outline:2px dashed var(--accent);outline-offset:-2px;background:rgba(203,88,42,.08)}
.inc-sel{outline:2px solid var(--blk);outline-offset:-2px;background:rgba(62,74,58,.10)}
.inc-noted::before{content:"";position:absolute;top:0;left:0;border-style:solid;border-width:5px 5px 0 0;border-color:var(--dkgrey) transparent transparent transparent;opacity:.4}
.inc-cell{cursor:pointer;text-align:right;white-space:nowrap;min-width:66px;position:relative;user-select:none}
.inc-cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.inc-zero{color:var(--mid)}
.inc-paid{background:#F7B4AE}
.inc-inv{background:#8ED7DD}
.inc-unconf{color:var(--grey);font-style:italic}
.inc-mixed::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--dkgrey)}
.inc-nowcol{box-shadow:inset 2px 0 0 var(--accent)}
.inc-q0{background:#F6F1E8}
.inc-q1{background:#EDE4D4}
.inc-tot td{font-weight:600;background:var(--off)}
.inc-table tr.inc-tot-first>td{border-top:2px solid var(--blk)}
.inc-lab{text-align:right;letter-spacing:.05em;text-transform:uppercase;font-size:10px;color:var(--dkgrey)}
.inc-collapsed td{color:var(--dkgrey);cursor:pointer}
/* Round 3: block dividers, quarter/FY column rules, totals columns, and
   status fills that survive the row hover (darkened a step for feedback) */
.inc-table tr.inc-blk>td{border-top:2px solid var(--grey)}
.inc-qdiv{border-left:2px solid var(--grey)}
.inc-fydiv{border-left:3px solid var(--dkgrey)}
.inc-mfirst{border-left:3px solid var(--dkgrey)}
/* Totals panel: YtD + FY pinned to the right of the viewport ("a separate
   window") — sticky against .plan-scroll, fixed 90px columns so the two
   offsets are exact, shadowed left edge. z-index sits under the thead (7). */
.inc-totcol,.inc-totcol2,.inc-tothead{position:sticky;z-index:3;background:var(--off);width:90px;min-width:90px;max-width:90px;white-space:nowrap}
.inc-totcol{right:90px;border-left:3px solid var(--dkgrey);box-shadow:-6px 0 6px -5px rgba(0,0,0,.22)}
.inc-totcol2{right:0}
.inc-tothead{right:0;width:auto;min-width:180px;max-width:none;border-left:3px solid var(--dkgrey);box-shadow:-6px 0 6px -5px rgba(0,0,0,.22)}
.inc-table thead th.inc-totcol,.inc-table thead th.inc-totcol2,.inc-table thead th.inc-tothead{z-index:4}
.inc-table tr:hover td.inc-paid{background:#F0A29A}
.inc-table tr:hover td.inc-inv{background:#7CCBD4}
.inc-def{border-bottom:1px dotted var(--grey)}
.inc-lik-dot{padding:0;border-radius:50%}
.inc-invlink{cursor:pointer;color:var(--accent);font-size:11px;font-weight:600;opacity:.75}
.inc-invlink:hover{opacity:1;text-decoration:underline}
.inc-collapsed:hover td{background:var(--off)}
/* Chart band (between the project rows and the totals, minimisable) */
.inc-chart-btn{cursor:pointer;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dkgrey)}
.inc-chart-btn:hover{color:var(--accent)}
.inc-table tr.inc-chart-tog>td,.inc-table tr.inc-chart-row>td{background:var(--wht)}
.inc-table tr.inc-chart-tog:hover>td,.inc-table tr.inc-chart-row:hover>td{background:var(--wht)}
.inc-table tr.inc-chart-tog>td:first-child{padding:5px 10px}
/* Invoiced/VAT-qtr reads as a DIFFERENT kind of total (billed actuals per
   quarter, not a monthly scenario): gap above, quarter-beige tint, sub-label */
.inc-table tr.inc-vat-gap>td{border-top:none;background:var(--wht);height:6px;padding:0}
.inc-table tr.inc-vatrow>td{background:#F6F1E8;font-weight:600;border-top:2px solid var(--grey)}
.inc-table tr.inc-vatrow:hover>td{background:#EDE4D4}
.inc-vat-sub{display:block;font-size:8px;font-weight:400;letter-spacing:.02em;text-transform:none;color:var(--grey)}
.page-freeze thead{position:relative;z-index:7;will-change:transform}
.page-freeze thead th{background:var(--off);background-clip:padding-box}
.plan-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;user-select:none}
.plan-table th{text-align:center;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--dkgrey);padding:8px 3px;border-bottom:2px solid var(--blk);font-weight:600;background:var(--off);width:74px}
.plan-col-subheader td{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--dkgrey);font-weight:600;background:var(--off);border-bottom:1.5px solid var(--blk);padding:6px 10px}
.plan-table th.plan-rowhead{text-align:left;width:230px}
.plan-table th.plan-numcol{width:64px;border-right:1px solid var(--blk)}
.plan-numcol{width:64px;border-right:1px solid var(--mid)}
.plan-table th.plan-now{color:var(--blue);background:var(--blue-lt);box-shadow:inset 2px 0 0 var(--accent)}
.plan-table td.plan-today-cell{box-shadow:inset 2px 0 0 var(--accent)}
.plan-table td.plan-today-cell.plan-clash{box-shadow:inset 2px 0 0 var(--accent),inset 0 0 0 2px var(--leave)}
.plan-cell.plan-clash{box-shadow:inset 0 0 0 2px var(--leave)}
.plan-cell.plan-clash-pend{outline:2px dashed var(--leave);outline-offset:-2px}
.plan-rowhead{padding:6px 10px;border-bottom:1px solid var(--mid);vertical-align:middle}
.plan-cell{border-bottom:1px solid var(--mid);border-left:1px solid var(--mid);height:30px;max-height:30px;padding:0;overflow:hidden}
.plan-proj-row{cursor:pointer}
.plan-table tr.plan-proj-row td,.plan-table tr.plan-proj-row .plan-rowhead{border-top:3px solid var(--dkgrey)!important}
.plan-proj-row:hover .plan-rowhead{background:var(--off)}
.plan-proj-cell>.cell-flex{display:flex;align-items:center;gap:7px}
.plan-caret{font-size:10px;color:var(--dkgrey);width:10px;display:inline-block}
.plan-agg{text-align:center;font-size:11px;font-weight:600;color:var(--dkgrey);background:var(--wht)}
.plan-agg.has-hrs{background:rgba(87,105,129,.06);color:var(--blue)}
.plan-stage-row td{background:var(--off);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--blk);padding:6px 10px 6px 20px;border-bottom:1px solid var(--mid)}
.plan-person-row .plan-rowhead{font-weight:500}
.plan-person-row .plan-rowhead>.cell-flex{display:flex;align-items:center;justify-content:space-between;gap:6px}
.plan-rm-person{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;font-weight:700;padding:0;opacity:.5}
.plan-rm-person:hover{opacity:1}
.plan-empty-cell{cursor:crosshair}
.plan-empty-cell:hover{background:rgba(87,105,129,.05)}
.plan-empty-cell.plan-drag-preview{background:var(--blue-lt)}
.plan-bar-cell{padding:3px 2px !important}
.plan-bar{position:relative;height:100%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;letter-spacing:.03em;cursor:grab;border-radius:5px;min-height:22px}
.plan-bar:active{cursor:grabbing}
.plan-bar-label{pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
.plan-bar-handle{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.plan-bar-handle-l{left:0}.plan-bar-handle-r{right:0}
.plan-add-select{font-size:11px;padding:5px 7px;margin-right:6px}
/* Clearer expand/collapse carets, used across the planner and Project Health stage list */
.caret-icon{font-size:13px;font-weight:700;display:inline-block;width:15px;text-align:center;color:var(--blue)}
.plan-section-row{cursor:pointer}
.plan-section-row td{background:var(--proj);color:var(--wht);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:9px 12px}
.plan-section-row.plan-section-leave td{background:var(--leave)}
.plan-section-row.plan-section-nb td{background:var(--nb)}
.plan-section-row.plan-section-projects td{background:var(--proj)}
.plan-section-gap td{height:10px;padding:0;border:none;background:var(--off)}
.plan-section-row.plan-section-leave:hover td{filter:brightness(.92)}
.plan-section-row.plan-section-nb:hover td{filter:brightness(.92)}
.plan-section-row.plan-section-projects:hover td{background:var(--proj-dk)}
.plan-section-row .caret-icon{color:var(--wht)}
.plan-section-row .plan-ms-trigger{padding:2px 2px;vertical-align:middle;overflow:hidden}
.plan-section-row .plan-ms-trigger:hover{background:rgba(255,255,255,.15)}
.plan-section-row.plan-section-nb .plan-ms-trigger:has(.plan-ms-chips){background:#D9E1EA}
.plan-section-row.plan-section-nb .plan-ms-trigger:has(.plan-ms-chips):hover{background:#CBD5E2}
.plan-section-row.plan-section-leave .plan-ms-trigger:has(.plan-ms-chips){background:#E4DDEC}
.plan-section-row.plan-section-leave .plan-ms-trigger:has(.plan-ms-chips):hover{background:#D8CFE3}
.plan-section-row .plan-ms-chip{color:var(--blk)}
/* Leave / Non-billable bar colours, distinct from project bars */
.plan-bar-leave{background:var(--leave)}
.plan-bar-leave[onclick]{cursor:pointer}
.plan-bar-pending{background:transparent!important;border:2px dashed var(--leave);color:var(--leave);cursor:default}
.lv-cal{border-collapse:collapse;width:100%;font-size:10px}
.lv-cal th,.lv-cal td{border:1px solid var(--mid);padding:2px 1px;text-align:center;height:22px}
.lv-cal-add{cursor:pointer}
.lv-cal-add:hover{background:var(--off);box-shadow:inset 0 0 0 1px var(--accent)}
.lv-cal-bh{background:repeating-linear-gradient(45deg,#FBF3E0,#FBF3E0 5px,#F2E3BE 5px,#F2E3BE 10px)}
.lv-cal-bhh{background:repeating-linear-gradient(45deg,#FBF3E0,#FBF3E0 5px,#F2E3BE 5px,#F2E3BE 10px)}
.lv-cal-closed{background:#efece6}
.lv-cal th.lv-today-h{background:rgba(39,94,176,.08)}
.lv-cal td.lv-today{background:rgba(39,94,176,.06)}
.lv-cal-cell{font-weight:700;font-size:9px}
.lv-cal-pending{border:2px dashed var(--grey)!important;font-weight:700;font-size:9px;color:var(--dkgrey)!important}
.plan-bar-pending .plan-bar-label{color:var(--leave)}
.plan-bar-nb{background:var(--nb)}
/* Projects/Team mode toggle */
.plan-mode-toggle{display:inline-flex;border:1px solid var(--mid);border-radius:var(--r);overflow:hidden;background:var(--wht);margin-bottom:10px}
.plan-mode-toggle button{font-family:'Figtree',sans-serif;font-size:12px;font-weight:600;padding:7px 16px;background:none;border:none;cursor:pointer;color:var(--dkgrey)}
.plan-mode-toggle button+button{border-left:1px solid var(--mid)}
.plan-mode-toggle button.active{background:var(--blk);color:#fff}
/* Team view person row */
.plan-avatar{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:9px;font-weight:700;flex-shrink:0}
.plan-avatar-ph{background:var(--warn)}
/* Utilization bars */
.plan-util-bar{height:100%;min-height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;border-radius:5px;cursor:pointer}
.plan-breakdown-group{font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--dkgrey);margin:8px 0 3px}
.plan-breakdown-group:first-child{margin-top:0}
.plan-breakdown-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.plan-util-full{background:var(--ok)}
.plan-util-open{background:rgba(95,112,70,.35);color:var(--blk)}
.plan-util-over{background:var(--danger)}
/* Placeholder add/edit modal */
.modal-overlay{position:fixed;inset:0;background:rgba(38,34,30,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-box{background:#fff;width:320px;max-width:90vw;border-radius:var(--r-xl);box-shadow:0 16px 48px rgba(38,34,30,.28)}
.modal-box input[type=text],.modal-box input[type=number]{width:100%;font-size:12px}
/* Note indicator on a bar */
.plan-bar-note-dot{position:absolute;top:1px;right:3px;font-size:12px;line-height:1;color:rgba(255,255,255,.9);pointer-events:none}
/* View toggle */
.plan-view-toggle{display:inline-flex;border:1px solid var(--mid);border-radius:var(--r);overflow:hidden;background:var(--wht)}
.plan-view-toggle button{font-family:'Figtree',sans-serif;font-size:12px;font-weight:600;padding:7px 15px;background:none;border:none;cursor:pointer;color:var(--dkgrey)}
.plan-view-toggle button+button{border-left:1px solid var(--mid)}
.plan-view-toggle button.active{background:var(--blk);color:#fff}
/* Column widths per view */
.plan-table.view-day th.plan-wkcol{width:38px}
/* Dedicated "+" column for structural adds (project/stage/person) */
/* "+" add-select — sits inline in the section header, same discrete footprint as the × remove button */
.plan-add-select-inline{background:none;border:none;color:var(--accent);cursor:pointer;font-size:22px;font-weight:800;line-height:1;padding:0 4px;opacity:1;-webkit-appearance:none;-moz-appearance:none;appearance:none}
.plan-add-select-inline:hover{opacity:.75}
.plan-add-select-inline option{font-weight:500;color:var(--blk);font-size:12px}
.plan-section-cell>.cell-flex{display:flex;align-items:center;justify-content:space-between}
.plan-section-label{white-space:nowrap}
.plan-proj-cell>.cell-flex,.plan-stage-cell>.cell-flex{display:flex;align-items:center;justify-content:space-between;min-width:0}
.plan-proj-cell .cell-flex>span:first-child,.plan-stage-cell .cell-flex>span:first-child{min-width:0;overflow-wrap:break-word}
.plan-table.view-week th.plan-wkcol{width:74px}
.plan-table.view-month th.plan-wkcol{width:60px}
.plan-table th.plan-weekend-col{background:#EFEBE3;color:var(--blue-md)}
.plan-table th.plan-bh-col{background:#F3E7C9;color:#8A6212;border-bottom-color:#DFA64F}
.plan-cell.plan-bh-cell{background:repeating-linear-gradient(45deg,#FBF3E0,#FBF3E0 5px,#F2E3BE 5px,#F2E3BE 10px)}
.plan-cell.plan-bh-cell.plan-weekend-cell{background:repeating-linear-gradient(45deg,#F6EDD6,#F6EDD6 4px,#E8D5A8 4px,#E8D5A8 8px)}
.plan-table th.plan-bhweek-col{background:#FAF3E3}
.plan-cell.plan-bhweek-cell{box-shadow:inset 0 0 0 9999px rgba(223,166,79,.07)}
.bh-badge{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.04em;background:#DFA64F;color:#3A2B08;border-radius:3px;padding:0 3px;vertical-align:1px}
.tsmaster th.bh-col{background:#F3E7C9;color:#8A6212}
.tsmaster td.bh-cell{background:repeating-linear-gradient(45deg,#FBF3E0,#FBF3E0 5px,#F2E3BE 5px,#F2E3BE 10px)!important}
.plan-cell.plan-weekend-cell{background:repeating-linear-gradient(45deg,var(--off),var(--off) 4px,#E8E3DA 4px,#E8E3DA 8px)}
.plan-empty-cell.plan-weekend-cell{cursor:not-allowed}
/* Weekend hatch inside a multi-day bar (day view only) */
.plan-bar-days{position:absolute;inset:0;display:flex;pointer-events:none}
.plan-bar-day{flex:1}
.plan-bar-day.weekend{background:repeating-linear-gradient(45deg,rgba(255,255,255,.3),rgba(255,255,255,.3) 3px,transparent 3px,transparent 6px)}
/* Larger popover for the planner's date/hours/notes/repeat form */
.plan-popover-lg{min-width:300px;max-width:320px}
.plan-popover-lg input[type=date],.plan-popover-lg input[type=number],.plan-popover-lg input[type=text]{width:100%;font-size:12px}
.plan-choice-popover{min-width:200px;max-width:230px}
.plan-choice-popover .btn{width:100%;text-align:left}
/* Milestones */
.plan-ms-trigger{cursor:pointer}
.plan-ms-trigger:hover{background:rgba(87,105,129,.05)}
.plan-agg-hrs{font-size:11px}
.plan-ms-chips{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;overflow:hidden;width:100%;height:100%}
.plan-ms-chip{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;font-size:8px;font-weight:600;letter-spacing:0;color:var(--blk);padding:0 2px;white-space:normal;word-break:break-word;overflow:hidden;line-height:1.15;text-align:center;max-height:100%}
.plan-ms-more{font-size:8px;color:var(--dkgrey);font-weight:700;padding:0 2px;text-align:center}
.plan-cell:has(.plan-ms-chips){background:var(--warn-bg)}
tr.plan-krow-leave .plan-cell:has(.plan-ms-chips){background:#EDE7F3}
tr.plan-krow-nb .plan-cell:has(.plan-ms-chips){background:#E3E9F0}
.plan-cell.plan-weekend-cell:has(.plan-ms-chips){background:repeating-linear-gradient(45deg,#F5EDD5,#F5EDD5 4px,#E8DFC0 4px,#E8DFC0 8px)}
tr.plan-krow-leave .plan-cell.plan-weekend-cell:has(.plan-ms-chips){background:repeating-linear-gradient(45deg,#EDE7F3,#EDE7F3 4px,#DDD3E8 4px,#DDD3E8 8px)}
tr.plan-krow-nb .plan-cell.plan-weekend-cell:has(.plan-ms-chips){background:repeating-linear-gradient(45deg,#E3E9F0,#E3E9F0 4px,#D3DCE6 4px,#D3DCE6 8px)}
.plan-ms-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--mid)}
.plan-ms-row:last-child{border-bottom:none}

.login-box{max-width:360px;width:100%;background:var(--wht);border:1px solid var(--mid);border-radius:var(--r-xl);box-shadow:0 10px 40px rgba(38,34,30,.08);padding:36px}
.login-title{font-family:'Figtree',sans-serif;font-size:18px;font-weight:600;margin-bottom:24px;color:var(--blk)}
.login-outer{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
/* ── CRM ── */
.crm-rate{display:inline-block;padding:2px 10px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:'Figtree',sans-serif;border-radius:999px}
.crm-rate-hot{background:var(--accent-soft);color:var(--accent)}
.crm-rate-warm{background:var(--warn-bg);color:var(--warn)}
.crm-rate-cold{background:var(--blue-lt);color:var(--blue)}
.crm-rate-dormant{background:var(--off);color:var(--grey)}
.crm-table td{padding-top:10px;padding-bottom:10px;vertical-align:middle}
.crm-row-hot td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.crm-row-warm td:first-child{box-shadow:inset 3px 0 0 #DFA64F}
.crm-row-cold td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.crm-row-dormant td:first-child{box-shadow:inset 3px 0 0 var(--mid)}
.crm-table tbody tr:hover{background:var(--off)}
.crm-sec{display:inline-block;border:1px solid;padding:1px 7px;font-size:9px;font-weight:600;letter-spacing:.03em;border-radius:9px;white-space:nowrap}
.crm-chip{display:inline-flex;align-items:center;border:1px solid var(--mid);background:#fff;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;border-radius:999px;font-family:'Figtree',sans-serif}
.crm-chip:hover{border-color:var(--accent)}
.crm-chip-on{background:var(--blk);color:#fff!important;border-color:var(--blk)!important}
.crm-chip-hot{color:var(--accent);border-color:var(--accent)}
.crm-chip-warm{color:#9A6E1F;border-color:#DFA64F}
.crm-chip-cold{color:var(--blue);border-color:var(--blue)}
.crm-chip-dormant{color:var(--grey)}
.crm-chip-hot.crm-chip-on{background:var(--accent);border-color:var(--accent)!important}
.crm-chip-warm.crm-chip-on{background:#DFA64F;border-color:#DFA64F!important}
.crm-chip-cold.crm-chip-on{background:var(--blue);border-color:var(--blue)!important}
.crm-searchbox{flex:1;min-width:220px;max-width:420px;font-size:13px;padding:10px 14px}
.crm-viewbtn{padding:9px 18px;font-size:12px}
.crm-viewbtn-on{background:var(--blk);color:#fff}
.crm-addbtn{padding:9px 18px;font-size:12px}
.crm-tile{flex:1;min-width:105px;border:1px solid var(--mid);border-radius:var(--r-lg);box-shadow:0 1px 3px rgba(38,34,30,.04);padding:12px 14px;background:#fff;cursor:pointer}
.crm-tile:hover{border-color:var(--accent)}
.crm-evcard{flex:1;min-width:280px;max-width:430px;cursor:pointer}
.crm-evcard:hover{border-color:var(--accent)}
.crm-co-ico{color:var(--dkgrey);font-size:11px}
.crm-tl-item{padding:9px 12px;border-top:1px solid var(--mid);background:transparent;color:var(--dkgrey)}
.crm-tl-latest{border:1px solid var(--accent-soft);border-left:3px solid var(--accent);border-radius:var(--r);background:var(--wht);color:var(--blk);margin-bottom:8px;box-shadow:0 1px 3px rgba(38,34,30,.05)}
.crm-mention{color:var(--accent);font-weight:600}
.crm-biginput{font-size:13px;padding:10px 12px}
.fsec{background:var(--off);border:1px solid var(--mid);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:14px}
.fsec-title{font-size:13px;font-weight:700;color:var(--blk);margin-bottom:10px}
.fsec .crm-tl-latest{border-color:var(--accent-soft)}
.home-qa{display:inline-flex;align-items:center;border:1px solid var(--accent);background:var(--accent);border-radius:10px;padding:13px 22px;font-family:'Figtree',sans-serif;font-size:13px;font-weight:700;color:var(--wht);cursor:pointer;letter-spacing:.01em}
.home-qa:hover{border-color:var(--accent-dk);background:var(--accent-dk)}
.home-flick{border:1px solid var(--mid);background:var(--wht);border-radius:6px;width:24px;height:24px;font-size:13px;font-weight:700;color:var(--dkgrey);cursor:pointer;line-height:1}
.home-flick:hover{border-color:var(--accent);color:var(--accent)}
.home-flick:disabled{opacity:.35;cursor:default}
.ts-daytotal td{font-weight:700;font-size:11px;border-top:2px solid var(--mid);background:var(--off);text-align:center;padding:6px 3px}
.ts-daytotal td.left{text-align:left;padding-left:12px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dkgrey)}
.ts-daytotal td.over{color:var(--danger);background:var(--danger-bg)}
.ts-pend{display:inline-block;min-width:34px;padding:3px 4px;border:2px dashed var(--leave);border-radius:5px;color:var(--leave);font-weight:700;font-size:11px}
.lv-cal-sch{height:5px;padding:0!important;border:none!important;background:transparent}
.lv-cal-sch.on{background:var(--accent)}
.temp-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--mid);background:var(--wht);border-radius:16px;padding:5px 12px;font-size:11px;font-weight:600;color:var(--dkgrey);cursor:pointer;font-family:'Figtree',sans-serif}
.temp-chip.active{border-color:var(--blk);color:var(--blk);background:var(--off)}
.temp-dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.imp-step{background:var(--off);border:1px solid var(--mid);border-radius:10px;padding:16px;margin-bottom:14px}
.imp-step-title{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dkgrey);font-weight:600;margin-bottom:12px}
.imp-file-ok{font-size:11px;font-weight:600;color:var(--blk);margin-top:6px}
input[type="file"]{font-family:'Figtree',sans-serif;font-size:11px;color:var(--dkgrey);max-width:100%}
input[type="file"]::file-selector-button{font-size:12px;font-weight:600;padding:8px 16px;border-radius:var(--r);background:var(--wht);border:1px solid var(--blk);color:var(--blk);cursor:pointer;font-family:'Figtree',sans-serif;margin-right:10px}
input[type="file"]::file-selector-button:hover{background:var(--blk);color:var(--wht)}
.btn-add:disabled{opacity:.4;cursor:default}
.home-note{display:flex;align-items:center;gap:10px;font-size:12px;padding:8px 10px;border:1px solid var(--mid);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff}
.home-note:hover{border-color:var(--accent)}
.home-proj{flex:1;min-width:210px;max-width:300px;border:1px solid var(--mid);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fff}
.home-proj:hover{border-color:var(--accent)}
.undo-btn{border:1px solid var(--mid);background:#fff;border-radius:6px;width:28px;height:26px;font-size:14px;line-height:1;cursor:pointer;color:var(--blk);padding:0}
.undo-btn:hover:not(:disabled){background:var(--off)}
.undo-btn:disabled{opacity:.32;cursor:default}
.undo-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--blk);color:#fff;font-size:12px;padding:9px 16px;border-radius:8px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:.96;transition:opacity .4s}
.undo-toast-out{opacity:0}
.lv-cal-cell{position:relative}
.lvcal-h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;opacity:0;background:rgba(38,34,30,.35);z-index:2}
.lvcal-h-l{left:0;border-radius:2px 0 0 2px}.lvcal-h-r{right:0;border-radius:0 2px 2px 0}
.lv-cal-cell:hover .lvcal-h{opacity:1}
td.lvcal-prev{outline:2px dashed var(--accent);outline-offset:-2px}
.nav-sep{height:1px;background:var(--mid);margin:10px 16px}
.nav-g1 .nav-item.active{color:var(--blue);background:var(--blue-lt)}
.nav-g3 .nav-item.active{color:var(--dkgrey);background:var(--mid)}

/* ── Mobile companion (only rendered below 640px — desktop untouched) ─────── */
.mob{display:flex;flex-direction:column;min-height:100dvh;background:var(--off)}
.mob-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--wht);border-bottom:1px solid var(--mid);position:sticky;top:0;z-index:20}
.mob-head img{width:34px;height:34px;border-radius:8px}
.mob-head .mob-title{font-weight:700;font-size:16px;letter-spacing:.01em}
.mob-head .mob-me{margin-left:auto;font-size:11px;color:var(--grey)}
.mob-body{flex:1;padding:12px 12px calc(76px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;box-sizing:border-box}
.mob-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--wht);border-top:1px solid var(--mid);padding-bottom:env(safe-area-inset-bottom);z-index:30}
.mob-nav button{flex:1;background:none;border:none;padding:9px 0 7px;font-family:inherit;font-size:10px;letter-spacing:.04em;color:var(--grey);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-appearance:none;appearance:none}
.mob-nav button .mn-ico{line-height:1;display:block}
.mob-nav button .mn-ico svg{width:21px;height:21px;display:block}
.mob-nav button.on{color:var(--accent);font-weight:700}
.mob-card{background:var(--wht);border:1px solid var(--mid);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.mob-card .mc-title{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dkgrey);font-weight:700;margin-bottom:8px}
.mob input,.mob select,.mob textarea{font-size:16px} /* prevents iOS focus zoom */
.mob-wkrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mob-wkrow .mw-label{flex:1;text-align:center;font-size:12.5px;font-weight:600}
.mob-wkbtn{background:var(--wht);border:1px solid var(--mid);border-radius:8px;font-size:15px;padding:5px 12px;cursor:pointer;font-family:inherit;color:var(--blk);-webkit-appearance:none;appearance:none}
.mob-days{display:flex;gap:4px;margin-bottom:10px}
.mob-day{flex:1;background:var(--wht);border:1px solid var(--mid);border-radius:10px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-family:inherit;color:var(--blk);-webkit-appearance:none;appearance:none}
.mob-day span{font-size:8.5px;letter-spacing:.06em;color:var(--grey)}
.mob-day b{font-size:14px;color:var(--blk)}
.mob-day i{font-style:normal;font-size:9px;color:var(--dkgrey)}
.mob-day.closed{background:var(--off)}
.mob-day.on{border-color:var(--accent);background:#FBEFE9}
.mob-day.on b{color:var(--accent)}
.mob-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--mid)}
.mob-row:first-of-type{border-top:none}
.mob-row .mr-main{flex:1;min-width:0}
.mob-row .mr-t{font-size:13px;font-weight:600;line-height:1.25}
.mob-row .mr-s{font-size:11px;color:var(--dkgrey);margin-top:1px}
.mob input.mob-hrs{width:84px;min-width:84px;flex:0 0 84px;text-align:right;padding:9px 10px;border:1px solid var(--mid);border-radius:9px;font-family:inherit;font-size:16px;background:var(--wht);color:var(--blk);-webkit-appearance:none;appearance:none;margin:0}
.mob input.mob-hrs:disabled{background:var(--off);color:var(--grey)}
.mob-chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;border-radius:99px;padding:3px 9px}
.mob-chip.ok{background:#E7EDE2;color:#4E5D41}.mob-chip.warn{background:#F8E7D9;color:#A65B2A}.mob-chip.bad{background:#F6DEDC;color:#8C2F26}.mob-chip.mut{background:var(--off);color:var(--grey)}
.mob-btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:13px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;-webkit-appearance:none;appearance:none}
.mob-btn.sec{background:var(--wht);color:var(--blk);border:1px solid var(--mid)}
.mob-btn:disabled{opacity:.45}
.mob-list-item{display:flex;gap:10px;padding:11px 12px;background:var(--wht);border:1px solid var(--mid);border-left-width:4px;border-radius:11px;margin-bottom:7px;cursor:pointer;align-items:center}
.mob-list-item .ml-main{flex:1;min-width:0}
.mob-list-item .ml-t{font-size:13.5px;font-weight:600}
.mob-list-item .ml-s{font-size:11px;color:var(--dkgrey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mob-search{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--mid);border-radius:11px;margin-bottom:9px;background:var(--wht)}
/* Team calendar (Round 18) — 1px grid drawn by the gap over a --mid backing. */
.mtc-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.mtc-top .mtc-lab{flex:1;text-align:center;font-size:11.5px;font-weight:600}
.mtc{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr));gap:1px;background:var(--mid);border:1px solid var(--mid);border-radius:9px;overflow:hidden}
.mtc>div{background:var(--wht);min-height:27px;padding:2px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;line-height:1.15;overflow:hidden}
.mtc>div.mtc-name{align-items:flex-start;padding-left:6px;font-size:10.5px;font-weight:700;color:var(--dkgrey);text-align:left}
.mtc>div.mtc-name.meRow{color:var(--accent)}
.mtc>div.mtc-h{background:var(--off);gap:0}
.mtc>div.mtc-h span{font-size:8.5px;letter-spacing:.05em;color:var(--grey);font-weight:700}
.mtc>div.mtc-h b{font-size:12.5px}
.mtc>div.mtc-h i{font-style:normal;font-size:7.5px;letter-spacing:.04em;color:var(--grey);font-weight:700}
.mtc>div.today{background:#FBEFE9}

<script>

// ── App version / stale-copy detection ───────────────────────────────────────
// APP_BUILD is a monotonically increasing integer — the ONLY thing compared.
// **BUMP IT ON EVERY RELEASE**, or a stale desktop copy won't know it's behind.
// The newest build anyone opens records its number in the shared state
// (st.meta.appBuild); a copy whose APP_BUILD is lower shows a "reopen from
// SharePoint" banner. APP_VERSION_LABEL is the human-facing date, display only.
const APP_BUILD=27;
const APP_VERSION_LABEL='17 Aug 2026';

let _sbSession=null;
let _sbSaveTimer=null;
let _sbSaveQueued=null;
let _sbSaving=false;

// Every persisted top-level key (currentUser is session-only and NEVER goes here)
const SB_STATE_KEYS=['meta','users','projects','clients','entries','forecasts','submissions','userProjects','userStages','tsWeekRows','cellNotes','overtime','nbOvertime','leave','leaveActive','nonBillable','nonBillableActive','planAssignments','planRows','milestones','leaveRows','nbRows','placeholders','planProjectRows','planStageRows','trash','cpd','cpdNotices','cpdArbTopics','crmOrgs','crmContacts','crmInteractions','crmActions','crmLeads','crmEvents','crmSectors','crmRoles','leaveRequests','leaveAllowances','leaveClosures','leaveCarry','leaveYearNotes','leaveNotices','projectMembers'];
// Keys that are objects keyed by compound strings — merged per sub-key so two
// people editing different cells never clobber each other.
const SB_MAP_KEYS=['meta','entries','forecasts','submissions','userProjects','userStages','tsWeekRows','cellNotes','overtime','nbOvertime','leave','leaveActive','nonBillable','nonBillableActive','planRows','planStageRows','leaveAllowances','leaveCarry','leaveYearNotes','projectMembers'];

function collectState(){const o={};for(const k of SB_STATE_KEYS)o[k]=st[k];return o;}
function snapshotState(){return JSON.parse(JSON.stringify(collectState()));}

// Identity for array items so concurrent list edits merge instead of overwriting.
function sbIdOf(key,item){
  if(item==null||typeof item!=='object')return undefined;
  if(item.id!==undefined)return item.id;
  if(key==='users'||key==='placeholders'||key==='projects')return item.name;
  if(key==='clients')return item.company;
  if(key==='trash')return item.ts;
  return undefined;
}
function sbCanIdMerge(key,curArr,baseArr){
  if(!Array.isArray(curArr)||!Array.isArray(baseArr))return false;
  const seen=new Set();
  for(const it of curArr){const id=sbIdOf(key,it);if(id===undefined||seen.has(id))return false;seen.add(id);}
  const seen2=new Set();
  for(const it of baseArr){const id=sbIdOf(key,it);if(id===undefined||seen2.has(id))return false;seen2.add(id);}
  return true;
}

// Diff current state against the last-synced baseline.
function computeDiff(cur,base){
  const diff={maps:{},arrays:{},replace:{}};let any=false;
  for(const k of SB_STATE_KEYS){
    if(SB_MAP_KEYS.includes(k)){
      const c=cur[k]||{},b=(base&&base[k])||{};
      const set={},del=[];
      for(const kk in c){if(!(kk in b)||JSON.stringify(c[kk])!==JSON.stringify(b[kk]))set[kk]=c[kk];}
      for(const kk in b){if(!(kk in c))del.push(kk);}
      if(Object.keys(set).length||del.length){diff.maps[k]={set,del};any=true;}
    } else if(Array.isArray(cur[k])&&base&&sbCanIdMerge(k,cur[k],base[k]||[])){
      const c=cur[k],b=base[k]||[];
      const bById={};for(const it of b)bById[sbIdOf(k,it)]=it;
      const cIds=new Set(c.map(it=>sbIdOf(k,it)));
      const added=[],changed={};
      for(const it of c){
        const id=sbIdOf(k,it);
        if(!(id in bById))added.push(it);
        else if(JSON.stringify(it)!==JSON.stringify(bById[id]))changed[id]=it;
      }
      const removed=Object.keys(bById).filter(id=>!cIds.has(id)&&!cIds.has(+id));
      if(added.length||removed.length||Object.keys(changed).length){diff.arrays[k]={added,removed,changed};any=true;}
    } else {
      const cj=JSON.stringify(cur[k]);
      const bj=base?JSON.stringify(base[k]):undefined;
      if(cj!==bj){diff.replace[k]=cur[k];any=true;}
    }
  }
  return any?diff:null;
}

// Apply a local diff on top of (a copy of) someone else's committed state.
function applyDiff(target,diff){
  const out=JSON.parse(JSON.stringify(target||{}));
  for(const k in diff.replace)out[k]=diff.replace[k];
  for(const k in diff.maps){
    if(typeof out[k]!=='object'||Array.isArray(out[k])||!out[k])out[k]={};
    const m=diff.maps[k];
    for(const kk in m.set)out[k][kk]=m.set[kk];
    for(const kk of m.del)delete out[k][kk];
  }
  for(const k in diff.arrays){
    if(!Array.isArray(out[k]))out[k]=[];
    const a=diff.arrays[k];
    const removedSet=new Set(a.removed.map(String));
    out[k]=out[k].filter(it=>!removedSet.has(String(sbIdOf(k,it))));
    out[k]=out[k].map(it=>{const id=String(sbIdOf(k,it));return a.changed[id]!==undefined?a.changed[id]:(a.changed[sbIdOf(k,it)]!==undefined?a.changed[sbIdOf(k,it)]:it);});
    const present=new Set(out[k].map(it=>String(sbIdOf(k,it))));
    for(const it of a.added)if(!present.has(String(sbIdOf(k,it))))out[k].push(it);
  }
  return out;
}

// Pull remote data into the live state (deep copy so baseline never shares refs).
function adoptRemoteState(data){
  for(const k of SB_STATE_KEYS)if(data[k]!==undefined)st[k]=JSON.parse(JSON.stringify(data[k]));
  applyGuards();
  checkAppVersion(false);   // a colleague may have opened a newer build — reflect it mid-session (read-only)
  // Colleagues' changes must never leak into the next local undo step's diff.
  // The per-cell conflict checks in applyDiffChecked keep existing steps safe.
  _undoBase=snapshotState();
}
// Compare this copy's APP_BUILD against the highest build recorded in shared
// state. If ours is newer, record ours (once — the ratchet only ever climbs).
// If ours is older, flag the stale-copy banner. allowWrite is false on the
// mid-session merge path to avoid re-entrant saves during a poll.
function checkAppVersion(allowWrite){
  if(typeof st.meta!=='object'||!st.meta||Array.isArray(st.meta))st.meta={};
  const stored=Number(st.meta.appBuild)||0;
  if(APP_BUILD>stored){
    _staleVersion=false;
    if(allowWrite){st.meta.appBuild=APP_BUILD;st.meta.appVersionLabel=APP_VERSION_LABEL;save();}
  }else{
    _staleVersion=APP_BUILD<stored;
  }
}

function isTyping(){
  const a=document.activeElement;
  return !!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'));
}

// ── Undo / redo ────────────────────────────────────────────────────────────────
// Session-local, multi-user-safe undo built on the same key-level diff machinery
// the Supabase merge uses. Every save() records a forward + reverse diff against
// a rolling base snapshot (coalesced per event handler via a microtask, so one
// user action = one undo step). Undo applies the reverse diff, but each cell /
// record is only reverted if it still holds the value this step wrote — anything
// a colleague has edited since is left alone and reported. Approvals and
// timesheet submissions are deliberately excluded (wrapped in noUndo) since they
// have explicit reverse actions and affect other people's workflows.
const UNDO_MAX=50;
let _undoBase=null,_undoStack=[],_redoStack=[],_undoSuppress=false,_undoPending=false,_undoPendingSuppress=false;
const UNDO_NAMES={meta:'settings',entries:'timesheet hours',overtime:'timesheet hours',nbOvertime:'timesheet hours',leave:'leave hours',nonBillable:'non-billable hours',forecasts:'forecast',planAssignments:'forecast',planRows:'forecast rows',planProjectRows:'forecast rows',planStageRows:'forecast rows',leaveRows:'forecast rows',nbRows:'forecast rows',milestones:'milestones',placeholders:'placeholders',users:'team',projects:'projects',clients:'clients',cellNotes:'notes',submissions:'timesheet submission',userProjects:'timesheet rows',userStages:'timesheet rows',tsWeekRows:'timesheet rows',leaveActive:'timesheet rows',nonBillableActive:'timesheet rows',cpd:'CPD',cpdNotices:'CPD notices',cpdArbTopics:'CPD settings',trash:'deleted items',leaveRequests:'leave',leaveAllowances:'leave allowances',leaveClosures:'office closures',leaveCarry:'leave carry-over',leaveYearNotes:'leave notes',leaveNotices:'leave notices',projectMembers:'project team',crmOrgs:'CRM',crmContacts:'CRM',crmInteractions:'CRM',crmActions:'CRM actions',crmLeads:'CRM',crmEvents:'CRM events',crmSectors:'CRM settings',crmRoles:'CRM settings'};
function undoLabelFor(diff){
  const ks=new Set();
  for(const g of['maps','arrays','replace'])for(const k in (diff[g]||{}))ks.add(UNDO_NAMES[k]||k);
  return[...ks].slice(0,3).join(', ')||'change';
}
function noUndo(fn){_undoSuppress=true;try{fn();}finally{_undoSuppress=false;}}
// Called from save(). Coalesces all synchronous saves in one handler into a
// single undo step recorded in a microtask after the handler returns.
function scheduleUndoRecord(){
  _aggCache=null;
  if(_undoSuppress)_undoPendingSuppress=true;
  if(_undoPending)return;
  _undoPending=true;
  queueMicrotask(()=>{
    _undoPending=false;
    const suppressed=_undoPendingSuppress;_undoPendingSuppress=false;
    const cur=snapshotState();
    if(!_undoBase){_undoBase=cur;return;}
    const fwd=computeDiff(cur,_undoBase);
    if(!fwd){return;}
    if(!suppressed){
      const rev=computeDiff(_undoBase,cur);
      _undoStack.push({fwd,rev,label:undoLabelFor(fwd)});
      if(_undoStack.length>UNDO_MAX)_undoStack.shift();
      _redoStack.length=0;
    }
    _undoBase=cur;
  });
}
function _jeq(a,b){return JSON.stringify(a)===JSON.stringify(b);}
// Apply the `apply` diff, but only where the live state still matches what the
// `expect` diff (the same step, opposite direction) says it should currently be.
function applyDiffChecked(apply,expect){
  let applied=0,skipped=0;
  if(!apply)return{applied,skipped};
  for(const k in (apply.replace||{})){
    const exp=(expect&&expect.replace)?expect.replace[k]:undefined;
    if(exp===undefined||_jeq(st[k],exp)){st[k]=JSON.parse(JSON.stringify(apply.replace[k]));applied++;}
    else skipped++;
  }
  for(const k in (apply.maps||{})){
    if(typeof st[k]!=='object'||Array.isArray(st[k])||!st[k])st[k]={};
    const m=apply.maps[k],em=(expect&&expect.maps&&expect.maps[k])||{set:{},del:[]};
    for(const kk in m.set){
      const expectedPresent=(kk in em.set);
      const expectedAbsent=(em.del||[]).includes(kk);
      const ok=expectedPresent?_jeq(st[k][kk],em.set[kk]):expectedAbsent?!(kk in st[k]):true;
      if(ok){st[k][kk]=JSON.parse(JSON.stringify(m.set[kk]));applied++;}else skipped++;
    }
    for(const kk of (m.del||[])){
      const ok=(kk in em.set)?_jeq(st[k][kk],em.set[kk]):true;
      if(ok){if(kk in st[k]){delete st[k][kk];applied++;}}else skipped++;
    }
  }
  for(const k in (apply.arrays||{})){
    if(!Array.isArray(st[k]))st[k]=[];
    const a=apply.arrays[k],ea=(expect&&expect.arrays&&expect.arrays[k])||{added:[],removed:[],changed:{}};
    // Restore items this step removed — only if nothing with that id exists now.
    for(const it of (a.added||[])){
      const id=String(sbIdOf(k,it));
      if(!st[k].some(x=>String(sbIdOf(k,x))===id)){st[k].push(JSON.parse(JSON.stringify(it)));applied++;}
      else skipped++;
    }
    // Remove items this step added — only if they're unchanged since.
    const eaAddById={};for(const it of (ea.added||[]))eaAddById[String(sbIdOf(k,it))]=it;
    for(const id of (a.removed||[])){
      const sid=String(id);
      const curIt=st[k].find(x=>String(sbIdOf(k,x))===sid);
      if(curIt===undefined)continue;
      if(eaAddById[sid]===undefined||_jeq(curIt,eaAddById[sid])){st[k]=st[k].filter(x=>String(sbIdOf(k,x))!==sid);applied++;}
      else skipped++;
    }
    // Revert changed items — only if they still hold this step's value.
    for(const id in (a.changed||{})){
      const idx=st[k].findIndex(x=>String(sbIdOf(k,x))===String(id));
      if(idx<0){skipped++;continue;}
      const expIt=(ea.changed||{})[id];
      if(expIt===undefined||_jeq(st[k][idx],expIt)){st[k][idx]=JSON.parse(JSON.stringify(a.changed[id]));applied++;}
      else skipped++;
    }
  }
  return{applied,skipped};
}
function undoToast(msg){
  try{
    let el=document.getElementById('undo-toast');
    if(el)el.remove();
    el=document.createElement('div');
    el.id='undo-toast';el.className='undo-toast';el.textContent=msg;
    document.body.appendChild(el);
    const ms=Math.min(8000,Math.max(2200,1400+String(msg).length*28)); // longer messages stay up longer
    setTimeout(()=>{el.classList.add('undo-toast-out');},ms);
    setTimeout(()=>{el.remove();},ms+500);
  }catch(e){}
}
window.doUndo=function(){
  if(!st.currentUser)return;
  if(!_undoStack.length){undoToast('Nothing to undo');return;}
  const step=_undoStack.pop();
  const res=applyDiffChecked(step.rev,step.fwd);
  applyGuards();
  _redoStack.push(step);
  _undoBase=snapshotState();
  noUndo(save);
  render();
  undoToast(res.skipped?(res.applied?`Undone: ${step.label} — ${res.skipped} change${res.skipped===1?'':'s'} kept (edited by someone else since)`:`Couldn't undo — ${step.label} was changed by someone else since`):`Undone: ${step.label}`);
}
window.doRedo=function(){
  if(!st.currentUser)return;
  if(!_redoStack.length){undoToast('Nothing to redo');return;}
  const step=_redoStack.pop();
  const res=applyDiffChecked(step.fwd,step.rev);
  applyGuards();
  _undoStack.push(step);
  _undoBase=snapshotState();
  noUndo(save);
  render();
  undoToast(res.skipped?(res.applied?`Redone: ${step.label} — ${res.skipped} change${res.skipped===1?'':'s'} kept (edited by someone else since)`:`Couldn't redo — ${step.label} was changed by someone else since`):`Redone: ${step.label}`);
}
document.addEventListener('keydown',function(e){
  if(!st.currentUser)return;
  if(!(e.ctrlKey||e.metaKey))return;
  if(isTyping())return;
  const k=(e.key||'').toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();doUndo();}
  else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();doRedo();}
});

function sbHeaders(token){
  return{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+(token||SB_KEY)};
}

async function sbLogin(email,password){
  const res=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY},
    body:JSON.stringify({email,password})
  });
  if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.error_description||err.msg||'Login failed');}
  const data=await res.json();
  _sbSession={
    access_token:data.access_token,
    refresh_token:data.refresh_token,
    expires_at:Date.now()+(data.expires_in||3600)*1000,
    email:data.user?.email||email
  };
  localStorage.setItem(SB_SESSION_KEY,JSON.stringify(_sbSession));
  return _sbSession;
}

async function sbRefresh(){
  if(!_sbSession){try{_sbSession=JSON.parse(localStorage.getItem(SB_SESSION_KEY));}catch(e){}}
  if(!_sbSession)return null;
  if(Date.now()<_sbSession.expires_at-60000)return _sbSession;
  try{
    const res=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY},
      body:JSON.stringify({refresh_token:_sbSession.refresh_token})
    });
    if(!res.ok)throw new Error('Refresh failed');
    const data=await res.json();
    _sbSession={
      access_token:data.access_token,
      refresh_token:data.refresh_token,
      expires_at:Date.now()+(data.expires_in||3600)*1000,
      email:data.user?.email||_sbSession.email
    };
    localStorage.setItem(SB_SESSION_KEY,JSON.stringify(_sbSession));
    return _sbSession;
  }catch(e){
    _sbSession=null;localStorage.removeItem(SB_SESSION_KEY);return null;
  }
}

function sbLogout(){
  _sbSession=null;localStorage.removeItem(SB_SESSION_KEY);
}

async function sbLoadState(){
  const session=await sbRefresh();
  if(!session)return null;
  const res=await fetch(SB_URL+'/rest/v1/app_state?id=eq.1&select=data,rev',{
    headers:sbHeaders(session.access_token)
  });
  if(!res.ok)return null;
  const rows=await res.json();
  if(!rows.length)return null;
  const row=rows[0];
  const empty=!row.data||!Object.keys(row.data).length;
  return{data:empty?null:row.data,rev:row.rev||0};
}

// Version-checked save. The write only lands if nobody else has written since we
// last synced (rev match). On a conflict we fetch the latest committed state,
// re-apply our local diff on top of it, and retry — so concurrent edits by
// different people merge instead of overwriting each other.
async function sbPerformSave(){
  const cur=snapshotState();
  const diff=computeDiff(cur,_sbBaseline);
  if(!diff)return null;
  let body=cur,baseRev=_sbRev;
  for(let attempt=0;attempt<5;attempt++){
    const session=await sbRefresh();
    if(!session)throw new Error('Not signed in');
    const res=await fetch(SB_URL+'/rest/v1/app_state?id=eq.1&rev=eq.'+baseRev,{
      method:'PATCH',
      headers:{...sbHeaders(session.access_token),'Prefer':'return=representation'},
      body:JSON.stringify({data:body,rev:baseRev+1,updated_at:new Date().toISOString()})
    });
    if(!res.ok)throw new Error('Save failed: '+res.status);
    const rows=await res.json();
    if(rows.length){
      _sbRev=baseRev+1;
      _sbBaseline=body;
      return body===cur?false:body;
    }
    // Someone else wrote first — merge our diff onto their committed state.
    const r2=await fetch(SB_URL+'/rest/v1/app_state?id=eq.1&select=data,rev',{headers:sbHeaders(session.access_token)});
    if(!r2.ok)throw new Error('Reload failed: '+r2.status);
    const rr=await r2.json();
    if(!rr.length){
      // Fresh install with no seed row — create it instead of failing forever.
      const ins=await fetch(SB_URL+'/rest/v1/app_state',{
        method:'POST',
        headers:{...sbHeaders(session.access_token),'Prefer':'return=representation'},
        body:JSON.stringify({id:1,data:body,rev:baseRev+1,updated_at:new Date().toISOString()})
      });
      if(ins.ok){const irows=await ins.json();if(irows.length){_sbRev=irows[0].rev||baseRev+1;_sbBaseline=body;return body===cur?false:body;}}
      continue; // conflict: someone created it concurrently — merge normally next pass
    }
    baseRev=rr[0].rev||0;
    body=applyDiff(rr[0].data||{},diff);
  }
  throw new Error('Could not save after repeated conflicts');
}

function sbScheduleSave(){
  if(_sbSaveTimer)clearTimeout(_sbSaveTimer);
  _sbSaveTimer=setTimeout(sbFlush,1500);
}

async function sbFlush(){
  _sbSaveTimer=null;
  if(_sbSaving){_sbSaveQueued=true;return;}
  _sbSaving=true;updateSyncBadge('saving');
  try{
    const merged=await sbPerformSave();
    if(merged){adoptRemoteState(merged);if(!isTyping())render();}
    if(_sbSaveError){_sbSaveError=false;if(!isTyping())render();}
    updateSyncBadge('saved');
  }catch(e){
    console.error('Supabase save error:',e);
    if(!_sbSaveError){_sbSaveError=true;if(!isTyping())render();}
    updateSyncBadge('error');
  }finally{
    _sbSaving=false;
    if(_sbSaveQueued){_sbSaveQueued=false;sbScheduleSave();}
  }
}

// Immediate save (migration / first admin) — same merge machinery, no debounce.
async function sbSaveNow(){
  if(_sbSaveTimer){clearTimeout(_sbSaveTimer);_sbSaveTimer=null;}
  updateSyncBadge('saving');
  const merged=await sbPerformSave();
  if(merged)adoptRemoteState(merged);
  updateSyncBadge('saved');
  return merged;
}

// Background refresh: pick up other people's changes without a manual reload.
// Runs every 20s and on window focus. Skipped while a local save is pending —
// the save path does its own merge.
function sbStartPolling(){
  if(_sbPollTimer)return;
  _sbPollTimer=setInterval(sbCheckRemote,20000);
  window.addEventListener('focus',sbCheckRemote);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sbCheckRemote();});
}
async function sbCheckRemote(){
  if(!_appReady||_migrationNeeded||!st.currentUser)return;
  if(_sbSaving||_sbSaveTimer)return;
  try{
    const session=await sbRefresh();if(!session)return;
    const res=await fetch(SB_URL+'/rest/v1/app_state?id=eq.1&select=rev',{headers:sbHeaders(session.access_token)});
    if(!res.ok)return;
    const rows=await res.json();
    if(!rows.length||(rows[0].rev||0)===_sbRev)return;
    const r2=await fetch(SB_URL+'/rest/v1/app_state?id=eq.1&select=data,rev',{headers:sbHeaders(session.access_token)});
    if(!r2.ok)return;
    const rr=await r2.json();if(!rr.length)return;
    if(_sbSaving||_sbSaveTimer)return;
    _sbRev=rr[0].rev||0;
    adoptRemoteState(rr[0].data||{});
    _sbBaseline=snapshotState();
    if(!isTyping())render();
  }catch(e){}
}

function normCpd(e){
  if(!Array.isArray(e.riba)){
    e.riba=[];e.arb=Array.isArray(e.arb)?e.arb:[];
    for(const c of (e.categories||[])){
      if(c==='Fire and life safety (ARB mandatory)')e.arb.push('Fire and life safety');
      else if(c==='Sustainable architecture (ARB mandatory)'){e.riba.push('Sustainable architecture');e.arb.push('Environmental sustainability');}
      else if(CPD_RIBA.includes(c))e.riba.push(c);
    }
    delete e.categories;
  }
  if(!Array.isArray(e.arb))e.arb=[];
  if(!Array.isArray(e.pdbr))e.pdbr=[];
  if(!e.format)e.format='Structured';
  if(typeof e.evidence!=='string')e.evidence='';
  if(typeof e.applying!=='string')e.applying='';
  if(typeof e.nextSteps!=='string')e.nextSteps='';
  if(typeof e.activityType!=='string')e.activityType=(e.format==='Informal'?'Reading / self-directed':'Course / seminar');
  if(!Array.isArray(e.timeWrites))e.timeWrites=[];
  if(!e.reflections)e.reflections={};

// State normalisation — run after every load or remote adoption so data written
// by older builds (or another user's session) always has the fields this build expects.
function applyGuards(){
  if(typeof st.meta!=='object'||!st.meta||Array.isArray(st.meta))st.meta={};
  // One-time: the forecast colour label palette was replaced by the four-step
  // project likelihood colours (Joe, 15 Jul) — old colours cleared for a fresh start.
  if(!st.meta.projColorsV2){for(const p of st.projects||[])delete p.planColor;st.meta.projColorsV2=true;}
  // Legacy 'notes' (all Harvest fee history) -> feeNotes; projNotes is the new PM-visible field.
  for(const p of st.projects||[]){if(p.notes&&!p.feeNotes){p.feeNotes=p.notes;}if('notes'in p)delete p.notes;if(typeof p.feeNotes!=='string')p.feeNotes=p.feeNotes||'';if(typeof p.projNotes!=='string')p.projNotes=p.projNotes||'';ensureRibaStages(p);for(const ph of p.phases||[])if('likelihood'in ph&&![100,40,10,0].includes(ph.likelihood))delete ph.likelihood;normProjInvoices(p);}
  for(const e of st.cpd||[]){if(!Array.isArray(e.speakers))e.speakers=[];}
  ['users','projects','clients','planAssignments','milestones','leaveRows','nbRows','placeholders','planProjectRows','trash','cpd','cpdNotices','crmOrgs','crmContacts','crmInteractions','crmActions','crmLeads','crmEvents','leaveRequests','leaveClosures','leaveNotices'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=[];});
  st.leaveRequests.forEach(normLeaveReq);
  // Approved leave that was silently skipped over submitted weeks (old behaviour)
  // is re-applied: the new applyLeaveTime reopens those weeks and writes the hours.
  for(const r of st.leaveRequests){if(r.status==='approved'&&(r.timeSkipped||[]).length)applyLeaveTime(r);}
  // Migrate pre-request-ledger closures: withdraw their raw hours, back them with requests.
  for(const c of st.leaveClosures){
    if(st.leaveRequests.some(r=>r.closureId===c.id))continue;
    for(const w of (c.timeWrites||[])){const{wk,dayIdx}=dateToWkDay(parseISO(w.date));delete st.leave[lk(wk,'Annual leave',w.person,dayIdx)];}
    delete c.timeWrites;

  }
  // Project membership — one-time seed from existing timesheet rows so members
  // keep access to the projects they already log to; PMs/admins curate from there.
  if(typeof st.projectMembers!=='object'||Array.isArray(st.projectMembers)||!st.projectMembers){
    st.projectMembers={};
    for(const[person,projs]of Object.entries(st.userProjects||{})){
      const u=st.users.find(x=>x.name===person);
      if(!u||u.role==='admin'||u.role==='pm')continue;
      for(const pn of (projs||[])){
        if(!st.projectMembers[pn])st.projectMembers[pn]=[];
        if(!st.projectMembers[pn].includes(person))st.projectMembers[pn].push(person);
      }
    }
  }
  if(!Array.isArray(st.crmSectors)||!st.crmSectors.length)st.crmSectors=CRM_SECTORS_DEFAULT.slice();
  st.crmOrgs.forEach(normCrmOrg);st.crmContacts.forEach(normCrmContact);st.crmInteractions.forEach(normCrmInter);st.crmEvents.forEach(normCrmEvent);crmSyncClients();crmMigrateRoles();
  ['entries','forecasts','submissions','userProjects','userStages','tsWeekRows','cellNotes','overtime','nbOvertime','leave','leaveActive','nonBillable','nonBillableActive','planRows','planStageRows','leaveAllowances','leaveCarry','leaveYearNotes'].forEach(k=>{if(typeof st[k]!=='object'||Array.isArray(st[k]))st[k]={};});
  if(!st._projSort||typeof st._projSort!=='object')st._projSort={by:'code',dir:'asc'};
  if(typeof st._projAddOpen!=='boolean')st._projAddOpen=false;
  st.projects.forEach(p=>{(p.phases||[]).forEach(ph=>{if(typeof ph.active!=='boolean')ph.active=true;});});
  st.users.forEach(u=>{if(typeof u.weeklyHours!=='number'||u.weeklyHours<=0)u.weeklyHours=37.5;});
  const RATE_EPOCH='2000-01-01';
  st.users.forEach(u=>{
    if(!Array.isArray(u.rates))u.rates=[{from:RATE_EPOCH,rate:parseFloat(u.billable)||0}];
    if(!Array.isArray(u.costRates))u.costRates=[{from:RATE_EPOCH,rate:parseFloat(u.cost)||0}];
  });
  st.placeholders&&st.placeholders.forEach(p=>{
    if(!Array.isArray(p.rates))p.rates=[{from:RATE_EPOCH,rate:parseFloat(p.billable)||0}];
    if(!Array.isArray(p.costRates))p.costRates=[{from:RATE_EPOCH,rate:parseFloat(p.cost)||0}];
  });
  st.projects.forEach(p=>{
    if(!p.rateOverrides)p.rateOverrides={};if(p.contactId===undefined)p.contactId=null;
    if(!p.feeMode)p.feeMode=(parseFloat(p.importedBudget)>0&&!(p.phases||[]).some(ph=>parseFloat(ph.fee)>0))?'total':'stage';
    if(p.feeMode==='total'&&!(parseFloat(p.totalFee)>0)&&parseFloat(p.importedBudget)>0)p.totalFee=parseFloat(p.importedBudget);
  });
  st.cpd.forEach(normCpd);ensureCpdRefs();
  if(!Array.isArray(st.cpdArbTopics)||!st.cpdArbTopics.length)st.cpdArbTopics=['Fire and life safety','Environmental sustainability'];
  st.users.forEach(u=>{if(!u.role)u.role=u.isAdmin?'admin':'member';if(typeof u.selfApproveLeave!=='boolean')u.selfApproveLeave=false;if(typeof u.startDate!=='string')u.startDate='';if(typeof u.birthday!=='string')u.birthday='';});
  st.leaveRequests.forEach(r=>{if(!r.type)r.type='Annual leave';if(!r.halfDays||typeof r.halfDays!=='object')r.halfDays=(r.halfDay?{[r.startDate]:true}:{});delete r.halfDay;if(!Array.isArray(r.timeWrites))r.timeWrites=[];if(!Array.isArray(r.timeSkipped))r.timeSkipped=[];if(typeof r.adminNote!=='string')r.adminNote='';if(typeof r.adminActionDue!=='string')r.adminActionDue='';if(typeof r.adminActionDone!=='boolean')r.adminActionDone=false;if(!r.source)r.source='leave';});
  st.planAssignments.forEach(a=>{
    if(!a.startDate&&a.startWk){a.startDate=isoDate(planWkToDate(a.startWk));a.endDate=isoDate(addDays(planWkToDate(a.endWk),4));delete a.startWk;delete a.endWk;}
    if(typeof a.notes!=='string')a.notes='';
  });
}

async function init(){
  // Check for existing Supabase session
  const session=await sbRefresh();
  if(!session){_appReady=true;render();return;}

  // Load state from Supabase
  const loaded=await sbLoadState();
  if(loaded)_sbRev=loaded.rev;

  // If Supabase is empty, check for localStorage data to migrate
  if(!loaded||!loaded.data){
    const local=loadLocalState();
    if(local&&local.users&&local.users.length){
      // Safety net: preserve the original local data under a separate key so a
      // fresh start or failed migration can never destroy it.
      try{const raw=localStorage.getItem(STORE_KEY);if(raw&&!localStorage.getItem(STORE_KEY+'_premigration'))localStorage.setItem(STORE_KEY+'_premigration',raw);}catch(e){}
      _migrationNeeded=true;
      // Temporarily load local data so migration UI can show user info
      const{currentUser:_,...rest}=local;
      Object.assign(st,rest);
    }
    _appReady=true;render();return;
  }

  // Load the remote state (strip any stale currentUser that might have leaked in)
  const{currentUser:_,...rest}=loaded.data;
  Object.assign(st,rest);
  applyGuards();
  _sbBaseline=snapshotState();
  _undoBase=snapshotState();

  // Match auth email to app user
  const me=st.users.find(u=>u.email===session.email);
  if(me){st.currentUser=me.name;saveLocalUser(me.name);}
  else{
    // Fallback: try matching by last-known local user
    const localName=loadLocalUser();
    if(localName&&st.users.find(u=>u.name===localName)){st.currentUser=localName;}
  }

  _appReady=true;
  sbStartPolling();
  checkAppVersion(true);   // stamp our build if we're the newest; else flag stale
  render();
}

function save(){
  scheduleUndoRecord();
  try{localStorage.setItem(STORE_KEY,JSON.stringify(collectState()));}catch(e){}
  updateSyncBadge('pending');
  sbScheduleSave();
}

// ── Date helpers ──────────────────────────────────────────────────────────────
function getWkDates(off,nDays){const n=new Date(),d=n.getDay(),m=new Date(n);m.setDate(n.getDate()-(d===0?6:d-1)+(off||0)*7);const r=[];const count=nDays||5;for(let i=0;i<count;i++){const x=new Date(m);x.setDate(m.getDate()+i);r.push(x);}return r;}
function fmt(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function fmtLong(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function wkKey(days){const m=days[0];const n=Math.round((Date.UTC(m.getFullYear(),m.getMonth(),m.getDate())-Date.UTC(m.getFullYear(),0,1))/86400000);return`${m.getFullYear()}-W${String(Math.ceil((n+1)/7)).padStart(2,'0')}`;}
function wkKeyToDate(wk){return planWkToDate(wk);} // AUDIT 28 Jul: the old inline formula returned the PREVIOUS week's Monday except in years starting on a Monday — planWkToDate is the verified inverse of wkKey
function gbp(n){return'£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:0});}
function nowWk(){return wkKey(getWkDates(0));}
function canSubmit(wk){
  // Can submit current week or any past week
  const n=new Date(),d=wkKeyToDate(wk);
  // Week starts on Monday - allow submission from Monday of that week onwards
  return d<=n;
}
function isOverdue(wk){const n=new Date(),d=wkKeyToDate(wk),dl=new Date(d);dl.setDate(d.getDate()+8);return n>dl;}
