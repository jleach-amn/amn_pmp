// ── Custom Report builder ────────────────────────────────────────────────────
function computeTimeframeRange(tf,customStart,customEnd){
  const today=new Date();today.setHours(0,0,0,0);
  const mon=startOfWeek(today);
  if(tf==='alltime')return{start:new Date(2020,0,1),end:addDays(mon,6)};
  if(tf==='thisweek')return{start:mon,end:addDays(mon,6)};
  if(tf==='lastweek')return{start:addDays(mon,-7),end:addDays(mon,-1)};
  if(tf==='thismonth')return{start:new Date(today.getFullYear(),today.getMonth(),1),end:new Date(today.getFullYear(),today.getMonth()+1,0)};
  if(tf==='lastmonth')return{start:new Date(today.getFullYear(),today.getMonth()-1,1),end:new Date(today.getFullYear(),today.getMonth(),0)};
  // custom
  const s=customStart?parseISO(customStart):mon,e=customEnd?parseISO(customEnd):addDays(mon,6);
  return{start:s,end:e};
}
function customReportMatches(project,stage,person,proj,f,people){
  if(f.clients.length&&!(proj&&f.clients.includes(proj.clientId)))return false;
  if(f.projects.length&&!f.projects.includes(project))return false;
  if(f.stages.length&&!f.stages.includes(stage))return false;
  if(people.length&&!people.includes(person))return false;
  if(!f.includeInactive){
    const phase=proj?.phases?.find(ph=>ph.name===stage);
    if(phase&&phase.active===false)return false;
  }
  return true;
}
function runCustomReport(){
  const f=customReportFilters;
  const range=computeTimeframeRange(f.timeframe,f.startDate,f.endDate);
  const people=canManage()?f.people:[cur().name];
  const rows={};
  const days=Math.round((range.end-range.start)/86400000)+1;
  const granularity=days<=31?'day':days<=180?'week':'month';
  const bucketKey=(d)=>granularity==='day'?isoDate(d):granularity==='week'?wkKey([startOfWeek(d)]):`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const buckets={};
  for(const[k,v]of Object.entries(st.entries)){
    const parts=k.split('||');
    const wk=parts[0],project=parts[1],stage=parts[2],person=parts[3],dayIdx=parseInt(parts[4]);
    const entryDate=addDays(planWkToDate(wk),dayIdx%7);
    if(entryDate<range.start||entryDate>range.end)continue;
    const proj=st.projects.find(p=>p.name===project);
    if(!customReportMatches(project,stage,person,proj,f,people))continue;
    const hrs=parseFloat(v)||0;if(!hrs)continue;
    const dISO=isoDate(entryDate);
    const bRate=billableOn(person,project,dISO), cRate=costOn(person,dISO);
    const key=`${project}||${stage}||${person}`;
    if(!rows[key])rows[key]={project,stage,person,hours:0,billable:0,cost:0};
    rows[key].hours+=hrs;
    rows[key].billable+=hrs*bRate;
    rows[key].cost+=hrs*cRate;
    const bkey=bucketKey(entryDate);
    buckets[bkey]=(buckets[bkey]||0)+hrs*bRate;
  }
  customReportResult=Object.values(rows).sort((a,b)=>a.project.localeCompare(b.project)||a.stage.localeCompare(b.stage)||a.person.localeCompare(b.person));
  // Build a continuous bucket sequence across the whole range (including empty periods)
  // so the chart shows a proper timeline rather than just the dates with activity.
  const bucketLabel=(key)=>{
    if(granularity==='day')return fmt(parseISO(key));
    if(granularity==='week')return fmt(planWkToDate(key));
    const[y,m]=key.split('-');return new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
  };
  const keys=[];
  let d=new Date(range.start);
  while(d<=range.end){const key=bucketKey(d);if(keys[keys.length-1]!==key)keys.push(key);d=addDays(d,1);}
  let cum=0;
  const perPeriod=keys.map(k=>buckets[k]||0);
  const cumulative=perPeriod.map(v=>{cum+=v;return cum;});
  customReportChart={keys,labels:keys.map(bucketLabel),perPeriod,cumulative,granularity};
}
window.crTimeframeChange=function(v){customReportFilters.timeframe=v;render();}

  const f=customReportFilters;

// ── Cascading filter options — each dropdown only offers values that are still
// reachable given what's already selected elsewhere. Client/Project/Stage narrow
// each other structurally (via project.clientId and project.phases); Teammates
// narrows (and is narrowed by) all three via who has actually logged time against them.
function crProjectsMatchingClientsStagesPeople(excludeStages){
  const f=customReportFilters;
  let projects=st.projects;
  if(f.clients.length)projects=projects.filter(p=>f.clients.includes(p.clientId));
  if(!excludeStages&&f.stages.length)projects=projects.filter(p=>(p.phases||[]).some(ph=>f.stages.includes(ph.name)));
  if(f.people.length){
    const names=new Set();
    for(const k of Object.keys(st.entries)){const parts=k.split('||');if(f.people.includes(parts[3]))names.add(parts[1]);}
    projects=projects.filter(p=>names.has(p.name));
  }
  return projects;
}
function crClientOptions(){
  const f=customReportFilters;
  if(!f.projects.length&&!f.stages.length&&!f.people.length)return st.clients.map(c=>({value:c.id,label:c.company}));
  let projects=st.projects;
  if(f.projects.length)projects=projects.filter(p=>f.projects.includes(p.name));
  if(f.stages.length)projects=projects.filter(p=>(p.phases||[]).some(ph=>f.stages.includes(ph.name)));
  if(f.people.length){
    const names=new Set();
    for(const k of Object.keys(st.entries)){const parts=k.split('||');if(f.people.includes(parts[3]))names.add(parts[1]);}
    projects=projects.filter(p=>names.has(p.name));
  }
  const ids=new Set(projects.map(p=>p.clientId).filter(Boolean));
  return st.clients.filter(c=>ids.has(c.id)).map(c=>({value:c.id,label:c.company}));
}
function crProjectOptions(){
  const projects=crProjectsMatchingClientsStagesPeople(false);
  return projects.map(p=>({value:p.name,label:(p.code?p.code+' — ':'')+p.name}));
}
function crStageOptions(){
  const projects=crProjectsMatchingClientsStagesPeople(true);
  let stages=[...new Set(projects.flatMap(p=>(p.phases||[]).map(ph=>ph.name)))].sort();
  const f=customReportFilters;
  if(f.people.length){
    const names=new Set();
    for(const k of Object.keys(st.entries)){const parts=k.split('||');if(f.people.includes(parts[3]))names.add(parts[2]);}
    stages=stages.filter(s=>names.has(s));
  }
  return stages.map(s=>({value:s,label:s}));
}
function crPeopleOptions(){
  const f=customReportFilters;
  if(!f.clients.length&&!f.projects.length&&!f.stages.length)return st.users.map(u=>({value:u.name,label:u.name}));
  const names=new Set();
  for(const k of Object.keys(st.entries)){
    const parts=k.split('||');
    const project=parts[1],stage=parts[2],person=parts[3];
    const proj=st.projects.find(p=>p.name===project);
    if(f.clients.length&&!(proj&&f.clients.includes(proj.clientId)))continue;
    if(f.projects.length&&!f.projects.includes(project))continue;
    if(f.stages.length&&!f.stages.includes(stage))continue;
    names.add(person);
  }
  return st.users.filter(u=>names.has(u.name)).map(u=>({value:u.name,label:u.name}));
}
// After any one filter changes, drop any selections in the OTHER filters that are
// no longer reachable, so chips never sit there silently guaranteeing zero results.
function crPruneInvalidSelections(){
  const f=customReportFilters;
  const validClients=new Set(crClientOptions().map(o=>o.value));
  const validProjects=new Set(crProjectOptions().map(o=>o.value));
  const validStages=new Set(crStageOptions().map(o=>o.value));
  const validPeople=new Set(crPeopleOptions().map(o=>o.value));
  f.clients=f.clients.filter(v=>validClients.has(v));
  f.projects=f.projects.filter(v=>validProjects.has(v));
  f.stages=f.stages.filter(v=>validStages.has(v));
  f.people=f.people.filter(v=>validPeople.has(v));
}

// ── Team Utilization — billable hours as a share of all hours actually worked ──
// (billable + non-billable; leave is excluded from both sides since it isn't worked time).
function computeTeamUtilization(){
  const f=utilFilters;
  const range=computeTimeframeRange(f.timeframe,f.startDate,f.endDate);
  const targetPeople=canManage()?(f.people.length?f.people:st.users.map(u=>u.name)):[cur().name];
  let weekdayCount=0;{let d=new Date(range.start);while(d<=range.end){if(!isWeekendDate(d))weekdayCount++;d=addDays(d,1);}}
  const rows=targetPeople.map(name=>{
    const u=findPerson(name);
    let billable=0,nonbillable=0,leave=0;
    for(const[k,v]of Object.entries(st.entries)){
      const parts=k.split('||');if(parts[3]!==name)continue;
      const entryDate=addDays(planWkToDate(parts[0]),parseInt(parts[4])%7);
      if(entryDate<range.start||entryDate>range.end)continue;
      billable+=parseFloat(v)||0;
    }
    for(const[k,v]of Object.entries(st.nonBillable)){
      const parts=k.split('||');if(parts[2]!==name)continue;
      const entryDate=addDays(planWkToDate(parts[0]),parseInt(parts[3]));
      if(entryDate<range.start||entryDate>range.end)continue;
      nonbillable+=parseFloat(v)||0;
    }
    for(const[k,v]of Object.entries(st.leave)){
      const parts=k.split('||');if(parts[2]!==name)continue;
      const entryDate=addDays(planWkToDate(parts[0]),parseInt(parts[3]));
      if(entryDate<range.start||entryDate>range.end)continue;
      leave+=parseFloat(v)||0;
    }
    const worked=billable+nonbillable;
    const totalTime=worked+leave;
    const utilPct=totalTime>0?Math.round(billable/totalTime*100):null;
    const capacity=((u?.weeklyHours||37.5)/5)*weekdayCount;
    const capPct=capacity>0?Math.round(billable/capacity*100):null;
    return{name,billable,nonbillable,leave,worked,totalTime,utilPct,capacity,capPct};
  });
  return rows.sort((a,b)=>b.billable-a.billable);
}

window.logLeave=function(el){
  const d=parseInt(el.dataset.d),wk=el.dataset.wk,type=el.dataset.lt,person=el.dataset.pe;
  if(type==='Bank Holiday'){sL(wk,type,person,d,el.value);render();return;}
  const dateISO=isoDate(addDays(planWkToDate(wk),d));
  const v=parseFloat(el.value)||0;
  const covering=approvedReqCovering(person,dateISO,type);
  const own=person===st.currentUser;
  if(v===0){
    if(covering){undoToast('This day is part of an approved leave request — cancel it from the Leave page instead.');render();return;}
    sL(wk,type,person,d,0);render();return;
  }
  if(covering){undoToast('Leave for this day is already approved. To change it, cancel the request on the Leave page and re-request.');render();return;}
  if(!own&&isAdmin()){
    // Admin recording on someone's behalf — books immediately + notice to check.
    const half=v<=dailyHours(person)/2;
    const out=createLeaveRequest(person,type,dateISO,dateISO,half?{[dateISO]:true}:{},'Recorded via timesheet','admin');
    if(out.error)undoToast(out.error);
    render();return;
  }
  if(!own){render();return;}
  // Own timesheet — leave entries route through a request (past dates allowed).
  const half=v<=dailyHours(person)/2;
  const out=createLeaveRequest(person,type,dateISO,dateISO,half?{[dateISO]:true}:{},'Entered via timesheet','timesheet');
  if(out.error){undoToast(out.error);render();return;}
  if(out.request.status==='pending')undoToast('Leave request created for '+type+' on '+fmt(parseISO(dateISO))+' — the hours will appear once it\'s approved. The week can\'t be submitted while a request is pending.');
  render();
}

function projLabel(p){return (p.code?p.code+' — ':'')+(p.name);}
function resolveProjInput(val,pool){
  if(!val)return null;
  const v=val.trim();if(!v)return null;
  // exact match on full label
  let m=pool.find(p=>projLabel(p)===v);if(m)return m;
  // match on name only (case-insensitive)
  m=pool.find(p=>p.name.toLowerCase()===v.toLowerCase());if(m)return m;
  // match on code only (case-insensitive)
  m=pool.find(p=>p.code&&p.code.toLowerCase()===v.toLowerCase());if(m)return m;
  return null;
}

window.copyFromLastWk=function(withHours){
  const me=viewingUser||cur().name;
  const curWk=wkKey(getWkDates(wkOff));
  const prevWk=wkKey(getWkDates(wkOff-1));
  // Projects + stages from previous week
  const prevWkProjects=new Set();
  for(const k of Object.keys(st.entries)){const[w,pp,,person]=k.split('||');if(w===prevWk&&person===me)prevWkProjects.add(pp);}
  for(const p of prevWkProjects){
    if(!st.userProjects[me])st.userProjects[me]=[];
    if(!st.userProjects[me].includes(p))st.userProjects[me].push(p);
    const prevStageSet=new Set(getUserStages(me,p));
    for(const k of Object.keys(st.entries)){const parts=k.split('||');if(parts[0]===prevWk&&parts[1]===p&&parts[3]===me)prevStageSet.add(parts[2]);}
    if(!st.userStages[me])st.userStages[me]={};
    if(!st.userStages[me][p]||!st.userStages[me][p].length)st.userStages[me][p]=[...prevStageSet];
  }
  // Leave types
  const prevLeave=getLeaveActive(prevWk,me);
  for(const t of prevLeave)addLeaveActive(curWk,me,t);
  // NB types
  const prevNB=getNBActive(prevWk,me);
  for(const t of prevNB)addNBActive(curWk,me,t);
  // OT flags (project stage OT)
  for(const k of Object.keys(st.overtime)){
    const parts=k.split('||');
    if(parts[0]===prevWk&&parts[3]===me){const nk=`${curWk}||${parts[1]}||${parts[2]}||${parts[3]}`;if(!st.overtime[nk])st.overtime[nk]=true;}
  }
  // NB OT flags
  for(const k of Object.keys(st.nbOvertime)){
    const[w,type,person]=k.split('||');
    if(w===prevWk&&person===me)setNBOT(curWk,type,me,true);
  }
  if(withHours){
    // Project hours (all 14 day indices)
    for(const[k,v]of Object.entries(st.entries)){
      const parts=k.split('||');
      if(parts[0]===prevWk&&parts[3]===me){const nk=`${curWk}||${parts[1]}||${parts[2]}||${parts[3]}||${parts[4]}`;if(!st.entries[nk])st.entries[nk]=v;}
    }
    // Leave hours
    for(const[k,v]of Object.entries(st.leave)){
      const[w,type,person,day]=k.split('||');
      if(w===prevWk&&person===me){const nk=`${curWk}||${type}||${person}||${day}`;if(!st.leave[nk])st.leave[nk]=v;}
    }
    // NB hours (all 14 day indices)
    for(const[k,v]of Object.entries(st.nonBillable)){
      const parts=k.split('||');
      if(parts[0]===prevWk&&parts[2]===me){const nk=`${curWk}||${parts[1]}||${parts[2]}||${parts[3]}`;if(!st.nonBillable[nk])st.nonBillable[nk]=v;}
    }
  }
  save();render();
}

window.rmStageFromTS=function(wk,projName,stageName,person){
  // A row with hours in THIS week can never be removed from it — clear the
  // hours first. (Hours in other weeks are irrelevant: those weeks derive
  // their own rows and are untouched by this removal.)
  if(entryStagesForWeek(wk,person,projName).has(stageName)){
    undoToast('Hours are logged against this stage this week — clear them before removing the row.');
    return;
  }
  if(isPastWk(wk)){
    // Past week: this week's extras only
    const ex=tsWeekExtra(person,wk);
    const v={projects:[...ex.projects],stages:{...ex.stages}};
    v.stages[projName]=(v.stages[projName]||[]).filter(x=>x!==stageName);
    const projStillBacked=entryProjectsForWeek(wk,person).has(projName)||(v.stages[projName]||[]).length;
    if(!projStillBacked)v.projects=v.projects.filter(n=>n!==projName);
    setTsWeekExtra(person,wk,v);
  }else{
    // Current/future: edits the live palette; past weeks are unaffected
    const cur2=getUserStages(person,projName).filter(x=>x!==stageName);
    setUserStages(person,projName,cur2);
    if(!cur2.length&&!entryProjectsForWeek(wk,person).has(projName)){
      if(st.userProjects[person])st.userProjects[person]=st.userProjects[person].filter(n=>n!==projName);
    }
  }
  save();render();
}

// Migrates every store that uses the project name as (part of) its key — compound
// key maps, the planner, milestones, and per-user lists. Mirrors renamePersonEverywhere.
function renameProjectEverywhere(oldName,name){
  ['entries','forecasts','cellNotes','overtime'].forEach(k=>{const newObj={};for(const[key,v]of Object.entries(st[k])){const parts=key.split('||');if(parts[1]===oldName)parts[1]=name;newObj[parts.join('||')]=v;}st[k]=newObj;});
  Object.keys(st.userProjects).forEach(u=>{st.userProjects[u]=(st.userProjects[u]||[]).map(n=>n===oldName?name:n);});
  Object.keys(st.userStages).forEach(u=>{const m=st.userStages[u];if(m&&m[oldName]!==undefined){m[name]=m[oldName];delete m[oldName];}});
  st.planAssignments.forEach(a=>{if(a.project===oldName)a.project=name;});
  st.milestones.forEach(m=>{if(m.project===oldName)m.project=name;});
  const newRows={};for(const[k,v]of Object.entries(st.planRows)){const parts=k.split('||');if(parts[0]===oldName)parts[0]=name;newRows[parts.join('||')]=v;}st.planRows=newRows;
  if(st.planStageRows&&st.planStageRows[oldName]!==undefined){st.planStageRows[name]=st.planStageRows[oldName];delete st.planStageRows[oldName];}
  st.planProjectRows=(st.planProjectRows||[]).map(n=>n===oldName?name:n);
  if(planExpanded.has(oldName)){planExpanded.delete(oldName);planExpanded.add(name);}
  if(healthProj===oldName)healthProj=name;
}

// Shared markup for the hours-bar status panel (used at render and by refreshHrsUI)
function hrsStatusHTML(remaining,target,hrsOk,hrsOver){
  return hrsOk?`<span style="color:var(--ok);font-weight:700;font-size:13px">✓ Complete</span>`
    :hrsOver?`<span style="color:var(--danger);font-weight:700;font-size:12px">⚠ ${Math.abs(remaining).toFixed(1)}h over</span><span style="font-size:11px;color:var(--dkgrey)">Use overtime for extra hours</span>`
    :`<span style="color:var(--warn);font-weight:700;font-size:12px">${remaining.toFixed(1)}h to go</span><span style="font-size:11px;color:var(--dkgrey)">of ${target}h required</span>`;
}
// Live refresh of the hours bar + submit/resubmit gating after in-place project-cell
// edits (logT deliberately avoids a full render() so focus survives tabbing across a
// row — but the totals bar and Submit/Resubmit button must not go stale with it).
function refreshHrsUI(wk,person){
  const u=st.users.find(x=>x.name===person);if(!u)return;
  const target=u.weeklyHours||37.5;
  const projHrs=wkProjHrs(wk,person),leaveHrs=wkLeaveHrs(wk,person),nbHrs=wkNBHrs(wk,person);
  const totalHrs=projHrs+leaveHrs+nbHrs,remaining=target-totalHrs;
  const hrsOk=Math.abs(remaining)<0.01,hrsOver=remaining<-0.01;
  const set=(id,txt)=>{const el=document.getElementById(id);if(el)el.textContent=txt;};
  set('hrs-proj',projHrs.toFixed(1)+'h');
  set('hrs-leave',leaveHrs>0?leaveHrs.toFixed(1)+'h':'—');
  set('hrs-nb',nbHrs>0?nbHrs.toFixed(1)+'h':'—');
  const tot=document.getElementById('hrs-total');
  if(tot){tot.textContent=totalHrs.toFixed(1)+'h';tot.className='hrs-segment-val '+(hrsOk?'ok':hrsOver?'danger':'');}
  const stat=document.getElementById('hrs-status');
  if(stat)stat.innerHTML=hrsStatusHTML(remaining,target,hrsOk,hrsOver);
  const blockMsg=remaining>0.01?`⚠ ${remaining.toFixed(1)}h short of ${target}h — add more hours before submitting`:`⚠ ${Math.abs(remaining).toFixed(1)}h over ${target}h — move extra hours to overtime rows`;
  const msg=document.getElementById('sub-hrs-msg');
  if(msg){msg.innerHTML=hrsOk?'':blockMsg;msg.style.display=hrsOk?'none':'';}
  const okNote=document.getElementById('sub-hrs-ok');
  if(okNote)okNote.style.display=hrsOk?'':'none';
  const overDays=wkDaysOver(person,wk);
  let sumT=0;
  for(let i=0;i<7;i++){
    const c=document.getElementById('ts-dt-'+i);if(!c)continue;
    const t=dayTotalHrs(wk,person,i);sumT+=t;const over=t>DAY_MAX+0.001;
    c.textContent=t?t.toFixed(1)+(over?' ⚠':''):'';c.className=over?'over':'';
  }
  const sumEl=document.getElementById('ts-dt-sum');if(sumEl)sumEl.textContent=sumT?sumT.toFixed(1):'';
  if(overDays.length&&msg){msg.innerHTML=`⚠ ${overDays.map(i=>['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]).join(', ')} ${overDays.length===1?'has':'have'} more than ${DAY_MAX}h — move the extra hours to an overtime row`;msg.style.display='';if(okNote)okNote.style.display='none';}
  const btn=document.getElementById('sub-hrs-btn');
  if(btn)btn.disabled=!hrsOk||overDays.length>0;
}

// ── Project company picker ────────────────────────────────────────────────────
// One list of every company the practice knows, so a company added in the CRM
// is selectable here immediately. Existing billing clients come first; the rest
// follow in a second group and are promoted to clients when the project saves.
// Values in that second group are prefixed "org:" — resolveProjClientId() turns
// one back into a real client id.
function projClientOptions(selected){
  selected=selected||'';
  const clients=st.clients.slice().sort((a,b)=>String(a.company||'').localeCompare(String(b.company||''),'en',{sensitivity:'base'}));
  const linked=new Set(st.crmOrgs.filter(o=>o.clientId&&st.clients.some(c=>c.id===o.clientId)).map(o=>o.clientId));
  const others=st.crmOrgs.filter(o=>!(o.clientId&&st.clients.some(c=>c.id===o.clientId)))
    .slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'en',{sensitivity:'base'}));
  let h=`<option value="">— none —</option>`;
  if(clients.length)h+=`<optgroup label="Clients">${clients.map(c=>`<option value="${escAttr(c.id)}"${selected===c.id?' selected':''}>${escAttr(c.company||'')}</option>`).join('')}</optgroup>`;
  if(others.length)h+=`<optgroup label="Not yet a client — will be added">${others.map(o=>`<option value="org:${escAttr(o.id)}"${selected==='org:'+o.id?' selected':''}>${escAttr(o.name||'')}</option>`).join('')}</optgroup>`;
  return h;
}
// "org:<id>" → a real client id, promoting the company if this is its first
// project. Anything else passes straight through.
function resolveProjClientId(v){
  v=v||'';
  if(!v)return null;
  if(v.slice(0,4)!=='org:')return v;
  const o=crmOrg(v.slice(4));
  if(!o)return null;
  return crmEnsureClientForOrg(o.id)||null;
}
// The value a given contact's company should hold in the picker, or '' if the
// contact has no company.
function projClientValueForContact(ct){
  const o=ct&&ct.orgId?crmOrg(ct.orgId):null;
  if(!o)return '';
  return (o.clientId&&st.clients.some(c=>c.id===o.clientId))?o.clientId:'org:'+o.id;
}
// Picking a contact keeps the Company box honest — a contact's own company
// wins. Pure DOM: both project forms hold unsaved typing, so never render().
window.projContactPick=function(sel,clientSelId,hintId){
  const hint=document.getElementById(hintId);
  const cs=document.getElementById(clientSelId);
  if(hint)hint.textContent='';
  if(!cs||!sel)return;
  const ct=sel.value?crmContact(sel.value):null;
  if(!ct)return;
  const want=projClientValueForContact(ct);
  if(!want||cs.value===want)return;
  const had=cs.value;
  const opts=cs.options?[...cs.options]:[];
  if(opts.length&&!opts.some(o=>o.value===want))return;
  cs.value=want;
  const o=crmOrg(ct.orgId);
  if(hint&&o)hint.textContent=had?`Company switched to ${o.name} — ${ct.name}'s company.`:`Company set to ${o.name}.`;
}

// Archive / Deactivate / Delete — admin-only, type-to-confirm, fully recoverable.
// Archive (projects) and Deactivate (team members) are lightweight toggles that just
// hide something from active lists while keeping every bit of its data live and in
// place. Delete is heavier: it also sweeps up everything directly tied to the item
// (timesheet entries, forecasts, notes, milestones, etc.) into one bundle in the
// Deleted Items trash, so the whole thing — item plus data — can be restored as one
// unit, or permanently purged once you're sure. Nothing here is admin-restricted at
// the data layer; the UI simply never exposes these actions to non-admins.
// ══════════════════════════════════════════════════════════════════════════════

// ── Generic type-to-confirm modal ──────────────────────────────────────────────
function openConfirmModal(title,message,confirmWord,onConfirmFn,args){
  confirmModalState={title,message,confirmWord,onConfirmFn,args:args||[]};
  renderConfirmModal();
}
window.closeConfirmModal=function(){confirmModalState=null;renderConfirmModal();}
window.doValidateConfirmInput=function(){
  const input=document.getElementById('confirm-modal-input'),btn=document.getElementById('confirm-modal-btn');
  if(!input||!btn||!confirmModalState)return;
  const match=input.value.trim().toLowerCase()===confirmModalState.confirmWord.toLowerCase();
  btn.disabled=!match;btn.style.opacity=match?'1':'.4';
}
window.doConfirmModalSubmit=function(){
  const input=document.getElementById('confirm-modal-input');

  if(input.value.trim().toLowerCase()!==confirmModalState.confirmWord.toLowerCase())return;

  confirmModalState=null;renderConfirmModal();
  window[onConfirmFn](...args);
}

window.closeRateModal=function(){rateModalState=null;renderRateModal();}
function rateModalList(){
  const s=rateModalState;if(!s)return null;
  if(s.scope==='billable'){const u=st.users[s.userIdx];if(!Array.isArray(u.rates))u.rates=[{from:RATE_EPOCH,rate:parseFloat(u.billable)||0}];return u.rates;}
  if(s.scope==='cost'){const u=st.users[s.userIdx];if(!Array.isArray(u.costRates))u.costRates=[{from:RATE_EPOCH,rate:parseFloat(u.cost)||0}];return u.costRates;}
  if(s.scope==='override'){const p=st.projects[s.projIdx];if(!p.rateOverrides)p.rateOverrides={};if(!Array.isArray(p.rateOverrides[s.person]))p.rateOverrides[s.person]=[];return p.rateOverrides[s.person];}

window.rateModalAdd=function(){

// How many already-logged hours does the rate entry at `idx` govern? Used to make
// the "you are rewriting history" warning concrete.
function rateEntryAffectedHours(idx){
  const s=rateModalState;if(!s)return 0;
  const list=rateModalList();
  const sorted=list.slice().sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0);
  const entry=list[idx];const pos=sorted.indexOf(entry);
  const from=entry.from, to=pos+1<sorted.length?sorted[pos+1].from:'9999-12-31';
  const person=s.scope==='override'?s.person:st.users[s.userIdx].name;
  const proj=s.scope==='override'?st.projects[s.projIdx].name:null;
  let hrs=0;
  for(const[k,v]of Object.entries(st.entries)){
    const[wk,p,,per,day]=k.split('||');
    if(per!==person)continue;
    if(proj&&p!==proj)continue;
    if(s.scope==='cost'){/* cost applies to all entries */}
    const d=dateForWk(wk,day);
    if(d>=from&&d<to)hrs+=parseFloat(v)||0;
  }
  return Math.round(hrs*10)/10;
}
// Edit a historic rate entry (rate or effective date). Changes that re-value
// already-logged hours require an in-modal confirmation (native confirm() is
// blocked in sandboxed previews, so the warning renders inside the modal).
function applyRateChange(idx,field,value){
  const list=rateModalList();const entry=list[idx];if(!entry)return;
  if(field==='rate')entry.rate=parseFloat(value);
  else if(field==='from')entry.from=value;
  else if(field==='remove')list.splice(idx,1);
  if(field==='remove'&&rateModalState.scope==='override'&&list.length===0)delete st.projects[rateModalState.projIdx].rateOverrides[rateModalState.person];
  list.sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0);
  syncCurrentRate();save();render();
}
window.rateModalEdit=function(idx,field,value){
  const s=rateModalState;if(!s)return;
  const list=rateModalList();const entry=list[idx];if(!entry)return;
  s.notice='';s.pending=null;
  const today=isoDate(new Date());
  if(field==='rate'){
    const r=parseFloat(value);
    if(isNaN(r)||r<0){s.notice='Enter a valid rate.';renderRateModal();return;}
    if(r===entry.rate){renderRateModal();return;}
    if(entry.from<=today){
      const hrs=rateEntryAffectedHours(idx);
      s.pending={idx,field:'rate',value:r,msg:`This rate applies from ${entry.from===RATE_EPOCH?'the start':fmt(parseISO(entry.from))}. `+
        (hrs>0?`<b>${hrs}h of already-logged time will be re-valued at £${r}/hr</b>, `:`Any time logged in that period will be re-valued, `)+
        `retroactively changing reported spend and profitability. Only do this to correct a rate that was entered wrongly.`};
      renderRateModal();return;
    }
    applyRateChange(idx,'rate',r);renderRateModal();
  } else if(field==='from'){
    if(!value){s.notice='Choose a date.';renderRateModal();return;}
    if(value===entry.from){renderRateModal();return;}
    if(list.some((e,i)=>i!==idx&&e.from===value)){s.notice='Another rate already starts on that date.';renderRateModal();return;}
    if(entry.from<=today||value<=today){
      const hrs=rateEntryAffectedHours(idx);
      s.pending={idx,field:'from',value,msg:`Moving this rate's effective date changes which past hours it applies to`+(hrs>0?` — <b>it currently governs ${hrs}h of logged time</b>`:``)+
        `. Reported spend and profitability will change retroactively. Only do this to correct a mistake.`};
      renderRateModal();return;
    }
    applyRateChange(idx,'from',value);renderRateModal();
  }
}
window.rateModalApplyPending=function(){
  const s=rateModalState;if(!s||!s.pending)return;
  const p=s.pending;s.pending=null;s.notice='';
  applyRateChange(p.idx,p.field,p.value);
  renderRateModal();
}
window.rateModalCancelPending=function(){
  const s=rateModalState;if(!s)return;

  renderRateModal();
}
window.rateModalRemove=function(idx){
  const s=rateModalState;if(!s)return;
  s.notice='';s.pending=null;
  const list=rateModalList();
  if(list.length<=1&&s.scope!=='override'){s.notice='A person must have at least one rate. Edit the existing one instead.';renderRateModal();return;}
  const entry=list[idx];
  if(entry&&entry.from<=isoDate(new Date())){
    const hrs=rateEntryAffectedHours(idx);
    s.pending={idx,field:'remove',value:null,msg:`Removing this rate re-values the period it covered`+(hrs>0?` — <b>${hrs}h of logged time will fall back to the previous rate</b>`:``)+
      `, retroactively changing reported spend and profitability.`};
    renderRateModal();return;
  }
  applyRateChange(idx,'remove',null);
  renderRateModal();
}
// Keep the flat u.billable / u.cost mirrors equal to the latest dated rate so any

}

// ── Delete (soft) — sweeps everything directly tied to the item into one trash entry
function pushTrash(kind,label,payload){
  st.trash=st.trash||[];
  st.trash.push({id:'tr'+Date.now()+Math.floor(Math.random()*10000),kind,label,deletedAt:new Date().toISOString(),deletedBy:cur()?.name||'',payload});
  save();
}
function sweepProjectData(name){
  const b={entries:{},forecasts:{},cellNotes:{},overtime:{},planAssignments:[],planRows:{},milestones:[]};
  for(const k of Object.keys(st.entries))if(k.split('||')[1]===name){b.entries[k]=st.entries[k];delete st.entries[k];}
  for(const k of Object.keys(st.forecasts))if(k.split('||')[1]===name){b.forecasts[k]=st.forecasts[k];delete st.forecasts[k];}
  for(const k of Object.keys(st.cellNotes))if(k.split('||')[1]===name){b.cellNotes[k]=st.cellNotes[k];delete st.cellNotes[k];}
  for(const k of Object.keys(st.overtime))if(k.split('||')[1]===name){b.overtime[k]=st.overtime[k];delete st.overtime[k];}
  b.planAssignments=st.planAssignments.filter(a=>a.project===name);
  st.planAssignments=st.planAssignments.filter(a=>a.project!==name);
  for(const k of Object.keys(st.planRows))if(k.startsWith(name+'||')){b.planRows[k]=st.planRows[k];delete st.planRows[k];}
  b.milestones=st.milestones.filter(m=>m.project===name);
  st.milestones=st.milestones.filter(m=>m.project!==name);
  st.planProjectRows=(st.planProjectRows||[]).filter(p=>p!==name);
  if(st.planStageRows)delete st.planStageRows[name];
  return b;
}
function restoreProjectData(b){
  Object.assign(st.entries,b.entries||{});Object.assign(st.forecasts,b.forecasts||{});Object.assign(st.cellNotes,b.cellNotes||{});Object.assign(st.overtime,b.overtime||{});
  st.planAssignments.push(...(b.planAssignments||[]));
  Object.assign(st.planRows,b.planRows||{});
  st.milestones.push(...(b.milestones||[]));
}
window.triggerDeleteProject=function(name){
  const p=st.projects.find(x=>x.name===name);if(!p)return;
  openConfirmModal('Delete project',`Delete "${escAttr((p.code?p.code+' ':'')+name)}"? This removes it — and all its logged time, forecasts, milestones and notes — from active use. It'll sit in Deleted Items until you restore it or empty the trash, so it isn't gone for good just yet.`,'delete','doDeleteProject',[name]);
}
window.doDeleteProject=function(name){
  const idx=st.projects.findIndex(x=>x.name===name);if(idx<0)return;
  const p=st.projects[idx];
  const payload={project:p,data:sweepProjectData(name)};
  st.projects.splice(idx,1);
  pushTrash('project',(p.code?p.code+' ':'')+p.name,payload);
  planExpanded.delete(name);
  render();
}

  if(st.projects.find(p=>p.name===entry.payload.project.name))return false;

}

// ── Delete (soft) — a single stage within a project ────────────────────────────
function sweepStageData(project,stage){
  const b={entries:{},forecasts:{},cellNotes:{},overtime:{},planAssignments:[],milestones:[],planRowsKey:null,planRowsValue:null};
  const match=(k)=>{const p=k.split('||');return p[1]===project&&p[2]===stage;};
  for(const k of Object.keys(st.entries))if(match(k)){b.entries[k]=st.entries[k];delete st.entries[k];}
  for(const k of Object.keys(st.forecasts))if(match(k)){b.forecasts[k]=st.forecasts[k];delete st.forecasts[k];}
  for(const k of Object.keys(st.cellNotes))if(match(k)){b.cellNotes[k]=st.cellNotes[k];delete st.cellNotes[k];}
  for(const k of Object.keys(st.overtime))if(match(k)){b.overtime[k]=st.overtime[k];delete st.overtime[k];}
  b.planAssignments=st.planAssignments.filter(a=>a.project===project&&a.stage===stage);
  st.planAssignments=st.planAssignments.filter(a=>!(a.project===project&&a.stage===stage));
  b.milestones=st.milestones.filter(m=>m.project===project&&m.stage===stage);
  st.milestones=st.milestones.filter(m=>!(m.project===project&&m.stage===stage));
  const prk=planRowKey(project,stage);

  if(st.planStageRows&&st.planStageRows[project])st.planStageRows[project]=st.planStageRows[project].filter(s=>s!==stage);
  return b;
}

window.doExport=function(){
  const q2=(x)=>String(x==null?'':x).replace(/"/g,'""');
  let csv='Week,Project,Client,Stage,Person,Mon,Tue,Wed,Thu,Fri,Sat,Sun,OT Mon,OT Tue,OT Wed,OT Thu,OT Fri,OT Sat,OT Sun,Reg hours,OT hours,Total hours,Billable rate,Fee value,Type,Notes\n';
  const weeks=[...new Set([...Object.keys(st.entries),...Object.keys(st.forecasts)].map(k=>k.split('||')[0]))];
  for(const wk of weeks.sort()){
    for(const proj of st.projects){
      const client=st.clients.find(c=>c.id===proj.clientId);
      const phases=proj.phases?.length?proj.phases:[{name:'(no stage)'}];
      for(const ph of phases){
        for(const user of st.users){
          // Actual entries — collect all 14 day indices
          const dayVals=[];
          let regH=0,otH=0;
          for(let i=0;i<14;i++){const v=parseFloat(gE(wk,proj.name,ph.name,user.name,i))||0;dayVals.push(v);if(i<7)regH+=v;else otH+=v;}
          const tot=regH+otH;
          if(tot>0){
            const noteParts=[];for(let i=0;i<14;i++){const n=getCellNote(wk,proj.name,ph.name,user.name,i);if(n)noteParts.push(n);}
            const note=noteParts.join('; ').replace(/"/g,'""').replace(/[\r\n]+/g,' ');
            const bRate=billableOn(user.name,proj.name,dateForWk(wk));
            csv+=`${wk},"${q2(proj.name)}","${q2(client?.company)}","${q2(ph.name)}","${q2(user.name)}",${dayVals.join(',')},${regH},${otH},${tot},${bRate},${(tot*bRate).toFixed(2)},actual,"${note}"\n`;
          }
          // Forecast entries — Mon–Fri only (forecast doesn't have OT/weekend concept)
          const fd=[0,1,2,3,4].map(i=>parseFloat(gF(wk,proj.name,ph.name,user.name,i))||0);
          const ft=fd.reduce((s,v)=>s+v,0);
          if(ft>0){
            const bRateF=billableOn(user.name,proj.name,dateForWk(wk));
            csv+=`${wk},"${q2(proj.name)}","${q2(client?.company)}","${q2(ph.name)}","${q2(user.name)}",${fd.join(',')},0,0,0,0,0,0,0,0,0,${ft},0,${ft},${bRateF},${(ft*bRateF).toFixed(2)},forecast,""\n`;
          }
        }
      }
    }
  }
  // Leave and Non-billable — so this export truly covers ALL recorded time
  const lnbRows=(storeObj,label)=>{
    const byRow={};
    for(const[k,v]of Object.entries(storeObj)){
      const hrs=parseFloat(v)||0;if(!hrs)continue;
      const[wk,type,person,dayS]=k.split('||');const day=parseInt(dayS);
      const rk=`${wk}||${type}||${person}`;
      if(!byRow[rk])byRow[rk]={wk,type,person,days:Array(14).fill(0)};
      byRow[rk].days[day]=(byRow[rk].days[day]||0)+hrs;
    }
    for(const r of Object.values(byRow)){
      const reg=r.days.slice(0,7).reduce((a,b)=>a+b,0),ot=r.days.slice(7).reduce((a,b)=>a+b,0);
      const noteKeyBase=label==='Leave'?'Leave':'Non-billable';
      const notes=[...Array(14).keys()].map(d=>st.cellNotes[`${r.wk}||${noteKeyBase}||${r.type}||${r.person}||${d}`]).filter(Boolean).join('; ');
      csv+=`${r.wk},"${q2(label)}","","${q2(r.type)}","${q2(r.person)}",${r.days.join(',')},${reg},${ot},${reg+ot},0,0.00,actual,"${q2(notes)}"\n`;
    }
  };
  lnbRows(st.leave,'Leave');
  lnbRows(st.nonBillable,'Non-billable');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='amn-timesheet.csv';a.click();
}

function crmMigrateRoles(){

const HELP_TEXT={
  income:{title:'How the income forecast works',body:`
    <p style="margin:0 0 8px"><b>The practice's fee pipeline by month</b> — the portal's version of the cashflow spreadsheet's Income Forecast tab, driven by the same invoice installments as each project's Invoicing card. Every non-archived project with an active stage appears; amounts are net of VAT.</p>
    <p style="margin:0 0 8px"><b>Cells.</b> A cell is that stage's installments dated in that month — click it to add or edit them (the project modal's Invoicing card edits the same records). Colours match the spreadsheet: <b>cyan</b> = invoiced, awaiting payment; <b>salmon</b> = paid; plain = planned; <i>grey italic</i> = unconfirmed possibles, counted only in Max potential. A small dot marks a month mixing states.</p>
    <p style="margin:0 0 8px"><b>Likelihood.</b> The figures you enter are always the <b>max potential</b> — the familiar numbers from the fee proposal. Each stage line inherits the project's likelihood colour, or set its own via its dot; a line below 100% shows a second <i>probable</i> row (max × likelihood) so both are visible per stage. <b>Confirmed</b> counts 100% lines only; <b>Probable</b> weights every line by its likelihood; <b>Max potential</b> is everything at face value.</p>
    <p style="margin:0 0 8px"><b>Confirmed tick vs likelihood — two different questions, no conflict.</b> The per-installment <b>Confirmed</b> tick asks "is this installment a real part of the plan?" — untick it for speculative extras, which then count ONLY in Max potential whatever the line's likelihood. The line's <b>likelihood</b> asks "is this work going to happen at all?" and weights the confirmed installments. They multiply: a confirmed installment on a 40% line means "the drawdown schedule is agreed, the appointment is 40% likely" — it shows in Probable at 40% and Max at face value, and joins the Confirmed total only once the line reaches 100%.</p>
    <p style="margin:0 0 8px"><b>Paid.</b> Tick Paid when the money lands — the received date is recorded, the cell turns salmon, and the practice-wide <b>Outstanding</b> figure (your debtors) updates.</p>
    <p style="margin:0 0 8px"><b>Fill, move and sort.</b> Drag a filled cell along its row to repeat its installments into the covered months (they land as planned and never overwrite existing months). To <b>slip a run of planned income</b>, shift+click the first and last cells of the range (they highlight), then drag the selection left or right — every planned installment in it moves by that many months; issued and paid invoices are records and stay put. Click the #, Project, Client or % headers to sort. Add a short note to any installment — a corner mark shows on the cell and the note appears in its tooltip. The <b>%</b> column is the likelihood dot (dashed border = inherited from the project colour) — click it to change; the ↗ beside a project name or in a cell's popover jumps straight to that project's Invoicing card.</p>
    <p style="margin:0 0 8px"><b>The chart.</b> Click <b>▸ Chart — monthly totals</b> beneath the project rows to open the line chart of the monthly Confirmed, Probable, Max potential and <b>Paid</b> totals (it starts minimised — most reviews only need the figures). Each point sits directly beneath its month column, it scrolls sideways with the table, and the ‹ › / Today buttons move both together. The scenario totals sit beneath it.</p>
    <p style="margin:0 0 8px"><b>Years and quarters.</b> The header bands the window by financial year (assumed to start 1 April) and VAT quarter, with vertical rules at each boundary. The two right-hand columns — pinned in their own panel at the right of the screen, always visible while the months scroll — total each line <b>YtD</b> (financial year to date) and across the <b>whole financial year</b>; hover the Confirmed / Probable / Max potential labels at the foot for their exact definitions.</p>
    <p style="margin:0"><b>VAT quarters</b> are banded along the top; the tinted bottom row totals <b>invoiced actuals</b> per whole quarter — a record of billing, deliberately set apart from the three scenario rows above it. <b>Export CSV</b> gives the monthly scenario totals for pasting into the cashflow spreadsheet.</p>`},
  home:{title:'How the home page works',body:`
    <p style="margin:0 0 8px"><b>Your day at a glance.</b> Anything needing action — overdue timesheets, CPD to accept, leave notices or approvals — appears at the top; click a row to go straight there. The quick-action buttons log time, leave, CPD or a conversation from anywhere.</p>
    <p style="margin:0 0 8px"><b>My week</b> shows hours logged against your contracted hours (bank-holiday weeks lower the target automatically). <b>Who's away</b> covers this week and next for the whole team.</p>
    <p style="margin:0"><b>Admins and PMs</b> also see team timesheet status, utilisation and health tiles for every project live this week — click a tile for the full health chart.</p>`},
  log:{title:'How timesheets work',body:`
    <p style="margin:0 0 8px"><b>Rows are per week.</b> Adding or removing a project/stage row on THIS week (or a future one) sets your working list going forward; past weeks are never touched — they show exactly the rows you logged hours against (plus anything you add to that week specifically). A row with hours in a week can't be removed from it — clear the hours first.</p>
    <p style="margin:0 0 8px"><b>Log your week.</b> Add a project and stage (or a leave type / non-billable category) with the row selectors, then type hours into each day. Totals update as you type.</p>
    <p style="margin:0 0 8px"><b>Overtime.</b> Tick the <b>OT</b> box on any row to add an overtime line beneath it for evening and weekend hours — these sit outside your weekly target. A regular day can't exceed <b>7.5h</b>; the <b>Daily total</b> row at the foot of the table highlights any day that does, and the week can't be submitted until the extra hours move to an overtime row.</p>
    <p style="margin:0 0 8px"><b>Submitting.</b> The bar at the top shows how far you are from your weekly hours. Submit locks the week; an admin (or you) can reopen it to edit, and it must return to target before it can be resubmitted. If leave is approved for a week you've already submitted, that week reopens automatically and you'll get a notice to review and resubmit it.</p>
    <p style="margin:0 0 8px"><b>Future weeks.</b> You can page forward to any future week to see what's coming — but future weeks are view only for everyone until they arrive.</p>
    <p style="margin:0 0 8px"><b>Pending leave.</b> A leave request that touches a week — including one entered through the timesheet itself — shows on that timesheet as a dashed <i>pending approval</i> row until it's decided, matching the Leave page and the forecast.</p>
    <p style="margin:0"><b>Notes and CPD.</b> The small button in each cell adds a note. A blue <b>C</b> badge means those hours came from a CPD entry — click it to open the record.</p>`},
  forecast:{title:'How the forecast works',body:`
    <p style="margin:0 0 8px"><b>Two views.</b> <b>Projects</b> plans work project by project; <b>Team</b> shows each person's capacity — green is full, light is spare, red is over-allocated.</p>
    <p style="margin:0 0 8px"><b>Adding time.</b> Use the <b>+</b> column to bring in a project, stage or person. Click any cell on a row to add a milestone (a one-off note, no fee attached) or a time entry (counts toward hours and fees). Tick <b>Also add for</b> to create the same entry for several people at once.</p>
    <p style="margin:0 0 8px"><b>Editing bars.</b> Click a bar to edit or delete it; drag its middle to move it, or its edges to extend or shorten it. Weekends and UK bank holidays are hatched and never receive hours. The orange vertical line marks <b>today</b> — forecast to its left is a record of what was planned; only forecast from today onward counts toward project health.</p>
    <p style="margin:0 0 8px"><b>Leave clashes.</b> A purple box on a project cell means that person is on leave that day (dashed = requested, awaiting a decision) — visible before you allocate, so a deadline booking can't hide a holiday. It never blocks; allocating over leave just shows a heads-up.</p>
    <p style="margin:0 0 8px"><b>Placeholder people.</b> <b>+ Placeholder person</b> creates a forecast-only person — no login, no timesheets, invisible everywhere else — for planning a future hire. Give them billable and cost rates and their allocated time prices into project health like anyone else's. Edit or remove them from the Team view.</p>
    <p style="margin:0 0 8px"><b>Milestones.</b> Collapsed project rows show milestones rather than hours, so the whole list reads as a timeline. Hover any cell to read every milestone in it; hours appear on the stage rows when a project is expanded.</p>
    <p style="margin:0"><b>Likelihood colours.</b> The dot beside a project name sets its likelihood: <b>green</b> = 100% go, <b>yellow</b> = 40%, <b>orange</b> = 10%, <b>grey</b> = dormant. The same colour shows on the Projects page — they can never differ.</p>`},
  projects:{title:'How projects work',body:`
    <p style="margin:0 0 8px"><b>Fee structure.</b> A project carries either one <b>total fee</b> or a fee per <b>stage</b>. Health charts and reports use whichever you chose.</p>
    <p style="margin:0 0 8px"><b>Health.</b> Click a project to see fee spent against forecast, a spend-over-time chart (hover any column for the figures) and a stage-by-stage breakdown. Switch the chart between weekly and monthly for long projects. <b>Spent</b> comes from timesheets only; <b>forecast</b> counts from today onward — once a day has passed, the timesheet is the record and old forecast for it no longer adds to spend.</p>
    <p style="margin:0 0 8px"><b>Rates.</b> Rates are effective-dated: changing someone's rate never rewrites historic time. A project can override a person's billable rate — useful for secondments or unbilled work.</p>
    <p style="margin:0 0 8px"><b>Likelihood.</b> Each project can carry one of four colours — <b>green</b> 100% go, <b>yellow</b> 40%, <b>orange</b> 10%, <b>grey</b> dormant — set here or on the Forecast (always in step). Sort the list by the Likelihood column or filter with the chips above it.</p>
    <p style="margin:0 0 8px"><b>Invoicing</b> (admins only). Each stage — or the whole project on a total-fee job — carries its own invoice list in Edit: amount, date, reference and two ticks. Xero still creates and issues the invoices; this is the record of them. Future dates are planned invoices, for cashflow. <b>Confirmed</b> installments count toward the totals — untick it for fees that may never materialise. <b>Invoiced</b> means it has gone out through Xero (and confirms the fee automatically). A ⚠ shows wherever confirmed invoices don't add up to the fee, and admins see invoiced-to-date figures on the project's health page.</p>
    <p style="margin:0 0 8px"><b>Notes.</b> <b>Project notes</b> (admins and PMs) are the running record; <b>Fee notes</b> (admins only) hold free-text fee history and commentary, including everything imported from Harvest.</p>
    <p style="margin:0"><b>Archiving.</b> Archived projects drop out of the main list and the forecast but keep all their time. Deleting a project sends it, and its time, to Deleted Items.</p>`},
  clients:{title:'How clients work',body:`
    <p style="margin:0 0 8px"><b>Clients live in the CRM.</b> Every company on the CRM's Contacts list can be picked straight from the Company box when you add a project — it joins the client list at that moment. The button on a company's card does the same thing ahead of time. Once it has a project, it shows a <b>client</b> badge automatically.</p>
    <p style="margin:0">This page lists the client records that projects bill against. Renaming a company in the CRM keeps everything here in step.</p>`},
  team:{title:'How the team page works',body:`
    <p style="margin:0 0 8px"><b>One row per person.</b> The table shows the selected week: <b>Scheduled</b> (forecast), <b>Hours</b> (logged), the <b>Delta</b> between them, and a utilisation bar — dark for billable time, light for non-billable — against each person's real capacity (part-time hours and bank holidays are respected). Use the arrows to step between weeks.</p>
    <p style="margin:0 0 8px"><b>Click a person</b> for their full profile: contact details, effective-dated rates (click a rate for its history — past time always keeps the rate that applied when it was worked), leave entitlement and what's booked, CPD progress, and their forecast assignments.</p>
    <p style="margin:0"><b>Roles.</b> <b>Members</b> see timesheets, leave and CPD. <b>Project managers</b> also plan the forecast and read rates. <b>Admins</b> do everything, including editing rates and profiles.</p>`},
  reports:{title:'How reports work',body:`
    <p style="margin:0 0 8px"><b>Custom report.</b> Filter by period, client, project, stage or person to see hours and fee value, with a cumulative chart.</p>
    <p style="margin:0 0 8px"><b>Utilisation</b> shows each person's billable share of their available hours over the chosen period.</p>
    <p style="margin:0"><b>Export all time</b> writes every week ever recorded to one CSV — all projects, stages, clients and people, including leave, non-billable and forecasts.</p>`},
  cpd:{title:'How the CPD tracker works',body:`
    <p style="margin:0 0 8px"><b>Shared editing.</b> Admins and project managers can edit any entry — rename it, correct the data, or tick on attendees who were missed; the creator and everyone else can still add their personal reflection. Once an entry's date has passed, its <b>creator</b> is nudged (home, top bar, and a banner here) until the three shared boxes — what we learned, how we're applying it, next steps — are complete.</p>
    <p style="margin:0 0 8px"><b>One entry, many attendees.</b> Add a CPD entry once and tick everyone who attended; each person writes their own reflection. Entries write <b>CPD and training</b> hours to attendees' timesheets and the forecast automatically.</p>
    <p style="margin:0 0 8px"><b>Both schemes at once.</b> Every entry is scored against <b>ARB</b> and <b>RIBA</b>. Some topics count for both — fire safety and sustainability map across automatically — so you only record an activity once.</p>
    <p style="margin:0 0 8px"><b>Submitted weeks.</b> If an entry lands in a week you've already submitted, you get a notice to accept it. Accepting reopens that week so you can rebalance your hours and resubmit.</p>
    <p style="margin:0"><b>Practice overview</b> shows coverage by topic, who is short, and where the gaps are across the year. Personal reflections stay out of the practice-wide export.</p>`},
  crm:{title:'How the CRM works',body:`
    <p style="margin:0 0 8px"><b>One list of everyone.</b> People and companies live in the same Contacts list. A company can exist with nobody at it — that's the cold-call list, filtered by <b>never contacted</b>.</p>
    <p style="margin:0 0 8px"><b>Log every conversation.</b> Open the contact (or use <b>Log a conversation</b>) and add a dated note. The newest shows in the list; the full history sits on the contact's card.</p>
    <p style="margin:0 0 8px"><b>Actions are the to-do list.</b> Anything that needs doing becomes an action with a due date — type <b>@</b> and pick a name to assign it. The Overview shows one prioritised list, overdue first. Ticked actions can be recovered from <b>recently completed</b>.</p>
    <p style="margin:0 0 8px"><b>Ratings keep the list honest.</b> <b>Hot</b> = actively pursuing (flagged in <i>Gone quiet</i> after 4 silent weeks), <b>Warm</b> = keep alive (3 months), <b>Cold</b> = long shot, <b>Dormant</b> = history only.</p>
    <p style="margin:0 0 8px"><b>Events.</b> Conferences get an event: who you plan to meet, who you actually met, and which of us attended — attendance writes <b>Marketing and BD</b> time to those timesheets.</p>
    <p style="margin:0"><b>Active clients.</b> A company shows the <span class="badge badge-ok">client</span> badge once it has a project on the Projects page. One dataset, no separate list.</p>`},
  leave:{title:'How leave works',body:`
    <p><b>Request:</b> pick a type and your dates (weekends and bank holidays don't count — they're already off), tick any half days, and submit. Requests go to an admin; nobody approves their own leave. You can also start a request by entering leave hours on your timesheet (past weeks included) or clicking a day on your forecast leave row.</p>
    <p><b>On approval</b> the days book onto your timesheet at your normal daily hours, show on the forecast and calendar, and — for Annual leave only — come off your allowance. If any day falls in a week already submitted, that timesheet reopens automatically with a notice to resubmit, so the calendar, forecast and timesheets always agree. Unpaid and other leave types are recorded but never touch the allowance; unpaid leave has no cap and is discretionary. A week with a pending leave request can't be submitted until it's decided.</p>
    <p><b>Privacy:</b> everyone can see who's off and when; the <i>type</i> of leave is visible only to you and admins.</p>
    <p><b>School holidays:</b> the orange bar along the top of the team calendar marks typical England school holidays (approximate — councils vary), to help plan family leave around them.</p>
    <p><b>Allowance:</b> 25 days a year pro-rata to your working week, editable per person. Up to 5 unused days carry over automatically and are usable until 31 December of the next year — admins can set the carried number directly (e.g. for TOIL).</p>
    <p><b>Recorded for you:</b> an admin can log leave on your behalf (e.g. sickness) — you'll get a notice to check it's right.</p>`},
  import:{title:'How the data page works',body:`
    <p style="margin:0 0 8px"><b>Setup imports (retired).</b> The one-time imports that first populated the app — Harvest history, the CRM BD tracker, and leave &amp; CPD history — have been retired now the app is live, so they can't be re-run against the shared data by accident. Add time, leave and CPD from their own pages from here on.</p>
    <p style="margin:0 0 8px"><b>Backup and restore.</b> Live data sits in the shared cloud database with automatic nightly backups; the JSON download here is an extra portable copy you control. Take one occasionally and before any big change. Restoring replaces the current data entirely, so back up first.</p>
    <p style="margin:0"><b>Deleted Items</b> holds anything removed, with all its associated data, until it is restored or permanently emptied.</p>`}
};
let crmNewContactOrg=null;

function crmId(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);}
const crmOrg=id=>st.crmOrgs.find(o=>o.id===id);
const crmContact=id=>st.crmContacts.find(c=>c.id===id);
const crmEventById=id=>st.crmEvents.find(e=>e.id===id);
function crmOrgName(id){const o=crmOrg(id);return o?o.name:'';}
function crmSectors(){return Array.isArray(st.crmSectors)&&st.crmSectors.length?st.crmSectors:CRM_SECTORS_DEFAULT;}
function crmTodayISO(){return isoDate(new Date());}
function crmDaysSince(iso){if(!iso)return null;return Math.floor((new Date()-parseISO(iso))/86400000);}
function normCrmContact(c){if(!Array.isArray(c.sectors))c.sectors=[];if(!Array.isArray(c.links))c.links=[];if(!c.rating)c.rating='warm';if(typeof c.type!=='string')c.type='';if(typeof c.linkedin!=='string')c.linkedin='';}
function normCrmOrg(o){if(!Array.isArray(o.sectors))o.sectors=[];if(!o.rating)o.rating='warm';if(typeof o.website!=='string')o.website='';}
// Safe outbound href for a user-typed website / LinkedIn URL: pass http(s) through,
// prepend https:// to a bare domain, and reject any other scheme (e.g. javascript:).
function crmHref(u){u=String(u||'').trim();if(!u)return'';if(/^https?:\/\//i.test(u))return u;if(/^[a-z][a-z0-9+.-]*:/i.test(u))return'';return'https://'+u;}
function normCrmInter(i){if(!Array.isArray(i.contactIds))i.contactIds=[];if(!Array.isArray(i.orgIds))i.orgIds=[];}
function normCrmEvent(e){if(!Array.isArray(e.attendees))e.attendees=[];if(!Array.isArray(e.targetOrgIds))e.targetOrgIds=[];if(!Array.isArray(e.staff))e.staff=[];if(!Array.isArray(e.timeWrites))e.timeWrites=[];if(typeof e.hoursPerDay!=='number')e.hoursPerDay=7.5;if(typeof e.evening!=='boolean')e.evening=false;if(typeof e.link!=='string')e.link='';}
// Keep every billing client mirrored as a CRM company (the "Active client" badge).
function crmSyncClients(){
  for(const cl of st.clients){
    let o=st.crmOrgs.find(x=>x.name.trim().toLowerCase()===String(cl.company||'').trim().toLowerCase());
    if(!o&&cl.company){o={id:crmId('co'),name:cl.company,website:'',sectors:[],notes:'',rating:'warm',clientId:cl.id,src:'client-sync',createdBy:st.currentUser||'',createdAt:crmTodayISO()};st.crmOrgs.push(o);}
    else if(o&&!o.clientId)o.clientId=cl.id;
    // Legacy Clients-page 'primary contact' fields migrate into a real CRM contact
    // on the synced org — one dataset; the old field is then retired.
    if(o&&cl.contact){
      const nm=String(cl.contact).trim();
      if(nm&&!st.crmContacts.some(c=>c.orgId===o.id&&String(c.name||'').trim().toLowerCase()===nm.toLowerCase())){
        st.crmContacts.push({id:crmId('ct'),name:nm,orgId:o.id,role:'',type:'',typeNote:'',email:cl.email||'',phone:cl.phone||'',mobile:'',sectors:o.sectors?o.sectors.slice():[],owner:'',rating:'warm',source:'Clients import',links:[],createdBy:st.currentUser||'',createdAt:crmTodayISO()});
      }
      delete cl.contact;
    }
  }
}

function crmInterSort(a,b){return a.date<b.date?1:a.date>b.date?-1:String(b.id).localeCompare(String(a.id));}
function crmContactInters(cid){return st.crmInteractions.filter(i=>i.contactIds.includes(cid)).sort(crmInterSort);}
function crmOrgInters(oid){const ppl=st.crmContacts.filter(c=>c.orgId===oid).map(c=>c.id);return st.crmInteractions.filter(i=>i.orgIds.includes(oid)||i.contactIds.some(c=>ppl.includes(c))).sort(crmInterSort);}
function crmLastTouch(cid){const l=crmContactInters(cid);return l.length?l[0]:null;}
function crmLastTouchOrg(oid){const l=crmOrgInters(oid);return l.length?l[0]:null;}
function crmOpenActionsFor(kind,id){return st.crmActions.filter(a=>!a.done&&a[kind]===id);}
function crmMyOpenActions(name){return st.crmActions.filter(a=>!a.done&&a.owner===name);}
function crmActionOverdue(a){return!a.done&&a.due&&a.due<crmTodayISO();}
function crmSnippet(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s;}
function crmRateBadge(r){return`<span class="crm-rate crm-rate-${r||'warm'}">${CRM_RATE_LABEL[r]||'Warm'}</span>`;}
function crmSecChip(s){return`<span class="crm-sec" style="border-color:${crmSecColor(s)};color:${crmSecColor(s)}">${escAttr(s)}</span>`;}
function crmFmtNote(t){return escAttr(t||'').replace(/@([A-Za-z][\w\-']*)/g,'<b class="crm-mention">@$1</b>').replace(/\r?\n/g,'<br>');}
function crmMentionOwner(text){const m=String(text||'').match(/@([A-Za-z][\w\-']*)/);if(!m)return null;const q=m[1].toLowerCase();const u=st.users.find(u=>!u.deactivated&&(u.name.toLowerCase().split(/\s+/)[0]===q||u.name.toLowerCase().replace(/\s+/g,'')===q));return u?u.name:null;}
// "@" typeahead: while the caret is inside an @fragment, offer team names; picking
// one inserts the mention (first name, lowercased — what crmMentionOwner parses).
function crmActTipEl(){let el=document.getElementById('crm-act-typeahead');if(!el){el=document.createElement('div');el.id='crm-act-typeahead';el.className='cr-dropdown';el.style.position='fixed';el.style.display='none';el.style.zIndex=600;document.body.appendChild(el);}return el;}
window.crmActTypeahead=function(inp){
  const el=crmActTipEl();
  const v=inp.value;
  const m=v.match(/@([\w\-']*)$/);
  if(!m){el.style.display='none';return;}
  const q=m[1].toLowerCase();
  const names=st.users.filter(u=>!u.deactivated&&(q===''||u.name.toLowerCase().startsWith(q)||u.name.toLowerCase().split(/\s+/)[0].startsWith(q)));
  if(!names.length){el.style.display='none';return;}
  el.innerHTML=names.map(u=>`<div style="padding:8px 12px;cursor:pointer;font-size:12px" onmousedown="event.preventDefault();crmActPick('${jsq(inp.id)}','${jsq(u.name)}')">${escAttr(u.name)}</div>`).join('');
  const r=inp.getBoundingClientRect();
  el.style.left=r.left+'px';el.style.top=(r.bottom+3)+'px';el.style.minWidth=Math.max(180,r.width*0.6)+'px';el.style.display='block';
}
window.crmActPick=function(inpId,name){
  const inp=document.getElementById(inpId);if(!inp)return;
  const mention='@'+name.split(/\s+/)[0].toLowerCase();
  inp.value=inp.value.replace(/@[\w\-']*$/,mention+' ');
  const el=document.getElementById('crm-act-typeahead');if(el)el.style.display='none';
  inp.focus();
}
document.addEventListener('click',e=>{const el=document.getElementById('crm-act-typeahead');if(el&&el.style.display!=='none'&&!e.target.closest('#crm-act-typeahead'))el.style.display='none';},true);
function crmActiveUsers(){return st.users.filter(u=>!u.deactivated).map(u=>u.name);}
function crmContextOf(a){if(a.contactId){const c=crmContact(a.contactId);if(c)return{label:c.name,open:`crmOpenContact('${jsq(c.id)}')`};}if(a.orgId){const o=crmOrg(a.orgId);if(o)return{label:o.name,open:`crmOpenOrg('${jsq(o.id)}')`};}return null;}
function crmStale(c){const last=crmLastTouch(c.id);if(!last)return null;const days=crmDaysSince(last.date);const lim=CRM_STALE_DAYS[c.rating];return(lim&&days!=null&&days>lim)?days:null;}
// A company's displayed rating: its hottest person, or its own rating when nobody's there yet.
function crmIsActiveClient(o){return !!(o&&o.clientId&&st.projects.some(p=>p.clientId===o.clientId));}
function crmOrgRating(o){const ppl=st.crmContacts.filter(c=>c.orgId===o.id);if(!ppl.length)return o.rating||'warm';return ppl.reduce((best,c)=>(CRM_RATE_ORDER[c.rating]??1)<(CRM_RATE_ORDER[best]??1)?c.rating:best,'dormant');}

// ── View switching, search, filters ────────────────────────────────────────────
window.crmSetView=v=>{crmView=v;render();};
window.crmSearch=function(el){const v=el.value,pos=el.selectionStart;crmQ=v;render();const e2=document.getElementById('crm-search');if(e2){e2.focus();try{e2.setSelectionRange(pos,pos);}catch(_){}}}
window.crmChip=(k,v)=>{if(k==='never')crmFilt.never=!crmFilt.never;else if(k==='rating'){const idx=crmFilt.rating.indexOf(v);if(idx>=0)crmFilt.rating.splice(idx,1);else crmFilt.rating.push(v);render();}else{crmFilt[k]=crmFilt[k]===v?'':v;render();}};
window.crmClearFilters=()=>{crmQ='';crmFilt={rating:[],sector:'',type:'',never:false};render();};
window.crmSortBy=function(by){if(crmSort.by===by)crmSort.dir=crmSort.dir==='asc'?'desc':'asc';else crmSort={by,dir:'asc'};render();}
let crmSectorEditorOpen=false;
window.crmToggleSectorEditor=()=>{crmSectorEditorOpen=!crmSectorEditorOpen;render();};
window.crmSectorAdd=function(){const el=document.getElementById('crm-newsector');const t=(el&&el.value||'').trim();if(!t)return;if(crmSectors().some(s=>s.toLowerCase()===t.toLowerCase())){undoToast('That sector is already in the list.');return;}st.crmSectors=[...crmSectors(),t];save();render();}
window.crmSectorRemove=function(i){const list=crmSectors().slice();const t=list[i];const used=st.crmContacts.some(c=>c.sectors.includes(t))||st.crmOrgs.some(o=>o.sectors.includes(t));if(used){undoToast('That sector is in use on contacts or companies — reassign them first.');return;}list.splice(i,1);st.crmSectors=list;save();render();}
window.crmSetActionScope=s=>{crmActionScope=s;render();};
let crmRoleEditorOpen=false;
window.crmToggleRoleEditor=()=>{crmRoleEditorOpen=!crmRoleEditorOpen;render();};
window.crmRoleAdd=function(){const el=document.getElementById('crm-newrole');const t=(el&&el.value||'').trim();if(!t)return;if(crmRoles().some(r=>r.toLowerCase()===t.toLowerCase())){undoToast('That role is already in the list.');return;}st.crmRoles=[...crmRoles(),t];save();render();}
window.crmRoleRemove=function(i){const list=crmRoles().slice();const t=list[i];if(st.crmContacts.some(c=>String(c.type||'').toLowerCase()===String(t).toLowerCase())){undoToast('That role is in use on contacts — reassign them first.');return;}list.splice(i,1);st.crmRoles=list;save();render();}

// ── Page ───────────────────────────────────────────────────────────────────────
function buildCRM(){
  const me=cur().name;
  const myActs=crmMyOpenActions(me).length;
  const views=[['attention','Overview'],['contacts',`Contacts (${st.crmContacts.length+st.crmOrgs.filter(o=>!st.crmContacts.some(c=>c.orgId===o.id)).length})`],['events',`Events (${st.crmEvents.length})`]];
  let h=pageHead('CRM','crm',`<button class="btn-add" onclick="crmOpenAdd()">+ Add to CRM</button><button class="btn-add" style="background:var(--wht);color:var(--accent);border-color:var(--accent)" onclick="crmOpenLog()">+ Log a conversation</button>`)+`
  <div class="card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div style="display:flex;gap:0;flex-wrap:wrap">${views.map(([id,lb])=>`<button class="btn crm-viewbtn ${crmView===id?'crm-viewbtn-on':''}" onclick="crmSetView('${id}')">${lb}</button>`).join('')}</div>

  </div>`;

  if(crmView==='attention')h+=buildCrmAttention();
  else if(crmView==='contacts')h+=buildCrmContacts();
  else if(crmView==='events')h+=buildCrmEvents();
  return h;
}



// ── Overview ───────────────────────────────────────────────────────────────────
function buildCrmAttention(){
  const me=cur().name;
  let h='';
  if(!st.crmContacts.length&&!st.crmOrgs.length){
    h+=`<div class="card"><div class="card-title">Nothing here yet</div>

  const today=crmTodayISO();
  const sorted=[...scoped].sort((a,b)=>{
    const ao=crmActionOverdue(a),bo=crmActionOverdue(b);

    return (a.due||'9999-99-99')<(b.due||'9999-99-99')?-1:1;
  });
  const stale=st.crmContacts.map(c=>({c,days:crmStale(c)})).filter(x=>x.days!=null).sort((a,b)=>b.days-a.days).slice(0,10);
  const never=st.crmContacts.filter(c=>!crmLastTouch(c.id)).length+st.crmOrgs.filter(o=>!st.crmContacts.some(c=>c.orgId===o.id)&&!crmLastTouchOrg(o.id)).length;
  const hot=st.crmContacts.filter(c=>c.rating==='hot').length;
  const nOver=openActs.filter(crmActionOverdue).length;
  h+=`<div class="card-row">
    ${crmTile(st.crmContacts.length,'contacts','contacts','')}

    ${crmTile(never,'never contacted','contacts',`crmFilt.never=true`)}
    ${crmTile(mine.length,'actions for you','attention','')}
    ${crmTile(nOver,'overdue','attention','',nOver?'var(--danger)':null)}
  </div>`;
  // Needs attention — ONE list, priority order.
  h+=`<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
    <div class="card-title" style="margin:0">Actions</div>
    <div style="display:flex;gap:0">
      <button class="btn btn-sm" style="${crmActionScope==='mine'?'background:var(--blk);color:#fff':''}" onclick="crmSetActionScope('mine')">Mine (${mine.length})</button>
      <button class="btn btn-sm" style="${crmActionScope==='all'?'background:var(--blk);color:#fff':''}" onclick="crmSetActionScope('all')">Everyone (${openActs.length})</button>
    </div>
  </div>
  <div style="font-size:11px;color:var(--dkgrey);margin:-4px 0 10px">Work top-down: overdue first, then by due date. Tick things off as they're done.</div>`;
  if(!sorted.length)h+=`<div class="empty" style="padding:14px">No open actions${crmActionScope==='mine'?' for you':''} — all clear.</div>`;
  else{
    h+=`<table class="rtable crm-table"><thead><tr><th style="width:26px"></th><th>Action</th><th>Who / where</th>${crmActionScope==='all'?'<th>Owner</th>':''}<th>Due</th></tr></thead><tbody>`;
    for(const a of sorted){const ctx=crmContextOf(a);const od=crmActionOverdue(a);
      h+=`<tr class="${od?'crm-row-hot':''}"><td><input type="checkbox" onclick="crmToggleAction('${jsq(a.id)}')" title="Mark done"/></td>
      <td style="font-size:12.5px">${crmFmtNote(a.text)}</td>
      <td>${ctx?`<a href="javascript:void(0)" onclick="${ctx.open}" style="color:var(--blk);font-weight:500;font-size:12px">${escAttr(ctx.label)}</a>`:'—'}</td>
      ${crmActionScope==='all'?`<td style="font-size:12px">${escAttr(a.owner||'—')}</td>`:''}
      <td>${a.due?`<span class="badge ${od?'badge-overdue':(a.due<=isoDate(addDays(new Date(),7))?'badge-warn':'')}">${fmt(parseISO(a.due))}${od?' ⚠':''}</span>`:'<span style="color:var(--grey);font-size:11px">—</span>'}</td></tr>`;}
    h+=`</tbody></table>`;
  }
  // Recently completed — a safety net for accidental ticks; untick to restore.
  {const doneActs=st.crmActions.filter(a=>a.done).sort((a,b)=>(b.doneAt||'')<(a.doneAt||'')?-1:1).slice(0,30);
  if(doneActs.length){
    h+=`<div style="margin-top:10px"><a href="javascript:void(0)" style="font-size:11px;color:var(--dkgrey);font-weight:600" onclick="crmShowDoneOverview=!crmShowDoneOverview;render()">${crmShowDoneOverview?'▾ Hide':'▸ Show'} recently completed (${doneActs.length})</a></div>`;
    if(crmShowDoneOverview){
      h+=doneActs.map(a=>{const ctx=crmContextOf(a);return`<div style="display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dotted var(--mid);opacity:.6">
        <input type="checkbox" checked onclick="crmToggleAction('${jsq(a.id)}')" title="Untick to reopen this action"/>
        <span style="font-size:12px;flex:1;text-decoration:line-through">${crmFmtNote(a.text)}</span>
        ${ctx?`<a href="javascript:void(0)" onclick="${ctx.open}" style="font-size:11px;color:var(--dkgrey)">${escAttr(ctx.label)}</a>`:''}
        <span style="font-size:10px;color:var(--grey)">${escAttr((a.doneBy||'').split(' ')[0])}${a.doneAt?` · ${fmt(parseISO(a.doneAt))}`:''}</span>

      h+=`<div style="font-size:10px;color:var(--grey);margin-top:6px">Untick to put an action back on the list. Completed actions also appear on each contact's card and in the actions CSV export.</div>`;
    }
  }}
  h+=`</div>`;
  // Gone quiet — automatic, no data entry.
  h+=`<div class="card"><div class="card-title">Gone quiet</div>
    <div style="font-size:11px;color:var(--dkgrey);margin-bottom:8px">Automatic: hot contacts silent 4+ weeks, warm 3+ months. When your list above is clear, revive one of these — log a conversation, set an action, or downgrade the rating.</div>`;
  if(!stale.length)h+=`<div class="empty" style="padding:12px">Nobody's going quiet.</div>`;
  else{h+=`<table class="rtable crm-table"><thead><tr><th>Contact</th><th>Rating</th><th>Last contact</th></tr></thead><tbody>`;
    for(const{c,days}of stale)h+=`<tr class="crm-row-${c.rating}" style="cursor:pointer" onclick="crmOpenContact('${jsq(c.id)}')"><td style="font-weight:500;font-size:12.5px">${escAttr(c.name)}${c.orgId?` <span style="color:var(--grey)">· ${escAttr(crmOrgName(c.orgId))}</span>`:''}</td><td>${crmRateBadge(c.rating)}</td><td style="font-size:12px;color:var(--danger)">${days} days ago</td></tr>`;
    h+=`</tbody></table>`;}
  h+=`</div>`;
  h+=`<div class="export-bar">
    <span class="export-note">Everything in the CRM, one file: every company, person, conversation, action and event.</span>
    <button class="btn" onclick="crmExportActionsCSV()">Export actions (CSV)</button>
    <button class="btn" onclick="crmExportAllCSV()">Export all CRM (CSV)</button>
  </div>`;
  return h;
}
function crmTile(v,label,view,pre,color){return`<div class="crm-tile" onclick="${pre?pre+';':''}crmSetView('${view}')"><div style="font-size:24px;font-weight:600;${color?`color:${color}`:''}">${v}</div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dkgrey);font-weight:600">${label}</div></div>`;}

function crmRows(){
  const rows=[];
  for(const c of st.crmContacts){
    const last=crmLastTouch(c.id);
    rows.push({kind:'person',id:c.id,name:c.name,org:crmOrgName(c.orgId),orgId:c.orgId,type:c.type||'',sectors:c.sectors,rating:c.rating,last,acts:crmOpenActionsFor('contactId',c.id).length,rec:c});
  }
  for(const o of st.crmOrgs){
    if(st.crmContacts.some(c=>c.orgId===o.id))continue;       // companies with people show through their people
    const last=crmLastTouchOrg(o.id);
    rows.push({kind:'org',id:o.id,name:o.name,org:'',orgId:o.id,type:'',sectors:o.sectors,rating:crmOrgRating(o),last,acts:crmOpenActionsFor('orgId',o.id).length,rec:o});
  }
  return rows;
}

function crmCloseModals(){_crmXArm=false;crmEditingInter=null;crmContactModal=null;crmOrgModal=null;crmEventModal=null;crmAddModal=false;crmLogModal=false;crmShowDoneActions=false;crmNewContactOrg=null;
  for(const id of ['crm-act-typeahead','crm-add-name-suggest']){const el=document.getElementById(id);if(el)el.style.display='none';}}
window.crmModalClose=()=>{crmCloseModals();render();};
// Backdrop click on a CRM modal: ignore drag-outs (press started inside the
// box), and if the form holds anything typed or changed, keep the window open
// with a toast — only Cancel / × discard. Fixes lost conversation notes that
// vanished mid-typing when a text selection slipped off the modal (Joe, 13 Aug).
function crmModalDirty(box){
  try{
    for(const el of box.querySelectorAll('input,textarea')){
      if(el.type==='checkbox'||el.type==='radio'){if(el.checked!==el.defaultChecked)return true;}
      else if((el.value||'')!==(el.defaultValue||''))return true;
    }
    for(const sl of box.querySelectorAll('select')){
      let di=-1;for(let k=0;k<sl.options.length;k++)if(sl.options[k].defaultSelected){di=k;break;}
      if(sl.selectedIndex!==(di<0?0:di))return true;
    }
  }catch(e){}
  return false;
}
window.crmOverlayClick=function(ev){
  if(ev.target!==ev.currentTarget)return;
  if(window._ovMd!==ev.currentTarget)return; // press began inside — a drag-out, never a close
  const box=ev.currentTarget.querySelector('.modal-box');
  if(box&&crmModalDirty(box)){undoToast('Unsaved changes — \u201cSave and close\u201d keeps them, or click \u00d7 twice to discard');return;}
  crmModalClose();
};
// The header ×: a dirty form arms on the first click (warning toast) and only
// discards on the second — nobody loses typed details to a reflex × any more.
// The arm resets whenever any CRM modal opens or closes (crmCloseModals).
let _crmXArm=false;
window.crmModalX=function(btn){
  try{
    const box=btn&&btn.closest?btn.closest('.modal-box'):null;
    if(box&&crmModalDirty(box)&&!_crmXArm){
      _crmXArm=true;
      undoToast('Unsaved changes — click \u00d7 again to discard them, or use \u201cSave and close\u201d');
      return;
    }
  }catch(e){}
  crmModalClose();
};

window.crmOpenOrg=id=>{crmCloseModals();crmOrgModal=id;if(st._tab!=='crm')st._tab='crm';render();};

window.crmOpenLog=()=>{crmCloseModals();crmLogModal=true;render();};

window.crmOpenEvent=id=>{crmCloseModals();crmEventModal=id;render();};

function crmModalShell(title,body,footer,width){
  return`<div class="modal-overlay" onclick="crmOverlayClick(event)">
    <div class="modal-box" onclick="event.stopPropagation()" style="max-width:${width||860}px;width:94vw;max-height:92vh;overflow-y:auto;padding:0">
      <div style="position:sticky;top:0;background:#fff;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:15px 22px;border-bottom:1px solid var(--mid)"><span style="font-size:16px;font-weight:700;color:var(--blk)">${title}</span><button onclick="crmModalX(this)" title="Close — unsaved changes warn first" style="background:var(--off);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px;font-weight:700;color:var(--dkgrey)">×</button></div>
      <div style="padding:20px 22px">${body}</div>
      <div class="note-popover-footer" style="position:sticky;bottom:0;background:#fff;padding:12px 18px">${footer}</div>
    </div>
  </div>`;
}
function crmOrgDatalist(id){return`<datalist id="${id}">${[...st.crmOrgs].sort((a,b)=>a.name.localeCompare(b.name)).map(o=>`<option value="${escAttr(o.name)}">`).join('')}</datalist>`;}
function crmFindOrCreateOrgByName(name,extra){
  name=String(name||'').trim();if(!name)return null;
  let o=st.crmOrgs.find(x=>x.name.trim().toLowerCase()===name.toLowerCase());
  if(!o){
    const cl=st.clients.find(c=>String(c.company||'').trim().toLowerCase()===name.toLowerCase());
    o={id:crmId('co'),name,website:'',sectors:(extra&&extra.sectors)||[],notes:'',rating:(extra&&extra.rating)||'warm',clientId:cl?cl.id:null,createdBy:cur().name,createdAt:crmTodayISO()};
    st.crmOrgs.push(o);
  }
  return o;
}
